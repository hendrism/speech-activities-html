<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Figurative Language - One at a Time</title>
    <style>
        :root {
            --midnight: #0f172a;
            --frost: #e2e8f0;
            --sky: #38bdf8;
            --pine: #0f766e;
            --snow: #f8fafc;
            --sun: #fbbf24;
            --berry: #7c3aed;
            --rose: #f472b6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 15% 20%, #f1f5f9, #e0f2fe 60%, #f8fafc);
            color: var(--midnight);
            line-height: 1.6;
            padding: 24px 16px 48px;
        }
        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: var(--pine);
            letter-spacing: 0.3px;
        }
        .intro {
            max-width: 960px;
            margin: 0 auto 16px;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }
        .intro::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 40%),
                        radial-gradient(circle at 80% 0%, rgba(124, 58, 237, 0.06), transparent 35%);
            pointer-events: none;
        }
        .nav-bar {
            max-width: 960px;
            margin: 0 auto 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            position: sticky;
            top: 0;
            background: rgba(241, 245, 249, 0.92);
            padding: 8px 8px 10px;
            backdrop-filter: blur(6px);
            z-index: 8;
            border-radius: 12px;
            border: 1px solid var(--frost);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
        }
        .nav-bar button {
            border: 1px solid var(--frost);
            background: white;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            font-weight: 700;
            color: var(--midnight);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
            transition: all 0.2s ease;
            text-align: left;
        }
        .nav-bar button:hover { border-color: var(--sky); transform: translateY(-1px); }
        .nav-bar button.active {
            background: linear-gradient(135deg, #e0f2fe, #fef9c3);
            border-color: var(--sky);
            color: #92400e;
        }
        .shell {
            max-width: 960px;
            margin: 0 auto;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            position: relative;
            overflow: hidden;
        }
        .shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.06), transparent 40%),
                        radial-gradient(circle at 90% 10%, rgba(124, 58, 237, 0.05), transparent 35%);
            pointer-events: none;
        }
        .shell-inner { position: relative; z-index: 1; }
        .card {
            border: 1px solid var(--frost);
            border-radius: 12px;
            padding: 16px;
            background: var(--snow);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: linear-gradient(135deg, #e0f2fe, #fef9c3);
            color: #92400e;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .sentence {
            margin: 10px 0 6px;
            font-size: 1.05rem;
        }
        .prompt {
            margin: 0 0 10px;
            font-weight: 700;
            color: var(--pine);
        }
        .response {
            width: 100%;
            min-height: 90px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            margin: 0 0 10px;
            resize: vertical;
        }
        .help-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
        }
        .btn-hint { background: var(--sky); color: white; }
        .btn-support { background: #fef9c3; color: #92400e; }
        .btn-choices { background: var(--sun); color: #92400e; }
        .btn-next { background: var(--pine); color: white; }
        .btn:disabled { background: #cbd5e1; color: #475569; cursor: not-allowed; box-shadow: none; }
        .hint, .support {
            display: none;
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            background: #fefce8;
            border: 1px solid #fbbf24;
            color: #0f172a;
        }
        .support-list {
            margin: 6px 0 0;
            padding-left: 18px;
        }
        .choices {
            display: none;
            grid-template-columns: 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .choice-btn {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            background: white;
            cursor: pointer;
            font-weight: 700;
            text-align: left;
            transition: all 0.2s ease;
        }
        .choice-btn:hover { border-color: var(--sky); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08); }
        .choice-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .choice-btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
        .feedback {
            display: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 700;
            margin-top: 6px;
        }
        .feedback.correct { background: #dcfce7; color: #166534; }
        .feedback.incorrect { background: #fee2e2; color: #7f1d1d; }
        .progress {
            text-align: right;
            font-weight: 700;
            color: #475569;
            margin: 8px 0;
        }
        .image-placeholder {
            margin-top: 8px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #eef2ff 10px, #eef2ff 20px);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            color: #475569;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <h1>Winter Figurative Language</h1>
    <div class="intro">
        One figurative sentence at a time: read it, write your own meaning, then use supports (hint, breakdown, picture cue) before seeing choices. Feedback stays low-pressure, and you control pacing with the Next button.
    </div>
    <div class="nav-bar" id="navBar"></div>
    <div class="shell">
        <div class="shell-inner">
            <div class="progress" id="progress"></div>
            <div id="card"></div>
        </div>
    </div>

    <script>
        const items = [
            {
                phrase: 'a blanket of white',
                sentence: 'The snow fell all night, and by morning the street looked completely different. Every lawn and rooftop was covered in a thick blanket of white.',
                type: 'Metaphor',
                question: 'What does “a blanket of white” mean?',
                hint: 'Think about what a blanket does to a bed and how snow covers everything.',
                breakdown: ['blanket → covers everything', 'white → snow color', 'whole area covered in snow'],
                choices: [
                    { text: 'Everything was covered in snow.', correct: true },
                    { text: 'People left white sheets outside.', correct: false },
                    { text: 'The snow was thin and patchy.', correct: false },
                    { text: 'The houses were painted white.', correct: false }
                ]
            },
            {
                phrase: 'howled like a hungry wolf',
                sentence: 'As Maya stepped outside, the icy wind hit her face. It howled like a hungry wolf as she hurried toward the bus stop.',
                type: 'Simile',
                question: 'What does “howled like a hungry wolf” mean?',
                hint: 'Picture the sound a wolf makes when it is howling loudly.',
                breakdown: ['howled → long, loud sound', 'hungry wolf → intense tone', 'wind noise was strong'],
                choices: [
                    { text: 'The wind made a loud, intense sound.', correct: true },
                    { text: 'Wolves were near her house.', correct: false },
                    { text: 'The wind sounded gentle.', correct: false },
                    { text: 'Maya heard an animal calling her.', correct: false }
                ]
            },
            {
                phrase: 'my fingers are popsicles',
                sentence: 'By the time they finished shoveling the driveway, Liam’s hands were so cold he could barely bend his fingers. “My fingers are popsicles,” he joked, blowing on them to warm up.',
                type: 'Metaphor',
                question: 'What does “my fingers are popsicles” mean?',
                hint: 'Imagine how a popsicle feels when you hold it.',
                breakdown: ['popsicle → frozen treat', 'very cold', 'hands feel icy'],
                choices: [
                    { text: 'His fingers felt very cold.', correct: true },
                    { text: 'His fingers were sticky.', correct: false },
                    { text: 'He was carrying real popsicles.', correct: false },
                    { text: 'His hands were frozen solid.', correct: false }
                ]
            },
            {
                phrase: 'a sheet of glass',
                sentence: 'The frozen lake stretched out across the park. In the morning light, it looked like a smooth sheet of glass.',
                type: 'Metaphor',
                question: 'What does “a sheet of glass” mean?',
                hint: 'Think about how glass looks when it is smooth and shiny.',
                breakdown: ['sheet → flat and smooth', 'glass → shiny surface', 'lake looked smooth and shiny'],
                choices: [
                    { text: 'The lake surface looked smooth and shiny.', correct: true },
                    { text: 'The lake was covered in actual glass.', correct: false },
                    { text: 'The lake cracked loudly.', correct: false },
                    { text: 'The lake was unsafe to look at.', correct: false }
                ]
            },
            {
                phrase: 'as slow as a turtle',
                sentence: 'The class had just come in from recess, and everyone was tired from running in the snow. When the teacher asked them to take their seats, they moved as slow as a turtle.',
                type: 'Simile',
                question: 'What does “as slow as a turtle” mean?',
                hint: 'Turtles are known for moving very slowly.',
                breakdown: ['turtle → slow animal', 'moving extremely slowly', 'tired pace'],
                choices: [
                    { text: 'They were moving very slowly.', correct: true },
                    { text: 'They were confused about where to sit.', correct: false },
                    { text: 'They were walking like animals.', correct: false },
                    { text: 'They didn’t want to sit down.', correct: false }
                ]
            },
            {
                phrase: 'felt like a freezer',
                sentence: 'The heater broke during first period, and the temperature in the classroom dropped fast. By the time the bell rang, the place felt like a freezer.',
                type: 'Metaphor',
                question: 'What does “felt like a freezer” mean?',
                hint: 'A freezer keeps things extremely cold.',
                breakdown: ['freezer → very cold place', 'heater broke → no warmth', 'room felt freezing'],
                choices: [
                    { text: 'The room was extremely cold.', correct: true },
                    { text: 'Ice was forming on the desks.', correct: false },
                    { text: 'Students were storing food in the room.', correct: false },
                    { text: 'The walls were covered in frost.', correct: false }
                ]
            },
            {
                phrase: 'groaned',
                sentence: 'As the snowstorm continued, the old wooden shed behind the school creaked and groaned. It sounded like it was complaining under the heavy snow on its roof.',
                type: 'Personification',
                question: 'What does “groaned” mean here?',
                hint: 'Think of a low, strained sound when something is heavy.',
                breakdown: ['groaned → stressed sound', 'heavy snow weight', 'building creaked from heaviness'],
                choices: [
                    { text: 'The shed made strained noises because of the heavy snow.', correct: true },
                    { text: 'Someone was inside the shed.', correct: false },
                    { text: 'The shed was about to fall apart.', correct: false },
                    { text: 'The shed was talking.', correct: false }
                ]
            },
            {
                phrase: 'dripped like tiny faucets',
                sentence: 'When the sun finally came out, the icicles hanging from the roof began to melt. They dripped like tiny faucets, leaving small puddles on the steps.',
                type: 'Simile',
                question: 'What does “dripped like tiny faucets” mean?',
                hint: 'A leaky faucet drips steadily, one drop after another.',
                breakdown: ['dripped → steady drops', 'tiny faucet → steady dripping', 'icicles melting slowly'],
                choices: [
                    { text: 'The icicles were melting steadily.', correct: true },
                    { text: 'The icicles were leaking water explosively.', correct: false },
                    { text: 'The icicles were freezing again.', correct: false },
                    { text: 'Someone turned on a sink nearby.', correct: false }
                ]
            },
            {
                phrase: 'lit a fire under them',
                sentence: 'The basketball team was moving slowly after running drills in the cold gym. Then the coach gave a short talk that lit a fire under them, and their energy shot back up.',
                type: 'Idiom / Metaphor',
                question: 'What does “lit a fire under them” mean?',
                hint: 'No real fire—think about feeling suddenly energized.',
                breakdown: ['lit a fire → spark energy', 'pep talk → motivation', 'team got excited'],
                choices: [
                    { text: 'They became energized and motivated.', correct: true },
                    { text: 'They got overheated.', correct: false },
                    { text: 'The coach built a real fire.', correct: false },
                    { text: 'They became angry at the coach.', correct: false }
                ]
            },
            {
                phrase: 'tiny ghosts',
                sentence: 'As Olivia walked home in the freezing air, she noticed little puffs of white rising each time she breathed out. “My breath looks like tiny ghosts,” she said, watching the mist float away.',
                type: 'Metaphor',
                question: 'What does “tiny ghosts” mean?',
                hint: 'Think of how breath looks in cold air.',
                breakdown: ['ghost → pale, floating shape', 'breath in cold → white mist', 'small white puff'],
                choices: [
                    { text: 'Her breath looked like small white clouds.', correct: true },
                    { text: 'She saw actual ghosts.', correct: false },
                    { text: 'Her breath disappeared instantly.', correct: false },
                    { text: 'The air was completely still.', correct: false }
                ]
            },
            {
                phrase: 'a white curtain',
                sentence: 'The sky had been gray all morning, but suddenly the clouds opened and snow poured down. It fell so quickly that the playground disappeared in a white curtain.',
                type: 'Metaphor',
                question: 'What does “a white curtain” mean?',
                hint: 'A curtain blocks what you can see.',
                breakdown: ['curtain → blocks view', 'white → snow', 'snow so heavy you cannot see past it'],
                choices: [
                    { text: 'The snow was falling so heavily it blocked the view.', correct: true },
                    { text: 'Someone hung a white sheet outside.', correct: false },
                    { text: 'The snow was only falling in thin lines.', correct: false },
                    { text: 'The playground was painted white.', correct: false }
                ]
            },
            {
                phrase: 'ice bricks',
                sentence: 'Evan stepped onto the bus and stomped the snow off his boots. “My feet are ice bricks,” he said, trying to wiggle his toes.',
                type: 'Metaphor',
                question: 'What does “ice bricks” mean?',
                hint: 'Bricks are hard; ice is cold.',
                breakdown: ['ice → very cold', 'bricks → stiff and hard', 'feet feel stiff and cold'],
                choices: [
                    { text: 'His feet felt stiff and very cold.', correct: true },
                    { text: 'His boots were made of blocks.', correct: false },
                    { text: 'He stepped on actual ice.', correct: false },
                    { text: 'His feet hurt from running.', correct: false }
                ]
            },
            {
                phrase: 'trying to come inside',
                sentence: 'The wind pushed against the windows all night. It kept whistling and rattling the glass like it was trying to come inside.',
                type: 'Personification',
                question: 'What does “trying to come inside” mean?',
                hint: 'Strong wind can sound like it is pushing on the house.',
                breakdown: ['trying to come inside → forceful push', 'wind rattled glass', 'sounded like it wanted in'],
                choices: [
                    { text: 'The wind sounded forceful, as if it was pushing on the house.', correct: true },
                    { text: 'Someone was knocking at the door.', correct: false },
                    { text: 'The house was unsafe during storms.', correct: false },
                    { text: 'The wind was warm and gentle.', correct: false }
                ]
            },
            {
                phrase: 'a blur of motion',
                sentence: 'During the winter festival, kids raced across the snowy hill. Mia took off so quickly that she was a blur of motion on the white slope.',
                type: 'Metaphor',
                question: 'What does “a blur of motion” mean?',
                hint: 'When something moves very fast, you may not see it clearly.',
                breakdown: ['blur → hard to see clearly', 'motion → movement', 'she was moving very fast'],
                choices: [
                    { text: 'She was moving very fast.', correct: true },
                    { text: 'She couldn’t see the hill clearly.', correct: false },
                    { text: 'She fell while running.', correct: false },
                    { text: 'Her jacket blended in with the snow.', correct: false }
                ]
            },
            {
                phrase: 'tiny sparks floating in the air',
                sentence: 'As the early sunset settled over town, the streetlights flickered on. The snowflakes falling past them looked like tiny sparks floating in the air.',
                type: 'Simile',
                question: 'What does “tiny sparks floating in the air” mean?',
                hint: 'Think of how bright sparks look when they float in light.',
                breakdown: ['sparks → bright spots', 'floating in the air → drifting', 'snowflakes looked bright'],
                choices: [
                    { text: 'The snowflakes looked bright as they fell through the streetlights.', correct: true },
                    { text: 'There were fireworks above the street.', correct: false },
                    { text: 'The snowflakes were burning.', correct: false },
                    { text: 'The streetlights were broken.', correct: false }
                ]
            }
        ];

        const progressEl = document.getElementById('progress');
        const cardEl = document.getElementById('card');
        const navBar = document.getElementById('navBar');
        let current = 0;

        function shuffle(array) {
            const copy = array.map(choice => ({ ...choice }));
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightPhrase(sentence, phrase) {
            const pattern = new RegExp(`(${escapeRegex(phrase)})`, 'i');
            return sentence.replace(pattern, '<strong>$1</strong>');
        }

        function renderNav() {
            navBar.innerHTML = '';
            items.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `${idx + 1}. ${item.phrase}`;
                btn.className = idx === current ? 'active' : '';
                btn.addEventListener('click', () => {
                    current = idx;
                    renderCard();
                });
                navBar.appendChild(btn);
            });
        }

        function renderCard() {
            const item = items[current];
            progressEl.textContent = `Item ${current + 1} of ${items.length}`;
            cardEl.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'card';

            const meta = document.createElement('div');
            meta.className = 'meta';
            const h2 = document.createElement('h2');
            h2.textContent = item.phrase;
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = item.type;
            meta.appendChild(h2);
            meta.appendChild(tag);
            card.appendChild(meta);

            const sentence = document.createElement('p');
            sentence.className = 'sentence';
            sentence.innerHTML = highlightPhrase(item.sentence, item.phrase);
            card.appendChild(sentence);

            const prompt = document.createElement('div');
            prompt.className = 'prompt';
            prompt.textContent = item.question;
            card.appendChild(prompt);

            const response = document.createElement('textarea');
            response.className = 'response';
            response.placeholder = 'Type your own meaning here first...';
            card.appendChild(response);

            const helpRow = document.createElement('div');
            helpRow.className = 'help-row';
            const hintBtn = document.createElement('button');
            hintBtn.className = 'btn btn-hint';
            hintBtn.textContent = 'Show hint';
            const supportBtn = document.createElement('button');
            supportBtn.className = 'btn btn-support';
            supportBtn.textContent = 'Show supports';
            const choicesBtn = document.createElement('button');
            choicesBtn.className = 'btn btn-choices';
            choicesBtn.textContent = 'Show choices';
            choicesBtn.disabled = true;
            helpRow.appendChild(hintBtn);
            helpRow.appendChild(supportBtn);
            helpRow.appendChild(choicesBtn);
            card.appendChild(helpRow);

            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = item.hint;
            card.appendChild(hint);

            const support = document.createElement('div');
            support.className = 'support';
            support.innerHTML = '<strong>Break it down:</strong>';
            const list = document.createElement('ul');
            list.className = 'support-list';
            item.breakdown.forEach(bit => {
                const li = document.createElement('li');
                li.textContent = bit;
                list.appendChild(li);
            });
            support.appendChild(list);
            const img = document.createElement('div');
            img.className = 'image-placeholder';
            img.textContent = 'Picture cue placeholder';
            support.appendChild(img);
            card.appendChild(support);

            const choicesWrap = document.createElement('div');
            choicesWrap.className = 'choices';
            card.appendChild(choicesWrap);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            card.appendChild(feedback);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn btn-next';
            nextBtn.textContent = current === items.length - 1 ? 'Finish' : 'Next';
            nextBtn.style.marginTop = '8px';
            nextBtn.disabled = true;
            card.appendChild(nextBtn);

            hintBtn.addEventListener('click', () => {
                hint.style.display = 'block';
                choicesBtn.disabled = false;
                hintBtn.disabled = true;
            });

            supportBtn.addEventListener('click', () => {
                support.style.display = support.style.display === 'block' ? 'none' : 'block';
            });

            choicesBtn.addEventListener('click', () => {
                choicesWrap.innerHTML = '';
                choicesWrap.style.display = 'grid';
                feedback.style.display = 'none';
                feedback.textContent = '';
                feedback.className = 'feedback';

                const shuffled = shuffle(item.choices);
                shuffled.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.addEventListener('click', () => {
                        const isCorrect = choice.correct;
                        feedback.textContent = isCorrect
                            ? 'Nice, that’s the meaning of the figurative phrase.'
                            : 'Not quite. Want a hint or want to try again?';
                        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                        feedback.style.display = 'block';
                        if (isCorrect) {
                            choicesWrap.querySelectorAll('button').forEach(b => b.disabled = true);
                            nextBtn.disabled = false;
                        }
                        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                    });
                    choicesWrap.appendChild(btn);
                });
                choicesBtn.disabled = true;
            });

            nextBtn.addEventListener('click', () => {
                if (current < items.length - 1) {
                    current += 1;
                    renderCard();
                    renderNav();
                } else {
                    progressEl.textContent = 'All done! You finished the set.';
                    cardEl.innerHTML = '';
                }
            });

            cardEl.appendChild(card);
            renderNav();
        }

        renderCard();
    </script>
</body>
</html>
