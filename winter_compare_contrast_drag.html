<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Compare & Contrast Drag-and-Drop</title>
    <style>
        :root {
            --sky: #38bdf8;
            --frost: #e2e8f0;
            --ink: #0f172a;
            --snow: #f8fafc;
            --spruce: #0f766e;
            --warm: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 20% 20%, #e0f2fe, #f8fafc 60%);
            color: var(--ink);
            padding: 18px 12px 48px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: var(--spruce);
        }
        .intro {
            max-width: 1100px;
            margin: 0 auto 14px;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        }
        .set {
            max-width: 1100px;
            margin: 0 auto 14px;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }
        .set h2 {
            margin: 0 0 10px;
            color: var(--spruce);
        }
        .nav {
            max-width: 1100px;
            margin: 0 auto 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .nav button {
            border: 1px solid var(--frost);
            background: white;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 700;
            color: var(--ink);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
            transition: all 0.2s ease;
        }
        .nav button.active {
            background: linear-gradient(135deg, #e0f2fe, #fef9c3);
            border-color: var(--sky);
            color: #92400e;
        }
        .columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }
        .drop {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            min-height: 90px;
            padding: 10px;
            background: var(--snow);
        }
        .drop h3 {
            margin: 0 0 6px;
            font-size: 1rem;
            color: #334155;
        }
        .images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            margin-bottom: 8px;
        }
        .img-card {
            background: var(--snow);
            border: 1px solid var(--frost);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
        }
        .img-card img {
            max-width: 100%;
            max-height: 140px;
            object-fit: contain;
            border-radius: 8px;
        }
        .placeholder-img {
            color: #94a3b8;
            font-weight: 700;
            padding: 12px 8px;
        }
        .placeholder {
            color: #94a3b8;
            font-weight: 700;
        }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .chip {
            border: 1px solid var(--frost);
            background: #ecfeff;
            color: var(--ink);
            padding: 10px 12px;
            border-radius: 999px;
            font-weight: 800;
            cursor: grab;
            font-size: 18px;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
        }
        .chip:active {
            cursor: grabbing;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.1);
            transition: all 0.15s ease;
        }
        .btn-primary { background: var(--spruce); color: white; }
        .btn-secondary { background: #fef9c3; color: #92400e; border: 1px solid #facc15; }
        .feedback {
            margin-top: 8px;
            font-weight: 800;
        }
        .correct { color: #15803d; }
        .incorrect { color: #b91c1c; }
        @media (max-width: 820px) {
            .chip { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <h1>Winter Compare & Contrast</h1>
    <div class="intro">
        Drag each fact to the correct column for the pair. Sort two facts under each item and two facts under <strong>Both</strong>. Tap Reset if you want to start over or Check answers for instant feedback.
    </div>

    <div class="nav" id="navBar"></div>
    <div class="set" id="setView">
        <h2 id="setTitle"></h2>
        <div class="images" id="imageRow"></div>
        <div class="columns" id="columns"></div>
        <div class="chips" id="chipsRow"></div>
        <div class="actions">
            <button class="btn btn-secondary" id="resetBtn" type="button">Reset</button>
            <button class="btn btn-primary" id="checkBtn" type="button">Check answers</button>
        </div>
        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        const data = [
            {
                title: 'Snowman vs Snowball',
                a: 'Snowman',
                b: 'Snowball',
                imageA: 'images/winter_items/snowman.jpg',
                imageB: 'images/winter_items/snowball.jpg',
                facts: [
                    { text: 'has a body', target: 'a' },
                    { text: 'stands up', target: 'a' },
                    { text: 'small', target: 'b' },
                    { text: 'easy to throw', target: 'b' },
                    { text: 'made of snow', target: 'both' },
                    { text: 'cold', target: 'both' }
                ]
            },
            {
                title: 'Mitten vs Glove',
                a: 'Mitten',
                b: 'Glove',
                imageA: 'images/winter_items/mittens.png',
                imageB: 'images/winter_items/gloves.png',
                facts: [
                    { text: 'one space for fingers', target: 'a' },
                    { text: 'warm', target: 'a' },
                    { text: 'separate fingers', target: 'b' },
                    { text: 'good for gripping', target: 'b' },
                    { text: 'worn on hands', target: 'both' },
                    { text: 'used in winter', target: 'both' }
                ]
            },
            {
                title: 'Ice Skates vs Boots',
                a: 'Ice skates',
                b: 'Boots',
                imageA: 'images/new_winter_items/ice_skates.jpg',
                imageB: 'images/winter_items/boots.png',
                facts: [
                    { text: 'have blades', target: 'a' },
                    { text: 'used on ice', target: 'a' },
                    { text: 'have thick soles', target: 'b' },
                    { text: 'used for walking', target: 'b' },
                    { text: 'worn on feet', target: 'both' },
                    { text: 'protect from cold', target: 'both' }
                ]
            },
            {
                title: 'Sled vs Snowboard',
                a: 'Sled',
                b: 'Snowboard',
                imageA: 'images/winter_items/sled.jpg',
                imageB: 'images/new_winter_items/snowboard.jpg',
                facts: [
                    { text: 'can sit on it', target: 'a' },
                    { text: 'can carry more than one person', target: 'a' },
                    { text: 'you stand on it', target: 'b' },
                    { text: 'used for tricks or sliding', target: 'b' },
                    { text: 'slide on snow', target: 'both' },
                    { text: 'used for fun', target: 'both' }
                ]
            },
            {
                title: 'Hot Chocolate vs Warm Tea',
                a: 'Hot chocolate',
                b: 'Warm tea',
                imageA: 'images/compare_contrast_seasonal/hot_chocolate_1.jpg',
                imageB: 'images/new_winter_items/warm_tea.jpg',
                facts: [
                    { text: 'sweet', target: 'a' },
                    { text: 'made with cocoa', target: 'a' },
                    { text: 'mild flavor', target: 'b' },
                    { text: 'made with leaves', target: 'b' },
                    { text: 'warm drinks', target: 'both' },
                    { text: 'good on cold days', target: 'both' }
                ]
            },
            {
                title: 'Snow Shovel vs Broom',
                a: 'Snow shovel',
                b: 'Broom',
                imageA: 'images/winter_items/snow-shovel.jpg',
                imageB: 'images/new_winter_items/broom.jpg',
                facts: [
                    { text: 'scoops snow', target: 'a' },
                    { text: 'heavy', target: 'a' },
                    { text: 'sweeps light things', target: 'b' },
                    { text: 'light to hold', target: 'b' },
                    { text: 'used for cleaning', target: 'both' },
                    { text: 'held with hands', target: 'both' }
                ]
            },
            {
                title: 'Puffy Coat vs Raincoat',
                a: 'Puffy coat',
                b: 'Raincoat',
                imageA: 'images/winter_items/winter-coat.png',
                imageB: 'images/new_winter_items/raincoat.jpg',
                facts: [
                    { text: 'filled with padding', target: 'a' },
                    { text: 'very warm', target: 'a' },
                    { text: 'thin', target: 'b' },
                    { text: 'keeps water out', target: 'b' },
                    { text: 'worn outdoors', target: 'both' },
                    { text: 'protect your body', target: 'both' }
                ]
            },
            {
                title: 'Ice vs Snow',
                a: 'Ice',
                b: 'Snow',
                imageA: 'images/winter_items/ice_1.jpg',
                imageB: 'images/new_winter_items/snow.jpg',
                facts: [
                    { text: 'hard', target: 'a' },
                    { text: 'smooth', target: 'a' },
                    { text: 'soft', target: 'b' },
                    { text: 'fluffy', target: 'b' },
                    { text: 'cold', target: 'both' },
                    { text: 'made of water', target: 'both' }
                ]
            },
            {
                title: 'Penguin vs Polar Bear',
                a: 'Penguin',
                b: 'Polar bear',
                imageA: 'images/new_winter_items/penguins.jpg',
                imageB: 'images/new_winter_items/polar_bear.jpg',
                facts: [
                    { text: 'has flippers', target: 'a' },
                    { text: 'waddles', target: 'a' },
                    { text: 'has paws', target: 'b' },
                    { text: 'walks on four legs', target: 'b' },
                    { text: 'live in cold places', target: 'both' },
                    { text: 'thick bodies to stay warm', target: 'both' }
                ]
            },
            {
                title: 'Scarf vs Hat',
                a: 'Scarf',
                b: 'Hat',
                imageA: 'images/winter_items/scarf.png',
                imageB: 'images/winter_items/winter-hat.jpg',
                facts: [
                    { text: 'wraps around neck', target: 'a' },
                    { text: 'long', target: 'a' },
                    { text: 'sits on head', target: 'b' },
                    { text: 'round', target: 'b' },
                    { text: 'clothing for winter', target: 'both' },
                    { text: 'keep you warm', target: 'both' }
                ]
            }
        ];

        const navBar = document.getElementById('navBar');
        const setTitle = document.getElementById('setTitle');
        const imageRow = document.getElementById('imageRow');
        const columns = document.getElementById('columns');
        const chipsRow = document.getElementById('chipsRow');
        const resetBtn = document.getElementById('resetBtn');
        const checkBtn = document.getElementById('checkBtn');
        const feedback = document.getElementById('feedback');

        let current = 0;

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function buildNav() {
            navBar.innerHTML = data.map((set, idx) => `
                <button data-idx="${idx}" class="${idx === current ? 'active' : ''}">${idx + 1}. ${set.title}</button>
            `).join('');
            navBar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    current = parseInt(btn.dataset.idx, 10);
                    renderSet();
                    navBar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        function renderImages(set) {
            imageRow.innerHTML = '';
            const items = [
                { label: set.a, src: set.imageA },
                { label: 'Both', src: '' },
                { label: set.b, src: set.imageB }
            ];
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'img-card';
                const label = document.createElement('div');
                label.style.fontWeight = '800';
                label.style.marginBottom = '4px';
                label.textContent = item.label;
                card.appendChild(label);
                if (item.src) {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.label;
                    card.appendChild(img);
                }
                imageRow.appendChild(card);
            });
        }

        function renderColumns(set) {
            columns.innerHTML = '';
            columns.appendChild(buildDrop('a', set.a));
            columns.appendChild(buildDrop('both', 'Both'));
            columns.appendChild(buildDrop('b', set.b));
        }

        function buildDrop(key, label) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.dataset.dropKey = key;
            const heading = document.createElement('h3');
            heading.textContent = label;
            drop.appendChild(heading);
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder';
            placeholder.textContent = 'Drop facts here';
            drop.appendChild(placeholder);
            drop.addEventListener('dragover', e => e.preventDefault());
            drop.addEventListener('drop', handleDrop);
            return drop;
        }

        function renderChips(set) {
            chipsRow.innerHTML = '';
            shuffle(set.facts).forEach((fact, idx) => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.textContent = fact.text;
                chip.draggable = true;
                chip.dataset.target = fact.target;
                chip.dataset.id = `chip-${current}-${idx}`;
                chip.addEventListener('dragstart', handleDragStart);
                chipsRow.appendChild(chip);
            });
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.id);
        }

        function handleDrop(e) {
            e.preventDefault();
            const chipId = e.dataTransfer.getData('text/plain');
            const chip = document.querySelector(`.chip[data-id="${chipId}"]`);
            if (chip && chip.parentElement) {
                this.querySelectorAll('.placeholder').forEach(p => p.remove());
                this.appendChild(chip);
            }
        }

        function resetView() {
            const set = data[current];
            renderChips(set);
            renderColumns(set);
            feedback.textContent = '';
            feedback.className = 'feedback';
        }

        function checkAnswers() {
            const set = data[current];
            const total = set.facts.length;
            const placed = Array.from(document.querySelectorAll('.chip')).filter(chip => chip.parentElement && chip.parentElement.classList.contains('drop'));
            if (placed.length !== total) {
                feedback.textContent = 'Place all facts, then check.';
                feedback.className = 'feedback incorrect';
                return;
            }
            let correct = 0;
            document.querySelectorAll('.drop').forEach(drop => {
                const expected = drop.dataset.dropKey;
                drop.querySelectorAll('.chip').forEach(chip => {
                    const isCorrect = chip.dataset.target === expected;
                    chip.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';
                    chip.style.background = isCorrect ? '#dcfce7' : '#fee2e2';
                    if (isCorrect) correct += 1;
                });
            });
            if (correct === total) {
                feedback.textContent = 'Great match! Everything is in the right column.';
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = 'Some facts need to move. Check the red chips.';
                feedback.className = 'feedback incorrect';
            }
        }

        function renderSet() {
            const set = data[current];
            setTitle.textContent = set.title;
            renderImages(set);
            renderColumns(set);
            renderChips(set);
            feedback.textContent = '';
            feedback.className = 'feedback';
        }

        resetBtn.addEventListener('click', resetView);
        checkBtn.addEventListener('click', checkAnswers);

        buildNav();
        renderSet();
    </script>
</body>
</html>
