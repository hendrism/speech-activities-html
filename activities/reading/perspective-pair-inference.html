<!DOCTYPE html>
<!--
Activity: Perspective & Inference Pairs
Description: Practice taking another person's perspective and inferring feelings.
Tags: Perspective, Inference, Social Thinking
-->

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perspective Pair Inference Practice</title>
    <script src="../../data/stories.js"></script>
    <script src="../../js/data-loader.js"></script>
<style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --primary: #7c3aed;
      --secondary: #0ea5e9;
      --text: #0f172a;
      --muted: #475569;
      --radius: 18px;
      --width: 960px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 18px 36px rgba(124, 58, 237, 0.35);
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 32px;
      letter-spacing: 0.01em;
    }

    header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.92;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-bar {
      background: #0f172a;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.35);
    }

    .nav-buttons {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .nav-btn {
      border: none;
      background: rgba(148, 163, 184, 0.18);
      color: #e2e8f0;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: rgba(226, 232, 240, 0.2);
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 8px 18px rgba(56, 189, 248, 0.35);
    }

    main {
      max-width: var(--width);
      margin: 28px auto 56px;
      padding: 0 18px;
    }

    .scenario {
      display: none;
    }

    .scenario.active {
      display: block;
      animation: fadeIn 0.25s ease;
      page-break-before: always;
      padding-bottom: 40px;
    }

    .scenario:first-of-type {
      page-break-before: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scenario-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.18);
      border: 2px solid rgba(148, 163, 184, 0.2);
    }

    .scenario-header {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .scenario-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }

    .context-tag {
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(14, 165, 233, 0.24);
      color: #0f4a6e;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .scenario-text {
      background: rgba(148, 163, 184, 0.12);
      border-left: 5px solid var(--secondary);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .clue-container {
      margin-bottom: 22px;
    }

    .clue-toggle {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .clue-toggle:hover {
      background: #6d28d9;
    }

    .clue-panel {
      background: rgba(124, 58, 237, 0.08);
      border: 2px dashed rgba(124, 58, 237, 0.3);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      display: none;
    }

    .clue-panel.visible {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .clue-panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #5b21b6;
    }

    .clue-panel ul {
      margin: 0;
      padding-left: 20px;
    }

    .perspective-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .perspective-card {
      background: #ffffff;
      border-radius: 14px;
      border: 2px solid rgba(148, 163, 184, 0.25);
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .person-label {
      font-weight: 700;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      border: 2px solid rgba(148, 163, 184, 0.4);
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-family: inherit;
      min-height: 120px;
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #f8fafc;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
      background: white;
    }

    .prompt-hint {
      font-size: 14px;
      color: var(--muted);
      background: rgba(148, 163, 184, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
    }

    @media (max-width: 720px) {
      header h1 {
        font-size: 26px;
      }

      .scenario-card {
        padding: 20px;
      }
    }

    @media print {
      header, .nav-bar {
        display: none;
      }

      main {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }

      .scenario {
        display: block !important;
        page-break-before: always;
      }

      .scenario:first-of-type {
        page-break-before: auto;
      }

      .scenario-card {
        box-shadow: none;
        border: none;
        border-bottom: 3px solid rgba(148, 163, 184, 0.35);
        border-radius: 0;
      }
    }
  </style>
</head>
<body class="category-reading">
  <header>
    <h1>Perspective Pair Inference Practice</h1>
    <p>
      Read each social scenario. Use the clues to infer how at least two people might be thinking or feeling.
      Explain their perspectives in your own words.
    </p>
  </header>

  <nav class="nav-bar">
    <div class="nav-buttons" id="navButtons"></div>
  </nav>

  <main id="scenarioContainer"></main>

  <script>
    const scenarios = DataLoader.get('stories', 'perspective-pair-inference');

    const navButtonsContainer = document.getElementById("navButtons");
    const scenarioContainer = document.getElementById("scenarioContainer");

    function createScenarioCard(data, index) {
      const scenarioSection = document.createElement("section");
      scenarioSection.className = "scenario";
      scenarioSection.id = `scenario-${index}`;

      scenarioSection.innerHTML = `
        <article class="scenario-card">
          <div class="scenario-header">
            <h2 class="scenario-title">${data.title}</h2>
            <span class="context-tag">${data.context}</span>
          </div>
          <div class="scenario-text">
            ${data.text}
          </div>
          <div class="clue-container">
            <button class="clue-toggle" onclick="toggleClues(${index})">I Need Help</button>
            <div class="clue-panel" id="clues-${index}">
              <h3>Clues to Notice</h3>
              <ul>
                ${data.clues.map(clue => `<li>${clue}</li>`).join("")}
              </ul>
            </div>
          </div>
          <div class="perspective-grid">
            <div class="perspective-card">
              <span class="person-label">${data.personA}'s Perspective</span>
              <div class="prompt-hint">${data.personAHint}</div>
              <textarea placeholder="${data.personA} might be thinking/feeling..."></textarea>
            </div>
            <div class="perspective-card">
              <span class="person-label">${data.personB}'s Perspective</span>
              <div class="prompt-hint">${data.personBHint}</div>
              <textarea placeholder="${data.personB} might be thinking/feeling..."></textarea>
            </div>
          </div>
        </article>
      `;

      return scenarioSection;
    }

    function createNavButton(data, index) {
      const btn = document.createElement("button");
      btn.className = "nav-btn";
      let label = data.title;
      const colonIndex = label.indexOf(":");
      if (colonIndex !== -1) {
        label = label.slice(colonIndex + 1).trim();
      }
      btn.innerHTML = `<strong>${index + 1}.</strong> ${label}`;
      btn.onclick = () => showScenario(index);
      return btn;
    }

    function showScenario(index) {
      document.querySelectorAll(".scenario").forEach((scene) => scene.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach((btn) => btn.classList.remove("active"));

      document.getElementById(`scenario-${index}`).classList.add("active");
      navButtonsContainer.children[index].classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleClues(index) {
      const panel = document.getElementById(`clues-${index}`);
      panel.classList.toggle("visible");
    }

    function init() {
      scenarios.forEach((scenario, index) => {
        scenarioContainer.appendChild(createScenarioCard(scenario, index));
        navButtonsContainer.appendChild(createNavButton(scenario, index));
      });

      showScenario(0);
    }

    init();
  </script>
</body>
</html>
