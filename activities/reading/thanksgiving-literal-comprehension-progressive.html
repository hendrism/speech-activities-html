<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanksgiving Literal Comprehension Stories</title>
    <script src="../../data/stories.js"></script>
    <script src="../../js/data-loader.js"></script>
<style>
        :root {
            --orange: #f08a24;
            --deep-orange: #d35400;
            --soft-cream: #fff7ed;
            --stone: #334155;
            --soft-blue: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(120deg, #fff3e0, #ffe0b2);
            margin: 0;
            padding: 0;
            color: var(--stone);
        }
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 20px 40px;
        }
        h1 {
            text-align: center;
            color: var(--deep-orange);
            margin-bottom: 8px;
        }
        .intro {
            background: white;
            border: 1px solid #f1dec6;
            border-radius: 14px;
            padding: 16px 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .nav-bar {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(3px);
            border: 1px solid #f1dec6;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 10;
        }
        .nav-btn {
            border: 1px solid #f1dec6;
            background: var(--soft-cream);
            color: var(--stone);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .nav-btn:hover {
            background: #ffe8cc;
            border-color: #f5c086;
        }
        .nav-btn.active {
            background: var(--deep-orange);
            color: white;
            border-color: var(--deep-orange);
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.35);
        }
        .story-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #f1dec6;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-top: 16px;
        }
        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #f1dec6;
            padding-bottom: 10px;
        }
        .story-title {
            color: var(--deep-orange);
            margin: 0;
        }
        .story-level {
            background: var(--soft-blue);
            color: #0f172a;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .story-text {
            margin: 16px 0 8px;
            line-height: 1.7;
            background: var(--soft-cream);
            padding: 14px;
            border-radius: 12px;
            border: 1px dashed #f1dec6;
        }
        .questions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }
        .question-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            background: #f8fafc;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .question-text {
            font-weight: 700;
        }
        .clue {
            display: none;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            padding: 10px;
            color: #92400e;
        }
        .choice-btn {
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .choice-btn:hover {
            border-color: #94a3b8;
            background: #e2e8f0;
        }
        .choice-btn.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
            font-weight: 700;
        }
        .choice-btn.incorrect {
            background: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }
        .help-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-clue {
            background: #0ea5e9;
            color: white;
        }
        .btn-clue:disabled,
        .btn-choices:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            color: #475569;
        }
        .btn-choices {
            background: var(--orange);
            color: white;
        }
        .choices-wrap {
            display: none;
            margin-top: 4px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .feedback {
            display: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 700;
        }
        .feedback.correct {
            background: #dcfce7;
            color: #166534;
        }
        .feedback.incorrect {
            background: #fee2e2;
            color: #7f1d1d;
        }
        @media (max-width: 640px) {
            .nav-bar {
                position: static;
            }
        }
    </style>
</head>
<body class="category-reading">
    <div class="page">
        <h1>Thanksgiving Literal Comprehension Stories</h1>
        <div class="intro">
            Use the top bar to jump between ten stories. For each question, first tap "Show clue" to read a written hint, then unlock four randomized choices. Pick an answer and the card will mark it right or wrong so you can keep going.
        </div>
        <div class="nav-bar" id="story-nav"></div>
        <div id="story-container"></div>
    </div>
    <script>
        const stories = DataLoader.get('stories', 'thanksgiving-literal-comprehension-progressive');

        const navBar = document.getElementById('story-nav');
        const storyContainer = document.getElementById('story-container');
        let activeStoryId = stories[0].id;

        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function renderNav() {
            navBar.innerHTML = '';
            stories.forEach((story, index) => {
                const btn = document.createElement('button');
                btn.className = story.id === activeStoryId ? 'nav-btn active' : 'nav-btn';
                btn.textContent = `${index + 1}. ${story.title}`;
                btn.addEventListener('click', () => {
                    activeStoryId = story.id;
                    renderNav();
                    renderStory();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                navBar.appendChild(btn);
            });
        }

        function renderStory() {
            const story = stories.find((s) => s.id === activeStoryId);
            if (!story) return;

            storyContainer.innerHTML = '';
            const card = document.createElement('article');
            card.className = 'story-card';

            const header = document.createElement('div');
            header.className = 'story-header';

            const title = document.createElement('h2');
            title.className = 'story-title';
            title.textContent = story.title;

            const badge = document.createElement('div');
            badge.className = 'story-level';
            badge.textContent = `${story.level} • 5 questions`;

            header.appendChild(title);
            header.appendChild(badge);

            const text = document.createElement('div');
            text.className = 'story-text';
            text.textContent = story.text;

            const questionsWrap = document.createElement('div');
            questionsWrap.className = 'questions';
            story.questions.forEach((q, idx) => {
                questionsWrap.appendChild(createQuestionCard(q, idx));
            });

            card.appendChild(header);
            card.appendChild(text);
            card.appendChild(questionsWrap);

            storyContainer.appendChild(card);
        }

        function createQuestionCard(question, index) {
            const card = document.createElement('div');
            card.className = 'question-card';

            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = `${index + 1}. ${question.prompt}`;

            const helpRow = document.createElement('div');
            helpRow.className = 'help-row';

            const clueBtn = document.createElement('button');
            clueBtn.className = 'btn btn-clue';
            clueBtn.textContent = 'Show clue';

            const choicesBtn = document.createElement('button');
            choicesBtn.className = 'btn btn-choices';
            choicesBtn.textContent = 'Show answer choices';
            choicesBtn.disabled = true;

            helpRow.appendChild(clueBtn);
            helpRow.appendChild(choicesBtn);

            const clueBox = document.createElement('div');
            clueBox.className = 'clue';
            clueBox.textContent = `Clue: ${question.clue}`;

            const choicesWrap = document.createElement('div');
            choicesWrap.className = 'choices-wrap';

            const feedback = document.createElement('div');
            feedback.className = 'feedback';

            clueBtn.addEventListener('click', () => {
                clueBox.style.display = 'block';
                clueBtn.disabled = true;
                choicesBtn.disabled = false;
            });

            choicesBtn.addEventListener('click', () => {
                renderChoices(choicesWrap, question);
                choicesWrap.style.display = 'grid';
                choicesBtn.disabled = true;
            });

            card.appendChild(questionText);
            card.appendChild(helpRow);
            card.appendChild(clueBox);
            card.appendChild(choicesWrap);
            card.appendChild(feedback);

            return card;
        }

        function renderChoices(container, question) {
            container.innerHTML = '';
            const feedback = container.parentElement.querySelector('.feedback');
            feedback.style.display = 'none';
            feedback.className = 'feedback';

            const options = shuffle(question.choices);
            options.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice;
                btn.addEventListener('click', () => {
                    handleAnswer(btn, container, question.answer, feedback);
                });
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn, container, correctAnswer, feedback) {
            const buttons = container.querySelectorAll('.choice-btn');
            buttons.forEach((btn) => {
                btn.disabled = true;
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            if (selectedBtn.textContent === correctAnswer) {
                feedback.textContent = 'Correct! Great reading.';
                feedback.classList.add('correct');
            } else {
                selectedBtn.classList.add('incorrect');
                feedback.textContent = 'Not quite. The correct answer is highlighted.';
                feedback.classList.add('incorrect');
            }
            feedback.style.display = 'block';
        }

        renderNav();
        renderStory();
    </script>
</body>
</html>
