<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Is the Author Trying to Do?</title>
    <script src="../../data/stories.js"></script>
    <script src="../../js/data-loader.js"></script>
</head>

<body class="category-reading">

    <header>
        <div class="header-title">
            <span>📝</span> What Is the Author Trying to Do?
        </div>
        <a href="../../index.html" class="btn btn-outline">Exit to Hub</a>
    </header>

    <!-- Nav -->
    <nav class="nav-scroller" id="nav">
        <!-- Generated -->
    </nav>

    <main class="container">

        <!-- Directions Card (Only on first item or dismissible?) -> Let's put directions in the activity flow -->

        <div class="card fade-in" id="activityCard">
            <!-- Content injected here -->
        </div>

    </main>

    <script>
        const data = DataLoader.get('stories', 'author-purpose-msg');

        const wordBank = [
            { word: "tell", def: "give facts" },
            { word: "explain", def: "help you understand" },
            { word: "try to get you to", def: "make you do something" },
            { word: "warn", def: "tell about danger or a problem" },
            { word: "remind", def: "help you remember" },
            { word: "sell", def: "get you to buy or come" }
        ];

        let currentIndex = 0;

        function init() {
            renderNav();
            renderItem(0);
        }

        function renderNav() {
            const nav = document.getElementById('nav');
            nav.innerHTML = '';
            data.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `nav-item ${idx === currentIndex ? 'active' : ''}`;
                btn.textContent = `${idx + 1}. ${item.title}`;
                btn.onclick = () => {
                    currentIndex = idx;
                    renderNav();
                    renderItem(idx);
                };
                nav.appendChild(btn);
            });
        }

        function renderItem(index) {
            const item = data[index];
            const card = document.getElementById('activityCard');

            // Re-render card content
            card.innerHTML = `
                <div class="story-header">
                    <h2 class="story-title">${item.title}</h2>
                </div>
                
                <div class="story-text">${item.text}</div>

                <div class="word-bank-section">
                    <div class="section-label">
                        <span>Word Bank: What is the author trying to do?</span>
                        <button class="btn btn-outline" style="padding: 2px 8px; font-size: 0.8rem; margin-left: auto;" onclick="toggleHelper()">
                            ? Help
                        </button>
                    </div>
                    <div class="word-chips">
                        ${wordBank.map(w => `<div class="word-chip" onclick="insertWord('${w.word}')">${w.word}</div>`).join('')}
                    </div>
                    
                    <div class="helper-content" id="helperContent">
                        ${wordBank.map(w => `
                            <div class="helper-row">
                                <div class="helper-word">${w.word}</div>
                                <div class="helper-def">= ${w.def}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="writing-section">
                    <div class="section-label">Use one of these sentence frames:</div>
                    <div class="frame-box">
                        <span class="frame-option">"I think the author is trying to __________ because __________."</span>
                        <span class="frame-option">OR</span>
                        <span class="frame-option">"The author is trying to __________ by __________."</span>
                    </div>
                    <textarea id="userInput" placeholder="Type your sentence here..."></textarea>
                </div>

                <div class="controls">
                    <button class="btn btn-outline" onclick="prevItem()" ${index === 0 ? 'disabled' : ''}>Previous</button>
                    <span style="color: var(--text-muted); font-size: 0.9rem;">${index + 1} / ${data.length}</span>
                    <button class="btn btn-primary" onclick="nextItem()">${index === data.length - 1 ? 'Finish' : 'Next'}</button>
                </div>
            `;
        }

        // --- Logic ---

        function toggleHelper() {
            const h = document.getElementById('helperContent');
            h.style.display = h.style.display === 'block' ? 'none' : 'block';
        }

        function insertWord(word) {
            const textarea = document.getElementById('userInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const before = text.substring(0, start);
            const after = text.substring(end, text.length);

            // Add space if needed
            let insertText = word;
            if (before.length > 0 && !before.endsWith(' ')) insertText = ' ' + insertText;
            if (after.length > 0 && !after.startsWith(' ')) insertText = insertText + ' ';

            textarea.value = before + insertText + after;
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + insertText.length;
        }

        function prevItem() {
            if (currentIndex > 0) {
                currentIndex--;
                renderNav();
                renderItem(currentIndex);
            }
        }

        function nextItem() {
            if (currentIndex < data.length - 1) {
                currentIndex++;
                renderNav();
                renderItem(currentIndex);
            } else {
                alert('Great job! You have completed all the passages.');
            }
        }

        // Init
        init();

    </script>
</body>

</html>
