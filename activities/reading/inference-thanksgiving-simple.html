<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanksgiving Inferences – Easy</title>
    <script src="../../data/stories.js"></script>
    <script src="../../js/data-loader.js"></script>
</head>
<body class="category-reading">
    <header>
        <div class="header-content">
            <h1>🦃 Inferences – Easy</h1>
            <div class="badge">Thanksgiving Stories</div>
        </div>
    </header>

    <div class="container">
        <div class="info-box">
            <h3>How it works</h3>
            <p>Read the short story. Answer the question. If you need it, press “I need help” for a clue, or “I need more help” to see choices (one is correct).</p>
        </div>

        <div class="story-nav" id="storyNav"></div>

        <div class="card">
            <h3 class="story-title" id="storyTitle"></h3>
            <p class="story-text" id="storyText"></p>
            <div id="questions"></div>
        </div>
    </div>

    <script>
        const stories = DataLoader.get('stories', 'inference-thanksgiving-simple');

        let current = 0;
        const storyNav = document.getElementById("storyNav");
        const titleEl = document.getElementById("storyTitle");
        const textEl = document.getElementById("storyText");
        const questionsEl = document.getElementById("questions");

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildNav() {
            storyNav.innerHTML = stories.map((s, i) => `<button class="pill" data-index="${i}">${i + 1}. ${s.title}</button>`).join("");
            storyNav.querySelectorAll(".pill").forEach(btn => {
                btn.addEventListener("click", () => {
                    current = parseInt(btn.dataset.index, 10);
                    renderStory();
                    document.querySelector(".card").scrollIntoView({ behavior: "smooth" });
                });
            });
        }

        function renderStory() {
            const story = stories[current];
            titleEl.textContent = story.title;
            textEl.textContent = story.text;
            storyNav.querySelectorAll(".pill").forEach((btn, i) => btn.classList.toggle("active", i === current));

            questionsEl.innerHTML = story.questions.map((q, idx) => {
                const shuffledChoices = shuffle(q.choices.map((text, choiceIndex) => ({ text, correct: choiceIndex === 0 })));
                return `
                    <div class="question-card" data-q="${idx}">
                        <h4>Q${idx + 1}. ${q.prompt}</h4>
                        <textarea placeholder="Type your answer..."></textarea>
                        <div class="helper-row">
                            <button class="btn hint-btn">I need help</button>
                            <button class="btn more-btn">I need more help</button>
                        </div>
                        <div class="hint-box">Hint: ${q.hint}</div>
                        <div class="options" data-state="hidden">
                            ${shuffledChoices.map((choice, i) => `
                                <button class="option" data-correct="${choice.correct}">${choice.text}</button>
                            `).join("")}
                        </div>
                    </div>
                `;
            }).join("");

            attachHandlers();
        }

        function attachHandlers() {
            questionsEl.querySelectorAll(".question-card").forEach(card => {
                const hintBox = card.querySelector(".hint-box");
                const optionsBox = card.querySelector(".options");
                card.querySelector(".hint-btn").addEventListener("click", () => {
                    hintBox.style.display = hintBox.style.display === "block" ? "none" : "block";
                });
                card.querySelector(".more-btn").addEventListener("click", () => {
                    const showing = optionsBox.style.display === "block";
                    optionsBox.style.display = showing ? "none" : "block";
                });
                card.querySelectorAll(".option").forEach(opt => {
                    opt.addEventListener("click", () => {
                        card.querySelectorAll(".option").forEach(o => o.classList.add("disabled"));
                        const correct = opt.dataset.correct === "true";
                        opt.classList.add(correct ? "correct" : "incorrect");
                        if (!correct) {
                            card.querySelectorAll(".option").forEach(o => {
                                if (o.dataset.correct === "true") o.classList.add("correct");
                            });
                        }
                    });
                });
            });
        }

        buildNav();
        renderStory();
    </script>
</body>
</html>
