<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Spring Comics Reading Comprehension</title>
    <style>
        :root {
            --midnight: #0f172a;
            --frost: #e2e8f0;
            --sky: #38bdf8;
            --leaf: #22c55e;
            --bloom: #f472b6;
            --sun: #fbbf24;
            --snow: #f8fafc;
            --spruce: #166534;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at 20% 20%, #f0fdf4, #e0f2fe 45%, #fdf4ff);
            color: var(--midnight);
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 18px 40px;
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            letter-spacing: 0.3px;
        }

        .intro {
            background: white;
            border: 1px solid var(--frost);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .nav-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            position: sticky;
            top: 0;
            background: rgba(240, 253, 244, 0.92);
            padding: 8px 0 4px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .nav-btn {
            border: 1px solid var(--frost);
            background: white;
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 700;
            color: var(--midnight);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.07);
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            border-color: var(--leaf);
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #dcfce7, #fdf4ff);
            border-color: var(--bloom);
            color: #701a75;
        }

        .story-card {
            background: white;
            border: 1px solid var(--frost);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            margin-top: 12px;
        }

        .story-top {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 14px;
            align-items: start;
        }

        .story-text {
            background: var(--snow);
            border: 1px solid var(--frost);
            border-radius: 12px;
            padding: 12px;
            line-height: 1.6;
        }

        .story-text p {
            margin: 0 0 8px;
            font-size: 1.1rem;
        }

        .question-tabs {
            display: inline-flex;
            gap: 8px;
            border-radius: 12px;
            background: #f1f5f9;
            padding: 6px;
            margin: 12px 0;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 9px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            color: #475569;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: white;
            color: var(--midnight);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--frost);
        }

        .questions {
            display: grid;
            gap: 12px;
        }

        .question-card {
            border: 1px solid var(--frost);
            border-radius: 12px;
            padding: 12px;
            background: #f8fafc;
        }

        .question-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .question-label {
            font-size: 0.95rem;
            color: #475569;
        }

        .question-prompt {
            font-weight: 700;
            margin: 6px 0 10px;
            font-size: 1.05rem;
        }

        .help-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-clue {
            background: #0ea5e9;
            color: white;
        }

        .btn-choices {
            background: var(--sun);
            color: #92400e;
        }

        .btn:hover {
            filter: brightness(0.95);
            transform: translateY(-1px);
        }

        .clue {
            display: none;
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            background: #ecfeff;
            border: 1px solid #bae6fd;
            color: #0f172a;
        }

        .choices-wrap {
            display: none;
            margin-top: 8px;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .choice-btn {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            background: white;
            cursor: pointer;
            font-weight: 700;
            text-align: left;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .choice-btn:hover {
            border-color: var(--sky);
            transform: translateY(-1px);
        }

        .choice-btn.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .choice-btn.incorrect {
            background: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        @media (max-width: 820px) {
            .story-top {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        let currentStoryId = stories[0].id;
        let currentQuestionType = 'literal';

        function init() {
            renderNav();
            renderStory();
        }

        function renderNav() {
            const nav = document.getElementById('story-nav');
            nav.innerHTML = '';
            stories.forEach((story, idx) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${story.id === currentStoryId ? 'active' : ''}`;
                btn.textContent = `Story ${idx + 1}`;
                btn.onclick = () => {
                    currentStoryId = story.id;
                    renderNav();
                    renderStory();
                };
                nav.appendChild(btn);
            });
        }

        function renderStory() {
            const container = document.getElementById('story-container');
            const story = stories.find(s => s.id === currentStoryId);
            if (!story) return;

            const textParagraphs = story.text.map(p => `<p>${p}</p>`).join('');
            const questions = story.questions[currentQuestionType];

            container.innerHTML = `
                <div class="story-card">
                    <h2 style="margin-top:0;">${story.title}</h2>
                    <div class="story-top">
                        <div class="story-text">
                            ${textParagraphs}
                        </div>
                        <div style="display:flex; align-items:flex-start; justify-content:center;">
                            <img src="${story.image}" alt="${story.alt}" style="max-width:100%; border-radius:12px; display:block; border: 1px solid var(--frost); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);" />
                        </div>
                    </div>

                    <div class="question-tabs">
                        <button class="tab-btn ${currentQuestionType === 'literal' ? 'active' : ''}" onclick="setQuestionType('literal')">Literal</button>
                        <button class="tab-btn ${currentQuestionType === 'inferential' ? 'active' : ''}" onclick="setQuestionType('inferential')">Inferential</button>
                    </div>

                    <div class="questions" id="questions-container">
                        ${renderQuestions(questions)}
                    </div>
                </div>
            `;
        }

        window.setQuestionType = function (type) {
            currentQuestionType = type;
            renderStory();
        };

        function renderQuestions(questions) {
            if (!questions || !questions.length) {
                return '<p style="color:#475569; padding: 12px;">No questions available.</p>';
            }

            return questions.map((q, idx) => `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-label">Question ${idx + 1}</span>
                    </div>
                    <div class="question-prompt">${q.prompt}</div>
                    <div class="help-row">
                        <button class="btn btn-clue" onclick="toggleClue(this)">I need help</button>
                        <button class="btn btn-choices" onclick="toggleChoices(this)">I need more help</button>
                    </div>
                    <div class="clue">💡 ${q.clue}</div>
                    <div class="choices-wrap" style="display:none;">
                        ${q.choices.map((c, cIdx) => `
                            <button class="choice-btn"
                                    data-correct="${c.isCorrect}"
                                    onclick="checkAnswer(this, ${c.isCorrect})">
                                ${String.fromCharCode(65 + cIdx)}) ${c.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        window.toggleClue = function (btn) {
            const clue = btn.parentElement.nextElementSibling;
            clue.style.display = clue.style.display === 'block' ? 'none' : 'block';
            btn.textContent = clue.style.display === 'block' ? 'Hide hint' : 'I need help';
        };

        window.toggleChoices = function (btn) {
            const choices = btn.parentElement.nextElementSibling.nextElementSibling;
            choices.style.display = choices.style.display === 'grid' ? 'none' : 'grid';
            btn.textContent = choices.style.display === 'grid' ? 'Hide choices' : 'I need more help';
        };

        window.checkAnswer = function (btn, isCorrect) {
            if (isCorrect) {
                btn.classList.add('correct');
                btn.classList.remove('incorrect');
                const siblings = btn.parentElement.querySelectorAll('.choice-btn');
                siblings.forEach(s => s.disabled = true);
            } else {
                btn.classList.add('incorrect');
            }
        };

        init();
    </script>
