<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making and Justifying Inferences</title>
    <style>
        :root {
            --w: 900px;
            --accent: #2563eb;
            --secondary: #3b82f6;
            --bg: #f8fafc;
            --ink: #0f172a;
            --card: #ffffff;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #d1fae5;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --highlight: #fde047;
            --highlight-border: #eab308;
            --hint-bg: #fff7ed;
            --hint-border: #fed7aa;
            --hint-text: #9a3412;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            background: var(--card);
            border-bottom: 3px solid var(--accent);
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 32px;
        }

        .header-content {
            max-width: var(--w);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .main-container {
            max-width: var(--w);
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Top Navigation */
        .story-nav {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            width: 100%;
        }

        .nav-header {
            background: #f1f5f9;
            padding: 8px 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            color: #475569;
            font-size: 0.9rem;
        }

        .story-list {
            list-style: none;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 8px;
            gap: 8px;
            scrollbar-width: thin;
        }

        .story-btn {
            text-align: center;
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--ink);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: max-content;
        }

        .story-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #f8fafc;
        }

        .story-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Activity Area */
        .activity-card {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
        }

        .story-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
        }

        .story-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .story-difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #475569;
        }

        .story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #334155;
            background: #fdfdfd;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
        }

        .highlight-span {
            border-radius: 4px;
            transition: background-color 0.5s ease;
        }

        .highlight-active {
            background-color: var(--highlight);
            box-shadow: 0 0 0 2px var(--highlight-border);
            color: #000;
        }

        .question-container {
            margin-top: 24px;
            animation: fadeIn 0.4s ease;
            background: #f8fafc;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .question-text {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--ink);
        }

        /* Progressive Steps */
        .input-area {
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--border);
            color: #475569;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Hint Box */
        .hint-box {
            background: var(--hint-bg);
            border: 1px solid var(--hint-border);
            color: var(--hint-text);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        .hint-icon {
            font-size: 1.2rem;
        }

        .choices-grid {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .choice-btn {
            text-align: left;
            padding: 16px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .choice-btn:hover {
            border-color: var(--secondary);
            background: #f5f3ff;
        }

        .choice-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: #064e3b;
            pointer-events: none;
        }

        .choice-btn.incorrect {
            border-color: var(--error);
            background: var(--error-bg);
            color: #7f1d1d;
        }

        .feedback-area {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .feedback-correct {
            background: var(--success-bg);
            color: #064e3b;
        }

        .feedback-incorrect {
            background: var(--error-bg);
            color: #7f1d1d;
        }

        .next-btn {
            display: block;
            margin-left: auto;
            margin-top: 24px;
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background: var(--secondary);
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Making and Justifying Inferences</h1>
            <a href="../../index.html" class="btn btn-outline"
                style="text-decoration: none; padding: 8px 16px; font-size: 0.9rem;">Back to Hub</a>
        </div>
    </header>

    <div class="main-container">
        <nav class="story-nav">
            <div class="nav-header">Progress</div>
            <ul class="story-list" id="storyList">
                <!-- Navigation generated by JS -->
            </ul>
        </nav>

        <main class="activity-card">
            <div id="contentArea">
                <div class="story-header" id="storyHeader">
                    <!-- Title and difficulty inserted here -->
                </div>
                <div class="story-text" id="storyText">
                    <!-- Story content with spans inserted here -->
                </div>

                <!-- Step 1: Inference Question (Progressive) -->
                <div id="step1" class="question-container">
                    <div class="question-text" id="q1Text">Question 1: ...</div>

                    <div class="input-area">
                        <label style="display:block; margin-bottom: 8px; color: #64748b; font-size: 0.9rem;">Type your
                            thoughts here first (Optional):</label>
                        <textarea id="userAnswer" placeholder="I think..."></textarea>
                    </div>

                    <div class="controls">
                        <button class="btn btn-outline" id="hintBtn">💡 Need a Hint?</button>
                        <button class="btn btn-primary" id="choicesBtn">📋 Show Choices</button>
                    </div>

                    <div id="hintArea" class="hint-box hidden">
                        <span class="hint-icon">💡</span>
                        <div>
                            <strong>Hint:</strong>
                            <span id="hintText">...</span>
                        </div>
                    </div>

                    <div class="choices-grid hidden" id="q1Choices"></div>
                    <div id="q1Feedback" class="feedback-area hidden"></div>
                </div>

                <!-- Step 2: Justification Question -->
                <div id="step2" class="question-container hidden">
                    <div class="question-text" id="q2Text">Question 2: ...</div>
                    <!-- Direct choices for Q2 since it's evidence selection -->
                    <div class="choices-grid" id="q2Choices"></div>
                    <div id="q2Feedback" class="feedback-area hidden"></div>
                </div>

                <div id="finishControl" class="hidden">
                    <button class="next-btn" id="nextBtn">Next Story ➜</button>
                </div>
            </div>
        </main>
    </div>

            {

                      "title": "Dad's Garage",
                      "difficulty": "Moderate",
                      "html": "The garage was a mess with tools scattered everywhere and oil stains on the floor. Dad's car was up on jack stands with all four tires off. A repair manual lay open on a workbench, and Dad was underneath the car with a wrench. <span id='s27_1'>His phone alarm went off, reminding him to pick up new brake pads from the auto store.</span>",
                      "q1": {
                                "text": "Question 1: What is Dad doing?",
                                "hint": "Look at what parts he's working on and what he needs to buy. What car repair involves removing all the tires?",
                                "choices": [

                                                    "correct": false
                                          }
                                ]
                      }
            }
        ];

        let currentIndex = 0;
        const navList = document.getElementById('storyList');
        const storyHeader = document.getElementById('storyHeader');
        const storyText = document.getElementById('storyText');

        // Q1 Elements
        const q1Text = document.getElementById('q1Text');
        const userAnswer = document.getElementById('userAnswer');
        const hintBtn = document.getElementById('hintBtn');
        const hintArea = document.getElementById('hintArea');
        const hintText = document.getElementById('hintText');
        const choicesBtn = document.getElementById('choicesBtn');
        const q1Choices = document.getElementById('q1Choices');
        const q1Feedback = document.getElementById('q1Feedback');

        // Q2 Elements
        const step2 = document.getElementById('step2');
        const q2Text = document.getElementById('q2Text');
        const q2Choices = document.getElementById('q2Choices');
        const q2Feedback = document.getElementById('q2Feedback');
        const finishControl = document.getElementById('finishControl');
        const nextBtn = document.getElementById('nextBtn');
        const completedStories = new Set();

        function init() {
            renderNav();
            loadStory(0);

            // Event Listeners
            hintBtn.onclick = () => {
                hintArea.classList.remove('hidden');
                hintBtn.style.display = 'none';
            };

            choicesBtn.onclick = () => {
                q1Choices.classList.remove('hidden');
                choicesBtn.style.display = 'none';
                // If hint wasn't shown, hide button so UI is cleaner
                hintBtn.style.display = 'none';
            };

            nextBtn.onclick = () => {
                if (currentIndex < stories.length - 1) {
                    loadStory(currentIndex + 1);
                }
            }
        }

        function renderNav() {
            navList.innerHTML = '';
            stories.forEach((story, index) => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.className = `story-btn ${index === currentIndex ? 'active' : ''}`;
                btn.innerHTML = `Story ${index + 1} ${completedStories.has(index) ? '✅' : '○'}`;
                btn.onclick = () => loadStory(index);
                li.appendChild(btn);
                navList.appendChild(li);
            });
        }

        function loadStory(index) {
            currentIndex = index;
            const story = stories[index];

            // Header
            storyHeader.innerHTML = `
                <div class="story-title">Story ${index + 1}: ${story.title}</div>
                <div class="story-difficulty">${story.difficulty}</div>
            `;

            // Text
            storyText.innerHTML = story.html;

            // Step 1 Setup
            q1Text.textContent = story.q1.text;
            userAnswer.value = ''; // Clear input
            hintText.textContent = story.q1.hint;

            // Hide everything initially
            hintArea.classList.add('hidden');
            q1Choices.classList.add('hidden');
            q1Feedback.className = 'feedback-area hidden';
            q1Feedback.textContent = '';

            // Reset buttons
            hintBtn.style.display = 'inline-block';
            choicesBtn.style.display = 'inline-block';

            // Render Q1 Choices
            renderChoices(q1Choices, story.q1.choices, (choice, btn) => handleQ1Choice(choice, btn, story));

            // Reset Step 2
            step2.classList.add('hidden');
            finishControl.classList.add('hidden');
            q2Choices.innerHTML = '';
            q2Feedback.className = 'feedback-area hidden';
            q2Feedback.textContent = '';

            renderNav();
        }

        function renderChoices(container, choices, callback) {
            container.innerHTML = '';
            choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}.</span> ${choice.text}`;
                btn.onclick = () => callback(choice, btn);
                container.appendChild(btn);
            });
        }

        function handleQ1Choice(choice, btn, story) {
            const allBtns = q1Choices.querySelectorAll('.choice-btn');

            if (choice.correct) {
                // Lock Q1
                allBtns.forEach(b => b.style.pointerEvents = 'none');
                btn.classList.add('correct');

                q1Feedback.textContent = 'Correct! Now, verify your answer below.';
                q1Feedback.className = 'feedback-area feedback-correct';
                q1Feedback.classList.remove('hidden');

                // Show Step 2
                step2.classList.remove('hidden');

                // Render Q2
                q2Text.textContent = story.q2.text;
                renderChoices(q2Choices, story.q2.choices, (c, b) => handleQ2Choice(c, b, story));

                // Scroll to Q2
                setTimeout(() => step2.scrollIntoView({ behavior: 'smooth' }), 100);

            } else {
                btn.classList.add('incorrect');
                q1Feedback.textContent = 'Not quite. Review the hint and try again.';
                q1Feedback.className = 'feedback-area feedback-incorrect';
                q1Feedback.classList.remove('hidden');
            }
        }

        function handleQ2Choice(choice, btn, story) {
            const allBtns = q2Choices.querySelectorAll('.choice-btn');

            if (choice.correct) {
                // Lock Q2
                allBtns.forEach(b => b.style.pointerEvents = 'none');
                btn.classList.add('correct');

                q2Feedback.textContent = 'Excellent! You found the supporting evidence.';
                q2Feedback.className = 'feedback-area feedback-correct';
                q2Feedback.classList.remove('hidden');

                // Highlight Effect
                if (choice.highlights) {
                    choice.highlights.forEach(id => {
                        const span = document.getElementById(id);
                        if (span) span.classList.add('highlight-active');
                    });
                }

                // Show Finish/Next
                finishControl.classList.remove('hidden');
                if (currentIndex < stories.length - 1) {
                    nextBtn.style.display = 'block';
                } else {
                    nextBtn.style.display = 'none';
                    q2Feedback.textContent += ' All stories completed!';
                }

                completedStories.add(currentIndex);
                renderNav();

            } else {
                btn.classList.add('incorrect');
                q2Feedback.textContent = 'That detail doesn\'t best support the inference. Look closely at what matters most.';
                q2Feedback.className = 'feedback-area feedback-incorrect';
                q2Feedback.classList.remove('hidden');
            }
        }

        init();
    </script>
