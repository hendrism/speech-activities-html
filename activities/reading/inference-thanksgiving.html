<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanksgiving Inferences</title>
    <script src="../../data/stories.js"></script>
    <script src="../../js/data-loader.js"></script>
<style>
        :root {
            --bg: #f7f2ea;
            --surface: #ffffff;
            --accent: #b45309;
            --accent-2: #0f766e;
            --muted: #475569;
            --radius: 18px;
            --shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
            --max-width: 1000px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 15% 20%, #fff9f2, #f1e4d7 70%);
            color: #0f172a;
            line-height: 1.6;
            padding: 24px 16px 48px;
        }

        header {
            text-align: center;
            margin-bottom: 26px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: var(--accent);
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .shell {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 2px solid rgba(148, 163, 184, 0.18);
            padding: 24px;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .nav button {
            border: 2px solid rgba(180, 83, 9, 0.25);
            background: white;
            color: var(--accent);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav button:hover { background: rgba(250, 204, 21, 0.14); }
        .nav button.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 16px rgba(180, 83, 9, 0.2);
        }

        .story-card {
            background: rgba(15, 118, 110, 0.07);
            border: 2px solid rgba(15, 118, 110, 0.15);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .story-title {
            margin: 0 0 10px;
            font-size: 18px;
            color: var(--accent-2);
        }

        .story-text {
            margin: 0;
            font-size: 16px;
            color: #0f172a;
        }

        .question {
            background: rgba(148, 163, 184, 0.12);
            border-radius: 12px;
            padding: 12px;
            border: 2px solid rgba(148, 163, 184, 0.25);
            margin-bottom: 12px;
        }

        .question strong { display: block; margin-bottom: 8px; color: var(--accent); }

        textarea {
            width: 100%;
            min-height: 70px;
            border-radius: 10px;
            border: 2px solid rgba(148, 163, 184, 0.4);
            padding: 10px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            background: white;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
        }

        .hint {
            display: none;
            margin-top: 8px;
            padding: 10px;
            background: rgba(250, 204, 21, 0.18);
            border-radius: 10px;
            color: #92400e;
            border: 2px solid rgba(250, 204, 21, 0.3);
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .actions button {
            border: 2px solid rgba(180, 83, 9, 0.25);
            background: white;
            color: var(--accent);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .actions button.primary {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }

        .actions button:hover { transform: translateY(-1px); }

        @media (max-width: 720px) {
            .actions { justify-content: center; }
        }
    </style>
</head>
<body class="category-reading">
    <header>
        <h1>Thanksgiving Inferences</h1>
        <p>Read each short Thanksgiving scenario, then answer the inference questions using context clues.</p>
    </header>

    <div class="shell">
        <div class="nav" id="nav"></div>

        <div class="story-card">
            <h2 class="story-title" id="storyTitle"></h2>
            <p class="story-text" id="storyText"></p>
        </div>

        <div id="questions"></div>

        <div class="actions">
            <button id="prevBtn">← Previous</button>
            <button id="revealAllBtn">👀 Reveal All Hints</button>
            <button class="primary" id="nextBtn">Next →</button>
        </div>
    </div>

    <script>
        const stories = DataLoader.get('stories', 'inference-thanksgiving');

        let current = 0;
        const nav = document.getElementById("nav");
        const titleEl = document.getElementById("storyTitle");
        const textEl = document.getElementById("storyText");
        const qContainer = document.getElementById("questions");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const revealAllBtn = document.getElementById("revealAllBtn");

        function buildNav() {
            nav.innerHTML = "";
            stories.forEach((story, index) => {
                const btn = document.createElement("button");
                btn.textContent = `${index + 1}. ${story.title}`;
                btn.addEventListener("click", () => loadStory(index));
                nav.appendChild(btn);
            });
        }

        function renderQuestions(story) {
            qContainer.innerHTML = "";
            story.questions.forEach((q, i) => {
                const wrapper = document.createElement("div");
                wrapper.className = "question";

                const label = document.createElement("strong");
                label.textContent = `Question ${i + 1}: ${q.prompt}`;

                const input = document.createElement("textarea");
                input.placeholder = "Type your inference here...";

                const hint = document.createElement("div");
                hint.className = "hint";
                hint.textContent = `Hint: ${q.hint}`;

                const hintBtn = document.createElement("button");
                hintBtn.textContent = "Show hint";
                hintBtn.addEventListener("click", () => {
                    const showing = hint.style.display === "block";
                    hint.style.display = showing ? "none" : "block";
                    hintBtn.textContent = showing ? "Show hint" : "Hide hint";
                });

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                wrapper.appendChild(hintBtn);
                wrapper.appendChild(hint);
                qContainer.appendChild(wrapper);
            });
        }

        function loadStory(index) {
            current = index;
            const story = stories[index];
            titleEl.textContent = story.title;
            textEl.textContent = story.text;
            renderQuestions(story);
            syncNavButtons();
        }

        function syncNavButtons() {
            nav.querySelectorAll("button").forEach((btn, i) => {
                btn.classList.toggle("active", i === current);
            });
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === stories.length - 1;
        }

        prevBtn.addEventListener("click", () => {
            if (current > 0) loadStory(current - 1);
        });

        nextBtn.addEventListener("click", () => {
            if (current < stories.length - 1) loadStory(current + 1);
        });

        revealAllBtn.addEventListener("click", () => {
            document.querySelectorAll(".question .hint").forEach(h => h.style.display = "block");
            document.querySelectorAll(".question button").forEach(btn => btn.textContent = "Hide hint");
        });

        buildNav();
        loadStory(0);
    </script>
</body>
</html>
