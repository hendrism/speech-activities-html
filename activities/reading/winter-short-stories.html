        let currentLevel = 'standard';
        let currentStory = storiesStandard[0];
        const navList = document.getElementById('navList');
        const mainContent = document.getElementById('mainContent');

        function init() {
            renderNav();
            loadStory(1);
        }

        function getStories() {
            if (currentLevel === 'basic') return storiesBasic;
            return currentLevel === 'standard' ? storiesStandard : storiesSimplified;
        }

        function toggleLevel(e) {
            let newLevel = currentLevel;

            // Check if a specific option was clicked
            if (e && e.target && e.target.hasAttribute('data-val')) {
                newLevel = e.target.getAttribute('data-val');
            } else {
                // Cycle through levels if container clicked
                if (currentLevel === 'standard') newLevel = 'simplified';
                else if (currentLevel === 'simplified') newLevel = 'basic';
                else newLevel = 'standard';
            }

            if (newLevel === currentLevel) return;

            currentLevel = newLevel;
            document.getElementById('levelToggle').setAttribute('data-level', currentLevel);

            // Update active state text
            document.querySelectorAll('.level-toggle-option').forEach(opt => {
                opt.classList.remove('active');
                if (opt.id === `opt-${currentLevel}`) opt.classList.add('active');
            });

            // Reload current story ID with new level content
            // Ensure ID exists in new set (it should, 1-10)
            loadStory(currentStory.id);
        }

        function renderNav() {
            const stories = getStories();
            navList.innerHTML = '';
            stories.forEach(story => {
                const item = document.createElement('div');
                item.className = `nav-item ${story.id === currentStory.id ? 'active' : ''}`;
                item.onclick = () => loadStory(story.id);
                item.innerHTML = `
                    <span>Story ${story.id}</span>
                `;
                navList.appendChild(item);
            });
        }

        function loadStory(id) {
            const stories = getStories();
            currentStory = stories.find(s => s.id === id);
            renderNav();
            renderContent();
            // Scroll to top
            document.querySelector('.main').scrollTop = 0;
        }

        function renderContent() {
            // Render Questions
            const renderQuestion = (q, index, type) => {
                const uniqueId = `${type}_${index}`;
                return `
                <div class="question-card">
                    <div class="question-text">${index + 1}. ${q.q}</div>
                    
                    <div class="input-area">
                        <textarea class="text-input" placeholder="Type your answer here..."></textarea>
                    </div>

                    <div class="action-bar">
                        <button class="action-btn" onclick="toggleSection('${uniqueId}_hint', this)">
                            <span>💡</span> I need help
                        </button>
                        <button class="action-btn" onclick="toggleSection('${uniqueId}_choices', this)">
                             <span>📋</span> Choices
                        </button>
                    </div>

                    <div id="${uniqueId}_hint" class="collapsible-content">
                        <div class="hint-box">
                            <span>💡</span> ${q.hint}
                        </div>
                    </div>

                    <div id="${uniqueId}_choices" class="collapsible-content">
                        <div class="options-grid">
                            ${q.options.map((opt, i) => `
                                <button class="option-btn" onclick="checkAnswer(this, ${i}, ${q.answer})">
                                    ${['A', 'B', 'C', 'D'][i]}) ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `};

            const literalHtml = currentStory.literal.map((q, i) => renderQuestion(q, i, 'literal')).join('');
            const inferentialHtml = currentStory.inferential.map((q, i) => renderQuestion(q, i, 'inferential')).join('');
            const verbHtml = (currentStory.verbTense || []).map((q, i) => renderQuestion(q, i, 'verb')).join('');

            const imagePath = storyImages[currentStory.id];

            mainContent.innerHTML = `
                <div class="content-container">
                    <div class="story-card">
                        <h1 class="story-title">${currentStory.title}</h1>
                        ${imagePath ? `
                        <div class="story-image-container">
                            <img src="${imagePath}" alt="Story Illustration" class="story-image">
                        </div>` : ''}
                        <div class="story-text">
                            ${currentStory.text.split('\n\n').map(p => `<p>${p}</p>`).join('')}
                        </div>
                    </div>

                    <div class="tabs-container">
                        <button class="tab-btn active" onclick="switchTab('literal', this)">Literal Questions</button>
                        <button class="tab-btn" onclick="switchTab('inferential', this)">Inferential Questions</button>
                        <button class="tab-btn" onclick="switchTab('verb', this)">Verb Tenses</button>
                    </div>

                    <div id="tab-literal" class="tab-content active">
                        <div class="section-title">Literal Questions</div>
                        ${literalHtml}
                    </div>

                    <div id="tab-inferential" class="tab-content">
                        <div class="section-title">Inferential Questions</div>
                        ${inferentialHtml}
                    </div>
                    
                    <div id="tab-verb" class="tab-content">
                        <div class="section-title">Verb Tense Questions</div>
                        ${verbHtml}
                    </div>
                    
                    <div style="height: 50px;"></div>
                </div>
            `;
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            btn.classList.add('active');
        }

        function toggleSection(id, btn) {
            const el = document.getElementById(id);
            el.classList.toggle('visible');
            btn.classList.toggle('active');
        }

        function checkAnswer(btn, selectedIndex, correctIndex) {
            // Reset siblings
            const parent = btn.parentElement; // This is the options-grid
            const buttons = parent.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.classList.remove('correct', 'incorrect');
                b.disabled = false;
            });

            if (selectedIndex === correctIndex) {
                btn.classList.add('correct');
                // Optional: Disable others to lock in
            } else {
                btn.classList.add('incorrect');
            }
        }

        // Initialize
        init();

    </script>
