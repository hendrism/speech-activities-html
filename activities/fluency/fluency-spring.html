<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Fluency Prompts</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --surface: #ffffff;
            --accent: #16a34a;
            --accent-2: #15803d;
            --muted: #475569;
            --radius: 16px;
            --shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
            --max-width: 1100px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 18% 20%, #f4fdf4, #dcfce7 70%);
            color: #0f172a;
            line-height: 1.6;
            padding: 24px 16px 48px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .shell {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 2px solid rgba(22, 163, 74, 0.16);
            padding: 20px;
        }

        .question-bank {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-bottom: 16px;
        }

        .question-card {
            border: 2px solid rgba(22, 163, 74, 0.2);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .question-card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 14px rgba(15, 23, 42, 0.08);
        }

        .question-card.active {
            background: rgba(22, 163, 74, 0.12);
            border-color: var(--accent);
        }

        .question-card strong {
            display: block;
            color: var(--accent);
            margin-bottom: 6px;
            font-size: 15px;
        }

        .question-card span {
            color: var(--muted);
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 14px;
            margin-bottom: 16px;
        }

        .input-group {
            background: rgba(21, 128, 61, 0.07);
            border: 2px solid rgba(21, 128, 61, 0.2);
            border-radius: 12px;
            padding: 12px;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            color: var(--accent-2);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 10px;
            border: 2px solid rgba(148, 163, 184, 0.35);
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        .level-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }

        .level-btn {
            border: 2px solid rgba(148, 163, 184, 0.3);
            background: white;
            border-radius: 10px;
            padding: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.2s ease;
        }

        .level-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .level-btn.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 14px rgba(22, 163, 74, 0.2);
        }

        .prompt-card {
            background: rgba(148, 163, 184, 0.1);
            border: 2px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .prompt-card h3 {
            margin: 0 0 8px;
            font-size: 16px;
            color: var(--accent);
        }

        .prompt-card p {
            margin: 0;
            font-size: 15px;
            color: #0f172a;
        }

        .output {
            background: rgba(21, 128, 61, 0.08);
            border: 2px solid rgba(21, 128, 61, 0.24);
            border-radius: 14px;
            padding: 14px;
        }

        .output-title {
            margin: 0 0 6px;
            font-size: 16px;
            color: var(--accent-2);
        }

        .output-text {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 700;
        }

        .hint {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 820px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Spring Fluency Prompts</h1>
        <p>Pick a spring question, choose the level, type the answer, and share the practice line.</p>
    </header>

    <div class="shell">
        <div class="question-bank" id="questionBank"></div>

        <div class="controls">
            <div class="input-group">
                <label for="answerInput">Type the student's answer (or keep blank to leave a line)</label>
                <input id="answerInput" type="text" placeholder="e.g., jump in puddles">
            </div>
            <div class="level-tabs" id="levelTabs"></div>
        </div>

        <div class="prompt-card">
            <h3 id="promptTitle"></h3>
            <p id="promptText"></p>
        </div>

        <div class="output">
            <p class="output-title" id="levelLabel"></p>
            <p class="output-text" id="outputText"></p>
            <p class="hint" id="outputHint"></p>
        </div>
    </div>

    <script>
        const questions = [
            {
                prompt: "What is your favorite spring activity?",
                frames: {
                    word: "{a}",
                    phrase: "fun {a}",
                    sentence: "My favorite spring activity is {a}.",
                    extended: "My favorite spring activity is {a} because ____."
                }
            },
            {
                prompt: "What do you like to drink on a rainy spring day?",
                frames: {
                    word: "{a}",
                    phrase: "warm {a}",
                    sentence: "On a rainy spring day, I like to drink {a}.",
                    extended: "On a rainy spring day, I like to drink {a} because ____."
                }
            },
            {
                prompt: "Who do you like to play outside with in the spring?",
                frames: {
                    word: "{a}",
                    phrase: "playing with {a}",
                    sentence: "I like to play outside with {a} in the spring.",
                    extended: "I like to play outside with {a} in the spring because ____."
                }
            },
            {
                prompt: "What do you wear when it is raining outside?",
                frames: {
                    word: "{a}",
                    phrase: "put on {a}",
                    sentence: "When it is raining outside, I put on {a}.",
                    extended: "When it is raining outside, I put on {a} so that ____."
                }
            },
            {
                prompt: "Where do you like to go on a sunny spring day?",
                frames: {
                    word: "{a}",
                    phrase: "go to {a}",
                    sentence: "On a sunny spring day, I like to go to {a}.",
                    extended: "On a sunny spring day, I like to go to {a} to ____."
                }
            },
            {
                prompt: "What spring sound or smell do you notice?",
                frames: {
                    word: "{a}",
                    phrase: "the {a}",
                    sentence: "In spring, I notice {a}.",
                    extended: "In spring, I notice {a} and it makes me feel ____."
                }
            },
            {
                prompt: "What do you hope to do during spring break?",
                frames: {
                    word: "{a}",
                    phrase: "spring break {a}",
                    sentence: "During spring break, I hope to {a}.",
                    extended: "During spring break, I hope to {a} because ____."
                }
            },
            {
                prompt: "What is one goal for the end of the school year?",
                frames: {
                    word: "{a}",
                    phrase: "goal: {a}",
                    sentence: "One goal for the end of the school year is {a}.",
                    extended: "One goal for the end of the school year is {a} so that ____."
                }
            },
            {
                prompt: "What do you like to eat at a spring picnic?",
                frames: {
                    word: "{a}",
                    phrase: "eating {a}",
                    sentence: "At a spring picnic, I like to eat {a}.",
                    extended: "At a spring picnic, I like to eat {a} because ____."
                }
            },
            {
                prompt: "What spring clothing is your favorite?",
                frames: {
                    word: "{a}",
                    phrase: "favorite {a}",
                    sentence: "My favorite spring clothing is {a}.",
                    extended: "My favorite spring clothing is {a} because ____."
                }
            },
            {
                prompt: "What outdoor hobby do you enjoy when the weather gets warmer?",
                frames: {
                    word: "{a}",
                    phrase: "outdoor {a}",
                    sentence: "When the weather gets warmer, I enjoy {a} outside.",
                    extended: "When the weather gets warmer, I enjoy {a} outside because ____."
                }
            },
            {
                prompt: "What animal do you hope to see in the spring?",
                frames: {
                    word: "{a}",
                    phrase: "see a {a}",
                    sentence: "In the spring, I hope to see a {a}.",
                    extended: "In the spring, I hope to see a {a} because ____."
                }
            },
            {
                prompt: "How can you help someone plant a garden?",
                frames: {
                    word: "{a}",
                    phrase: "help by {a}",
                    sentence: "When planting a garden, I can help by {a}.",
                    extended: "When planting a garden, I can help by {a} so that ____."
                }
            },
            {
                prompt: "What spring sound do you like to hear?",
                frames: {
                    word: "{a}",
                    phrase: "hearing {a}",
                    sentence: "A spring sound I like to hear is {a}.",
                    extended: "A spring sound I like to hear is {a} because ____."
                }
            },
            {
                prompt: "What is the best part of a warm spring afternoon?",
                frames: {
                    word: "{a}",
                    phrase: "best part: {a}",
                    sentence: "The best part of a warm spring afternoon is {a}.",
                    extended: "The best part of a warm spring afternoon is {a} because ____."
                }
            }
        ];

        const levels = {
            word: { label: "Single Word", hint: "Use a single clear word." },
            phrase: { label: "Short Phrase", hint: "Add one or two words around the answer." },
            sentence: { label: "Full Sentence", hint: "Models a simple, complete sentence." },
            extended: { label: "Extended Response", hint: "Add a reason or detail after the answer." }
        };

        let currentQuestion = 0;
        let currentLevel = "word";

        const questionBank = document.getElementById("questionBank");
        const levelTabs = document.getElementById("levelTabs");
        const promptTitle = document.getElementById("promptTitle");
        const promptText = document.getElementById("promptText");
        const answerInput = document.getElementById("answerInput");
        const levelLabel = document.getElementById("levelLabel");
        const outputText = document.getElementById("outputText");
        const outputHint = document.getElementById("outputHint");

        function buildQuestionBank() {
            questionBank.innerHTML = "";
            questions.forEach((q, i) => {
                const card = document.createElement("div");
                card.className = "question-card";
                card.innerHTML = `<strong>Question ${i + 1}</strong><span>${q.prompt}</span>`;
                card.addEventListener("click", () => {
                    currentQuestion = i;
                    render();
                });
                questionBank.appendChild(card);
            });
        }

        function buildLevelTabs() {
            levelTabs.innerHTML = "";
            Object.entries(levels).forEach(([key, value]) => {
                const btn = document.createElement("button");
                btn.className = "level-btn";
                btn.textContent = value.label;
                btn.addEventListener("click", () => {
                    currentLevel = key;
                    renderOutput();
                });
                levelTabs.appendChild(btn);
            });
        }

        function fillFrame(frame, answer) {
            const insert = answer.trim() === "" ? "_____" : answer.trim();
            return frame.replace("{a}", insert);
        }

        function renderOutput() {
            const q = questions[currentQuestion];
            const a = answerInput.value || "";
            const frame = q.frames[currentLevel];
            outputText.textContent = fillFrame(frame, a);
            levelLabel.textContent = `${levels[currentLevel].label} Practice`;
            outputHint.textContent = levels[currentLevel].hint;

            levelTabs.querySelectorAll(".level-btn").forEach((btn, i) => {
                const key = Object.keys(levels)[i];
                btn.classList.toggle("active", key === currentLevel);
            });
        }

        function renderPrompt() {
            promptTitle.textContent = "Prompt:";
            promptText.textContent = questions[currentQuestion].prompt;

            questionBank.querySelectorAll(".question-card").forEach((card, i) => {
                card.classList.toggle("active", i === currentQuestion);
            });
        }

        function render() {
            renderPrompt();
            renderOutput();
        }

        answerInput.addEventListener("input", renderOutput);

        buildQuestionBank();
        buildLevelTabs();
        render();
    </script>
</body>

</html>
