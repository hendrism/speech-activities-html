<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    ============================================================
    ACTIVITY TEMPLATE
    ============================================================
    Copy this file into the appropriate category subfolder:
      activities/articulation/
      activities/fluency/
      activities/grammar/
      activities/reading/
      activities/social/
      activities/vocabulary/

    Then:
      1. Update the <title> and <h1>
      2. Replace ACTIVITY_DATA with your data array
      3. Fill in renderCard() with your activity's HTML
      4. Fill in checkAnswer() with your validation logic
      5. Remove any sections you don't need
      6. Delete these comments
    ============================================================
    -->
    <title>Activity Title — Speech Therapy</title>

    <!-- Shared design system (colors, spacing, buttons, cards) -->
    <link rel="stylesheet" href="../../css/styles.css">

    <style>
        /* --------------------------------------------------------
           Activity-specific styles only — use CSS variables from
           styles.css for all colors, spacing, and radius values.
           -------------------------------------------------------- */

        /* Example: override the body gradient for this activity */
        /* body { background: linear-gradient(135deg, #0ea5e9, #6366f1); } */

        .activity-header {
            text-align: center;
            color: var(--color-white);
            margin-bottom: var(--space-6);
        }

        .activity-header h1 {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
        }

        .activity-header p {
            font-size: var(--font-size-lg);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- ── Header ─────────────────────────────────────── -->
    <div class="activity-header">
        <h1>🎯 Activity Title</h1>
        <p>Brief one-line description of the activity</p>
    </div>

    <!-- ── Main card ──────────────────────────────────── -->
    <div class="container">
        <!-- Progress bar (filled by updateProgress() in js/utils.js) -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label"></div>

        <!-- Navigation pills (rendered by renderNavPills() in js/utils.js) -->
        <div class="nav-pills" id="nav-pills"></div>

        <!-- Activity card — renderCard() writes into here -->
        <div class="card" id="card">
            <!-- Dynamic content injected by JavaScript -->
        </div>

        <!-- Feedback (shown by showFeedback() in js/utils.js) -->
        <div class="feedback" id="feedback"></div>

        <!-- Navigation buttons -->
        <div class="flex-between mt-4">
            <button class="btn btn-secondary" id="prev-btn" onclick="prevItem()">← Previous</button>
            <button class="btn btn-primary"   id="next-btn" onclick="nextItem()">Next →</button>
        </div>
    </div>

    <!-- Shared utilities (shuffleArray, updateProgress, showFeedback, renderNavPills) -->
    <script src="../../js/utils.js"></script>

    <script>
        // ── Activity data ─────────────────────────────────────────
        // Replace with your actual data. Each object represents one item.
        const ACTIVITY_DATA = [
            {
                id: 1,
                prompt: 'Question or scenario text here.',
                answer: 'Correct answer',
                hint:   'Optional hint text.',
                // image: '../../images/your-folder/image.png',
            },
            // … more items
        ];

        // ── State ─────────────────────────────────────────────────
        const state = {
            items:        shuffleArray(ACTIVITY_DATA),  // or just [...ACTIVITY_DATA] for sequential
            currentIndex: 0,
            answered:     false,
        };

        // ── Render ────────────────────────────────────────────────
        function renderCard() {
            const item  = state.items[state.currentIndex];
            const card  = document.getElementById('card');
            state.answered = false;
            hideFeedback('feedback');

            // Update progress bar and label
            updateProgress(
                'progress-fill',
                state.currentIndex + 1,
                state.items.length,
                'progress-label'
            );

            // Update active nav pill
            setNavActive('nav-pills', state.currentIndex);

            // ── Card content — customise this section ──
            card.innerHTML = `
                ${item.image ? `<img src="${item.image}" alt="" style="max-width:100%; border-radius: var(--radius-md); margin-bottom: var(--space-4);">` : ''}

                <p style="font-size: var(--font-size-lg); margin-bottom: var(--space-4);">
                    ${item.prompt}
                </p>

                <div class="hint-box" id="hint" style="display:none;">
                    💡 ${item.hint}
                </div>

                <div class="options-grid" id="options">
                    <!-- Render answer choices here, or use a text input -->
                </div>

                <button class="btn btn-secondary mt-4" onclick="toggleHint()">💡 Need a hint?</button>
            `;
        }

        // ── Answer checking ───────────────────────────────────────
        function checkAnswer(selected) {
            if (state.answered) return;
            state.answered = true;

            const item      = state.items[state.currentIndex];
            const isCorrect = selected === item.answer;

            showFeedback('feedback', isCorrect);
        }

        // ── Hint ──────────────────────────────────────────────────
        function toggleHint() {
            const hint = document.getElementById('hint');
            hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }

        // ── Navigation ────────────────────────────────────────────
        function nextItem() {
            if (state.currentIndex < state.items.length - 1) {
                state.currentIndex++;
                renderCard();
            } else {
                document.getElementById('card').innerHTML = `
                    <div class="text-center">
                        <p style="font-size: var(--font-size-2xl);">🎉 All done!</p>
                        <p class="text-muted mt-4">Great work today.</p>
                        <button class="btn btn-primary mt-4" onclick="restart()">Start Over</button>
                    </div>
                `;
                hideFeedback('feedback');
            }
        }

        function prevItem() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderCard();
            }
        }

        function restart() {
            state.items        = shuffleArray(ACTIVITY_DATA);
            state.currentIndex = 0;
            renderCard();
        }

        // ── Init ──────────────────────────────────────────────────
        renderNavPills('nav-pills', state.items, (idx) => {
            state.currentIndex = idx;
            renderCard();
        }, {
            labelFn: (item, i) => `${i + 1}`,  // or: item.word, item.title, etc.
        });

        renderCard();
    </script>
</body>
</html>
