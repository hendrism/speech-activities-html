<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Vocabulary Builder</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
</head>

<body class="category-vocabulary">

    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Winter Vocab</h1>
            <p class="sidebar-subtitle">Category & Attributes</p>
        </div>
        <div class="nav-list" id="navList">
            <!-- Nav items generated here -->
        </div>
    </div>

    <main class="main" id="mainContent">
        <!-- Content injected here -->
    </main>

    <script>
        // Utilities
        function genChoices(correct, pool) {
            const others = pool.filter(x => x !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
            const all = [correct, ...others].sort(() => Math.random() - 0.5);
            return all;
        }

        function getCommonCategories() {
            return ['Winter Weather', 'Winter Clothing', 'Winter Sport', 'Winter Tool', 'Winter Food', 'Household Item', 'Vehicle', 'Plant', 'Animal', 'Decoration'];
        }

        function getCommonFunctions() {
            return ['keeps you warm', 'falls from the sky', 'covers the ground', 'slides on snow', 'protects hands', 'clears snow', 'heats the room', 'protects feet'];
        }

        function getCommonAttributes() {
            return ['white', 'cold', 'hot', 'soft', 'hard', 'long', 'heavy', 'light', 'waterproof', 'sweet', 'round', 'wooden', 'metal', 'plastic'];
        }

        // Base Data
        const itemsData = DataLoader.get("vocabulary", "winterVocabCategoryFunction");

        // Process entries to add choices
        const entries = itemsData.map(item => {
            return {
                id: item.id,
                word: item.word,
                image: item.img,
                isPlural: item.isPlural,
                isMass: item.isMass || false,
                category: {
                    answer: item.cat,
                    choices: genChoices(item.cat, getCommonCategories())
                },
                function: {
                    answer: item.func,
                    choices: genChoices(item.func, getCommonFunctions())
                },
                attributes: [
                    {
                        question: item.qAttrs[0],
                        answer: item.attrs[0],
                        choices: genChoices(item.attrs[0], getCommonAttributes())
                    },
                    {
                        question: item.qAttrs[1],
                        answer: item.attrs[1],
                        choices: genChoices(item.attrs[1], getCommonAttributes())
                    }
                ]
            };
        });

        let currentEntry = entries[0];
        let userAnswers = {
            category: '',
            function: '',
            attr1: '',
            attr2: '',
            attr1Type: 'looks',
            attr2Type: 'looks',
            activeStep: 'step1',
            completedSteps: []
        };

        // DOM Elements
        const navList = document.getElementById('navList');
        const mainContent = document.getElementById('mainContent');

        function init() {
            renderNav();
            loadEntry(entries[0].id);
        }

        function renderNav() {
            navList.innerHTML = '';
            entries.forEach(entry => {
                const item = document.createElement('div');
                item.className = `nav-item ${entry.id === currentEntry.id ? 'active' : ''}`;
                item.onclick = () => loadEntry(entry.id);
                item.innerHTML = `
                    <span>${entry.word}</span>
                    <div class="status-dot"></div>
                `;
                navList.appendChild(item);
            });
        }

        // --- Helpers ---
        function getArticle(word) {
            const vowels = ['a', 'e', 'i', 'o', 'u'];
            return vowels.includes(word[0].toLowerCase()) ? 'an' : 'a';
        }

        function cap(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        const attrTypes = {
            looks: { label: 'Looks Like', hint: 'Think about color, shape, size...', prefix: 'It is', pluralPrefix: 'They are' },
            feels: { label: 'Feel/Smell', hint: 'Think about texture, temperature, smell...', prefix: 'It feels', pluralPrefix: 'They feel' },
            parts: { label: 'Parts', hint: 'What parts does it have? (wheels, handle...)', prefix: 'It has', pluralPrefix: 'They have' },
            place: { label: 'Place', hint: 'Where do you find it?', prefix: 'It is found', pluralPrefix: 'They are found' },
            unique: { label: 'Unique', hint: 'What makes it special?', prefix: 'It', pluralPrefix: 'They' }
        };

        function updateAttrType(slot, type) {
            userAnswers[`${slot}Type`] = type;
            userAnswers.activeStep = 'step3';
            renderActivity();
            setTimeout(() => {
                const input = document.getElementById(`${slot}Input`);
                if (input) input.focus();
            }, 50);
        }

        function loadEntry(id) {
            currentEntry = entries.find(e => e.id === id);
            userAnswers = {
                category: '',
                function: '',
                attr1: '',
                attr2: '',
                attr1Type: 'looks',
                attr2Type: 'looks',
                activeStep: 'step1',
                completedSteps: []
            };
            renderNav();
            renderActivity();
        }

        function renderActivity() {
            // Image
            let imgHtml = currentEntry.image
                ? `<img src="${currentEntry.image}" class="main-image" alt="${currentEntry.word}">`
                : `<div class="image-placeholder">No Image Available</div>`;

            // Grammar helpers
            const verbDo = currentEntry.isPlural ? 'do' : 'does';
            const verbBe = currentEntry.isPlural ? 'are' : 'is';
            const pronoun = currentEntry.isPlural ? 'They' : 'It';

            // Name for sentences
            // Logic: Plural -> 'Gloves', Mass -> 'Snow', Singular -> 'A coat'
            let subjectName;
            if (currentEntry.isPlural || currentEntry.isMass) {
                subjectName = currentEntry.word;
            } else {
                subjectName = `${getArticle(currentEntry.word)} ${currentEntry.word.toLowerCase()}`;
            }
            const SubjectName = cap(subjectName);

            // Sentences
            const cat = userAnswers.category || '________';
            const func = userAnswers.function || '________';

            let catSentence;
            if (currentEntry.isPlural) {
                catSentence = `${currentEntry.word} are a type of <span id="catPreview">${cat}</span>.`;
            } else if (currentEntry.isMass) {
                catSentence = `${SubjectName} is a type of <span id="catPreview">${cat}</span>.`;
            } else {
                catSentence = `${SubjectName} is a type of <span id="catPreview">${cat}</span>.`;
            }

            const funcSentence = `${pronoun} <span id="funcPreview">${func}</span>.`;

            const t1 = attrTypes[userAnswers.attr1Type || 'looks'];
            const t2 = attrTypes[userAnswers.attr2Type || 'looks'];
            const prefix1 = currentEntry.isPlural ? t1.pluralPrefix : t1.prefix;
            const prefix2 = currentEntry.isPlural ? t2.pluralPrefix : t2.prefix;

            const attrSentence1 = `${prefix1} <span id="attr1Preview">${userAnswers.attr1 || '________'}</span>`;
            const attrSentence2 = `${prefix2} <span id="attr2Preview">${userAnswers.attr2 || '________'}</span>`;

            // State helpers
            const isActive = (id) => userAnswers.activeStep === id ? 'active' : '';
            const isCompleted = (id) => userAnswers.completedSteps.includes(id) ? 'completed' : '';

            mainContent.innerHTML = `
                <div class="activity-container">
                    <div class="visual-card">
                        <div class="word-display">${currentEntry.word}</div>
                        ${imgHtml}
                    </div>
                    
                    <div class="workspace">
                        <!-- Step 1: Category -->
                        <div class="step-card ${isActive('step1')} ${isCompleted('step1')}" id="step1">
                            <div class="step-header" onclick="toggleStep('step1')">
                                <div class="step-title">
                                    <div class="step-number">1</div>
                                    Category
                                </div>
                            </div>
                            <div class="step-content">
                                <div class="question-text">What category ${verbDo} ${subjectName} belong to?</div>
                                <div class="input-group">
                                    <input type="text" class="text-input" id="catInput" value="${userAnswers.category}"
                                        placeholder="Type to add category..." oninput="updatePreview('cat', this.value)">
                                    <div class="tools">
                                        <button class="tool-btn" id="catBtn" onclick="toggleChoices('cat')">Show Ideas</button>
                                    </div>
                                    <div class="choices-grid hidden" id="catChoices"></div>
                                    <div class="sentence-preview">
                                        Sentence: <strong>${catSentence}</strong>
                                    </div>
                                    <div style="text-align: right; margin-top: 10px;">
                                        <button class="primary-btn" onclick="nextStep('step1', 'step2')">Next</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step 2: Function -->
                        <div class="step-card ${isActive('step2')} ${isCompleted('step2')}" id="step2">
                            <div class="step-header" onclick="toggleStep('step2')">
                                <div class="step-title">
                                    <div class="step-number">2</div>
                                    Function / Action
                                </div>
                            </div>
                            <div class="step-content">
                                <div class="question-text">What ${verbDo} ${subjectName} do?</div>
                                <div class="input-group">
                                    <input type="text" class="text-input" id="funcInput" value="${userAnswers.function}"
                                        placeholder="Type to add function..." oninput="updatePreview('func', this.value)">
                                    <div class="tools">
                                        <button class="tool-btn" id="funcBtn" onclick="toggleChoices('func')">Show Ideas</button>
                                    </div>
                                    <div class="choices-grid hidden" id="funcChoices"></div>
                                    <div class="sentence-preview">
                                        Sentence: <strong>It <span id="funcPreview">${func}</span>.</strong>
                                    </div>
                                    <div style="text-align: right; margin-top: 10px;">
                                        <button class="primary-btn" onclick="nextStep('step2', 'step3')">Next</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step 3: Attributes -->
                        <div class="step-card ${isActive('step3')} ${isCompleted('step3')}" id="step3">
                            <div class="step-header" onclick="toggleStep('step3')">
                                <div class="step-title">
                                    <div class="step-number">3</div>
                                    Describe It!
                                </div>
                            </div>
                            <div class="step-content">
                                <p style="margin-bottom:20px; color:var(--text-muted);">Choose how you want to describe it:</p>
                                
                                <!-- Attr 1 -->
                                <div style="margin-bottom: 24px;">
                                    <div style="display:flex; gap:10px; margin-bottom:10px; overflow-x:auto; padding-bottom:5px;">
                                        ${Object.keys(attrTypes).map(key => `
                                            <button class="tool-btn ${userAnswers.attr1Type === key ? 'active' : ''}" 
                                                style="${userAnswers.attr1Type === key ? 'background:#e0f2fe; border-color:#0ea5e9; color:#0284c7;' : ''}"
                                                onclick="updateAttrType('attr1', '${key}')">
                                                ${attrTypes[key].label}
                                            </button>
                                        `).join('')}
                                    </div>
                                    <div class="input-group">
                                        <div style="font-size:0.9rem; color:#64748b; font-style:italic; margin-bottom:5px;">Hint: ${t1.hint}</div>
                                        <div style="display:flex; align-items:center; gap:8px;">
                                            <span style="font-weight:600; color:#475569; min-width:60px;">${prefix1}</span>
                                            <input type="text" class="text-input" id="attr1Input" value="${userAnswers.attr1}"
                                                placeholder="..." oninput="updatePreview('attr1', this.value)">
                                            <div class="tools" style="margin-top:0;">
                                                <button class="tool-btn" id="attr1Btn" onclick="toggleChoices('attr1')">Ideas</button>
                                            </div>
                                        </div>
                                        <div class="choices-grid hidden" id="attr1Choices"></div>
                                    </div>
                                </div>

                                <!-- Attr 2 -->
                                <div>
                                    <div style="display:flex; gap:10px; margin-bottom:10px; overflow-x:auto; padding-bottom:5px;">
                                        ${Object.keys(attrTypes).map(key => `
                                            <button class="tool-btn ${userAnswers.attr2Type === key ? 'active' : ''}" 
                                                style="${userAnswers.attr2Type === key ? 'background:#e0f2fe; border-color:#0ea5e9; color:#0284c7;' : ''}"
                                                onclick="updateAttrType('attr2', '${key}')">
                                                ${attrTypes[key].label}
                                            </button>
                                        `).join('')}
                                    </div>
                                    <div class="input-group">
                                        <div style="font-size:0.9rem; color:#64748b; font-style:italic; margin-bottom:5px;">Hint: ${t2.hint}</div>
                                        <div style="display:flex; align-items:center; gap:8px;">
                                            <span style="font-weight:600; color:#475569; min-width:60px;">${prefix2}</span>
                                            <input type="text" class="text-input" id="attr2Input" value="${userAnswers.attr2}"
                                                placeholder="..." oninput="updatePreview('attr2', this.value)">
                                            <div class="tools" style="margin-top:0;">
                                                <button class="tool-btn" id="attr2Btn" onclick="toggleChoices('attr2')">Ideas</button>
                                            </div>
                                        </div>
                                        <div class="choices-grid hidden" id="attr2Choices"></div>
                                    </div>
                                </div>

                                <div class="sentence-preview" style="margin-top: 20px;">
                                    Sentences: 
                                    <div style="margin-left:10px;">
                                        1. <strong>${attrSentence1}.</strong><br>
                                        2. <strong>${attrSentence2}.</strong>
                                    </div>
                                </div>
                                <div style="text-align: right; margin-top: 10px;">
                                    <button class="primary-btn" onclick="finalize()">Create Definition</button>
                                </div>
                            </div>
                        </div>

                        <!-- Review -->
                        <div class="review-section ${userAnswers.activeStep === 'review' ? '' : 'hidden'}" id="reviewSection">
                            <h3 style="margin-top:0">Final Definition</h3>
                            <div class="final-sentence" id="finalText"></div>
                            <div style="margin-top: 20px;">
                                <button class="primary-btn" onclick="reset()">Do Another Word</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            if (userAnswers.activeStep === 'review') {
                finalize(true);
            }
        }

        function finalize(skipStateUpdate = false) {
            if (!skipStateUpdate) {
                userAnswers.activeStep = 'review';
                if (!userAnswers.completedSteps.includes('step3')) userAnswers.completedSteps.push('step3');
                renderActivity();
            }

            const cat = userAnswers.category.trim();
            const func = userAnswers.function.trim();
            const a1 = userAnswers.attr1.trim();
            const a2 = userAnswers.attr2.trim();

            const isPlural = currentEntry.isPlural;
            const pronoun = isPlural ? 'They' : 'It';

            let subjectName;
            if (currentEntry.isPlural || currentEntry.isMass) {
                subjectName = currentEntry.word;
            } else {
                subjectName = `${getArticle(currentEntry.word)} ${currentEntry.word.toLowerCase()}`;
            }
            const SubjectName = cap(subjectName);

            // 1. Category
            let s1 = '';
            if (isPlural) {
                s1 = `${currentEntry.word} are a type of <span class="highlight">${cat}</span>.`;
            } else if (currentEntry.isMass) {
                // Always use "is a type of" for mass nouns to align with preview and ensure grammar
                // e.g. "Snow is a type of weather" instead of "Snow is a weather"
                s1 = `${SubjectName} is a type of <span class="highlight">${cat}</span>.`;
            } else {
                if (cat.toLowerCase().includes('winter') || cat.toLowerCase().includes('clothing')) {
                    s1 = `${SubjectName} is a type of <span class="highlight">${cat}</span>.`;
                } else {
                    const article = getArticle(cat);
                    s1 = `${SubjectName} is ${article} <span class="highlight">${cat}</span>.`;
                }
            }

            // 2. Function
            let s2 = '';
            if (func.toLowerCase().startsWith('used') || func.toLowerCase().startsWith('made')) {
                const verbBe = isPlural ? 'are' : 'is';
                s2 = `${pronoun} ${verbBe} <span class="highlight">${func}</span>.`;
            } else {
                s2 = `${pronoun} <span class="highlight">${func}</span>.`;
            }

            // 3. Attributes
            // get user selected types or default
            const type1 = userAnswers.attr1Type || 'looks';
            const type2 = userAnswers.attr2Type || 'looks';
            const t1 = attrTypes[type1];
            const t2 = attrTypes[type2];

            const p1 = isPlural ? t1.pluralPrefix : t1.prefix;
            const p2 = isPlural ? t2.pluralPrefix : t2.prefix;

            const s3 = `${p1} <span class="highlight">${a1}</span>. ${p2} <span class="highlight">${a2}</span>.`;

            const finalTextEl = document.getElementById('finalText');
            if (finalTextEl) finalTextEl.innerHTML = `${s1} ${s2} ${s3}`;
        }

        // Logic Functions
        function toggleStep(id) {
            userAnswers.activeStep = id;
            renderActivity();
        }

        function nextStep(currentId, nextId) {
            if (!userAnswers.completedSteps.includes(currentId)) {
                userAnswers.completedSteps.push(currentId);
            }
            userAnswers.activeStep = nextId;
            renderActivity();

            setTimeout(() => {
                let targetId = '';
                if (nextId === 'step2') targetId = 'funcInput';
                if (nextId === 'step3') targetId = 'attr1Input';

                if (targetId) {
                    const el = document.getElementById(targetId);
                    if (el) el.focus();
                }
            }, 50);
        }

        function toggleChoices(type) {
            const grid = document.getElementById(`${type}Choices`);
            const btn = document.getElementById(`${type}Btn`);

            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                if (btn) {
                    btn.textContent = 'Hide Ideas';
                    btn.classList.add('active');
                }
                if (grid.children.length === 0) {
                    generateChoicesUI(type, grid);
                }
            } else {
                grid.classList.add('hidden');
                if (btn) {
                    btn.textContent = 'Show Ideas';
                    btn.classList.remove('active');
                }
            }
        }

        function generateChoicesUI(type, container) {
            let choices = [];
            if (type === 'cat') choices = currentEntry.category.choices;
            if (type === 'func') choices = currentEntry.function.choices;
            if (type === 'attr1') choices = currentEntry.attributes[0].choices;
            if (type === 'attr2') choices = currentEntry.attributes[1].choices;

            container.innerHTML = choices.map(c =>
                `<div class="choice-chip" onclick="selectChoice('${type}', '${c}')">${c}</div>`
            ).join('');
        }

        function selectChoice(type, value) {
            let inputId = `${type}Input`;
            const input = document.getElementById(inputId);
            if (input) {
                input.value = value;
                updatePreview(type, value);
            }
            toggleChoices(type);
        }

        function updatePreview(type, val) {
            let key = type;
            if (type === 'cat') key = 'category';
            if (type === 'func') key = 'function';
            userAnswers[key] = val;

            if (type === 'cat') {
                const el = document.getElementById('catPreview');
                if (el) el.textContent = val || '________';
            }
            if (type === 'func') {
                const el = document.getElementById('funcPreview');
                if (el) el.textContent = val || '________';
            }
            if (type.startsWith('attr')) {
                const el = document.getElementById(`${type}Preview`);
                if (el) el.textContent = val || '________';
            }
        }

        function reset() {
            const idx = entries.indexOf(currentEntry);
            const nextIdx = (idx + 1) % entries.length;
            loadEntry(entries[nextIdx].id);
        }

        // Init
        init();

    </script>
</body>

</html>
