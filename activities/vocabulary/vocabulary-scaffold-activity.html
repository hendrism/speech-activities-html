<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Builder: Scaffolded Sentences</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
</head>

<body class="category-vocabulary">

    <div class="header">
        <div class="app-title">
            <span>✨</span> Vocabulary Builder
        </div>
        <div class="level-indicator">
            Item <span id="current-item-num">1</span> of 12
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Word Pairs</div>
            <ul class="sidebar-list" id="sidebar-list">
                <!-- Items generated via JS -->
            </ul>
        </div>

        <!-- Main Card -->
        <div class="activity-card" id="activity-container">
            <!-- Rendered via JS -->
        </div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" id="prev-btn" onclick="prevItem()">
            ← Previous
        </button>
        <button class="nav-btn primary" id="next-btn" onclick="nextItem()">
            Next Item →
        </button>
    </div>

    <script>
        // Data Source
        const activityData = DataLoader.get("vocabulary", "vocabularyScaffold");

        // State
        let currentIndex = 0;
        let currentLevel = 3; // Starts at 3 (Independent) -> 2 (Some Help) -> 1 (Max Help)

        // DOM Elements
        const container = document.getElementById('activity-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const countSpan = document.getElementById('current-item-num');
        const sidebarList = document.getElementById('sidebar-list');

        function init() {
            renderSidebar();
            renderItem();
        }

        function renderSidebar() {
            sidebarList.innerHTML = '';
            activityData.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `sidebar-item ${index === currentIndex ? 'active' : ''}`;
                li.onclick = () => {
                    currentIndex = index;
                    // Reset level if needed, or keep? Usually navigating jumps resets context.
                    // Let's reset level for clarity as per user nav flow logic usually.
                    currentLevel = 3;
                    renderItem();
                    updateSidebar();
                };

                // Show emoji based on image or generic? Let's use generic or parse keywords.
                // Using simple numbers or text snippets.
                const wordPair = item.words.map(w => w.word).join(" / ");

                li.innerHTML = `
                    <span>${index + 1}. ${wordPair}</span>
                    <span class="item-status-icon">📝</span>
                `;
                sidebarList.appendChild(li);
            });
        }

        function updateSidebar() {
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Shuffle utility
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderItem() {
            const item = activityData[currentIndex];
            countSpan.textContent = currentIndex + 1;

            // Manage Buttons
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === activityData.length - 1;

            updateSidebar(); // Sync sidebar selection

            // Generate HTML
            let sentenceHTML = '';
            let levelBadge = '';

            // Logic for different Levels
            if (currentLevel === 3) {
                // Independent
                sentenceHTML = `
                    <div class="sentence-frame" style="align-items: flex-start;">
                        <span style="margin-top: 10px;">${item.subject} feels</span>
                        <textarea class="blank-input" placeholder="emotion" aria-label="emotion word"></textarea>
                        <span style="margin-top: 10px;">because</span>
                        <textarea class="blank-input" style="flex: 1;" placeholder="reason..." aria-label="reason"></textarea>
                        <span style="margin-top: 10px;">.</span>
                    </div>
                `;
                levelBadge = '<span class="scaffold-badge badge-l3">Level 3: Independent</span>';
            } else if (currentLevel === 2) {
                // Some Help
                const frameText = item.scaffolds.l2.frame;
                sentenceHTML = `
                    <div class="sentence-frame" style="align-items: flex-start;">
                        <span style="margin-top: 10px;">${frameText}</span>
                        <textarea class="blank-input" style="flex: 1;" placeholder="finish the thought..." aria-label="reason"></textarea>
                        <span style="margin-top: 10px;">.</span>
                    </div>
                `;
                levelBadge = '<span class="scaffold-badge badge-l2">Level 2: Guided</span>';
            } else {
                // Max Help - Multiple Choice
                // Create a temporary copy for display
                const opts = [...item.scaffolds.l1.options];
                // Shuffle for randomness
                shuffleArray(opts);

                const optionsHTML = opts.map((opt, i) => `
                    <div class="mc-option" onclick="checkAnswer(this, ${opt.correct})">
                        <div class="mc-indicator"></div>
                        <span>${opt.text}</span>
                    </div>
                `).join('');

                sentenceHTML = `
                    <div class="sentence-frame">
                        <span style="width:100%; display:block; margin-bottom:0.5rem;">${item.scaffolds.l1.starter}</span>
                        <div class="mc-container">
                            ${optionsHTML}
                        </div>
                    </div>
                `;
                levelBadge = '<span class="scaffold-badge badge-l1">Level 1: Multiple Choice</span>';
            }

            const helpButtonState = currentLevel > 1
                ? `<button class="help-btn" onclick="increaseSupport()">
                     <span>💡</span> ${currentLevel === 3 ? "I need help" : "I need more help"}
                   </button>`
                : `<button class="help-btn" disabled>
                     <span>✨</span> Maximum Support Active
                   </button>`;

            container.innerHTML = `
                <div class="image-area">
                    <img src="${item.image}" alt="Scenario illustration" class="story-image" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Image+Coming+Soon'">
                </div>
                <div class="content-area fade-in">
                    <div style="display:flex; align-items:center; margin-bottom:1rem;">
                        <h2 style="color:var(--text-muted); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Vocabulary Choices</h2>
                        ${levelBadge}
                    </div>
                    
                    <div class="choices-container">
                        ${shuffleArray([...item.words]).map(w => `
                            <div class="choice-card" onclick="selectWord(this)">
                                <span class="word-title">${w.word}</span>
                                <span class="word-def">${w.def}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="sentence-section">
                        <span class="sentence-label">Complete the Sentence</span>
                        ${sentenceHTML}
                    </div>

                    <div class="controls">
                        ${helpButtonState}
                    </div>
                </div>
            `;
        }

        function checkAnswer(el, isCorrect) {
            // Reset others in this specific container
            el.parentElement.querySelectorAll('.mc-option').forEach(opt => {
                opt.classList.remove('correct', 'incorrect');
            });

            if (isCorrect) {
                el.classList.add('correct');
            } else {
                el.classList.add('incorrect');
            }
        }

        function selectWord(card) {
            // Visual selection only
            document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
        }

        function increaseSupport() {
            if (currentLevel > 1) {
                currentLevel--;
                renderItem();
            }
        }

        function nextItem() {
            if (currentIndex < activityData.length - 1) {
                currentIndex++;
                currentLevel = 3; // Reset to Independent
                renderItem();
            }
        }

        function prevItem() {
            if (currentIndex > 0) {
                currentIndex--;
                currentLevel = 3; // Ops choice: Reset or keep? Reset implies fresh start per item.
                renderItem();
            }
        }

        // Init
        init();

    </script>
</body>

</html>
