<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synonyms – Thanksgiving Edition</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
</head>
<body class="category-vocabulary">
    <header>
        <div class="header-content">
            <h1>🧠 Synonym Search</h1>
            <div class="level-badge">Thanksgiving Edition</div>
        </div>
    </header>

    <div class="container">
        <div class="info-box">
            <h3>About This Activity</h3>
            <p>Read each Thanksgiving sentence and choose a synonym (same-meaning word). Type your own idea first. Tap “I need help” for a clue. Tap “I need more help” to see three choices (one correct).</p>
        </div>

        <div class="word-nav" id="wordNav"></div>

        <div class="card" id="card"></div>
    </div>

    <script>
        const items = DataLoader.get("vocabulary", "synonymsThanksgiving");

        let currentIndex = 0;
        const sequence = shuffle(items);
        const card = document.getElementById("card");
        const wordNav = document.getElementById("wordNav");

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildNav() {
            wordNav.innerHTML = sequence.map((item, i) => `<button class="nav-pill" data-index="${i}">${i + 1}. ${item.word}</button>`).join("");
            wordNav.querySelectorAll(".nav-pill").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentIndex = parseInt(btn.dataset.index, 10);
                    renderCard();
                    card.scrollIntoView({ behavior: "smooth" });
                });
            });
        }

        function updateNavActive() {
            wordNav.querySelectorAll(".nav-pill").forEach((btn, i) => btn.classList.toggle("active", i === currentIndex));
        }

        function renderCard() {
            const item = sequence[currentIndex];
            const choices = shuffle([item.correct, ...item.distractors].map((text, idx) => ({ text, correct: idx === 0 })));

            card.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${((currentIndex + 1) / sequence.length) * 100}%;"></div>
                </div>

                <div class="sentence-info">
                    <span class="sentence-number">Word ${currentIndex + 1} of ${sequence.length}</span>
                </div>

                <div class="sentence-display">
                    <div class="sentence-text">${item.sentence}</div>
                </div>

                <div class="question-text">Which word means the SAME as "<strong>${item.word}</strong>"?</div>
                <textarea class="answer-input" placeholder="Type your own synonym here..."></textarea>

                <div class="helper">
                    <button class="hint-btn" id="hintBtn">💡 I need help</button>
                    <button class="hint-btn" id="moreBtn">📘 I need more help</button>
                </div>
                <div class="hint-content" id="hintBox"><strong>Hint:</strong> ${item.hint}</div>
                <div class="options-wrap" id="optionsWrap">
                    <div class="options" id="options">
                        ${choices.map((choice, i) => `
                            <label class="option" data-correct="${choice.correct}" id="opt-${i}">
                                <input type="radio" name="choice" value="${choice.text.replace(/"/g, "&quot;")}">
                                <span>${choice.text}</span>
                            </label>
                        `).join("")}
                    </div>
                </div>

                <div class="feedback" id="feedback"></div>

                <div class="navigation">
                    <button class="nav-btn prev-btn" id="prevBtn"${currentIndex === 0 ? " disabled" : ""}>⬅ Back</button>
                    <button class="nav-btn next-btn" id="nextBtn" disabled>${currentIndex === sequence.length - 1 ? "Finish" : "Next ➡"}</button>
                </div>
            `;
            updateNavActive();

            const hintBox = document.getElementById("hintBox");
            const optionsWrap = document.getElementById("optionsWrap");
            document.getElementById("hintBtn").addEventListener("click", () => {
                hintBox.style.display = hintBox.style.display === "block" ? "none" : "block";
            });
            document.getElementById("moreBtn").addEventListener("click", () => {
                const showing = optionsWrap.style.display === "block";
                optionsWrap.style.display = showing ? "none" : "block";
            });

            const feedback = document.getElementById("feedback");
            const nextBtn = document.getElementById("nextBtn");
            const optionEls = Array.from(document.querySelectorAll(".option"));

            optionEls.forEach(opt => {
                opt.addEventListener("click", () => {
                    optionEls.forEach(o => o.classList.add("disabled"));
                    const isCorrect = opt.dataset.correct === "true";
                    opt.classList.add(isCorrect ? "correct" : "incorrect");
                    if (!isCorrect) {
                        optionEls.forEach(o => { if (o.dataset.correct === "true") o.classList.add("correct"); });
                    }
                    feedback.classList.add("show");
                    feedback.textContent = isCorrect ? "🎉 Correct! Nice synonym." : "The correct synonym is highlighted above.";
                    feedback.style.background = isCorrect ? "#dcfce7" : "#fee2e2";
                    feedback.style.color = isCorrect ? "#166534" : "#991b1b";
                    nextBtn.disabled = false;
                });
            });

            document.getElementById("prevBtn").addEventListener("click", () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCard();
                }
            });

            nextBtn.addEventListener("click", () => {
                if (currentIndex < sequence.length - 1) {
                    currentIndex++;
                    renderCard();
                } else {
                    nextBtn.disabled = true;
                }
            });
        }

        buildNav();
        renderCard();
    </script>
</body>
</html>
