<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Functions: Spring</title>
    <style>
        :root {
            --primary: #ec4899; /* Spring pink */
            --primary-light: #f472b6;
            --primary-dark: #be185d;
            --secondary: #10b981;
            --accent: #f59e0b;
            --background: #fdf2f8; /* Light spring pink background */
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            line-height: 1.5;
        }

        body {
            font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1,
        h2,
        h3 {
            margin: 0;
            font-weight: 700;
        }

        /* Header */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .app-title {
            font-size: 1.5rem;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
        }

        .level-indicator {
            background: var(--surface);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        /* Layout */
        .app-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            max-height: calc(100vh - 150px);
        }

        .sidebar-header {
            padding: 1rem;
            background: #fce7f3; /* Spring pink header */
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
        }

        .sidebar-item {
            padding: 12px 16px;
            border-bottom: 1px solid #fdf2f8;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .sidebar-item:hover {
            background: #fdf2f8;
            color: var(--primary);
        }

        .sidebar-item.active {
            background: #fbcfe8;
            color: var(--primary-dark);
            border-left: 4px solid var(--primary);
            font-weight: 600;
        }

        /* Main Card */
        .activity-card {
            background: var(--surface);
            width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            border: 1px solid var(--border);
            animation: fadeIn 0.5s ease-out;
            flex: 1;
            min-height: 600px;
        }

        .instruction-banner {
            background: #fce7f3;
            color: #be185d;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            border: 1px solid #fbcfe8;
        }

        .set-title {
            font-size: 1.8rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        /* Drag & Drop Areas */
        .drop-zones-container {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .drop-zone {
            flex: 1;
            background: #fdf2f8;
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            min-height: 250px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }

        .drop-zone.drag-over {
            border-color: var(--primary);
            background: #fbcfe8;
        }

        .drop-zone-header {
            background: white;
            padding: 0.75rem;
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            border-top-left-radius: var(--radius-md);
            border-top-right-radius: var(--radius-md);
            font-size: 1.2rem;
        }

        .drop-zone-content {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-content: flex-start;
            justify-content: center;
            min-height: 200px;
        }

        .source-pool {
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            align-content: center;
            transition: all 0.2s;
        }

        .source-pool.drag-over {
            border-color: var(--primary);
            background: #fbcfe8;
        }

        .draggable-item {
            width: var(--item-size, 130px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: grab;
            transition: transform 0.2s, width 0.2s;
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        .draggable-item:hover {
            transform: scale(1.05);
        }

        .item-image {
            width: var(--img-size, 100px);
            height: var(--img-size, 100px);
            object-fit: contain;
            background: white;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 0.25rem;
            box-shadow: var(--shadow-sm);
            pointer-events: none;
            transition: width 0.2s, height 0.2s;
            /* Fallback styling for broken images */
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .item-label {
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-main);
            pointer-events: none;
        }

        /* Navigation */
        .nav-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="app-title">
            <span>🌸</span> Sorting Functions: Spring
        </div>
        <div class="level-indicator">
            Set <span id="current-item-num">1</span> of 10
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Function Sets</div>
            <ul class="sidebar-list" id="sidebar-list">
                <!-- Generated via JS -->
            </ul>
        </div>

        <!-- Main Card -->
        <div class="activity-card" id="activity-card">

            <div class="instruction-banner">
                🎯 Sort the items by dragging them into the correct function box.
            </div>

            <h2 class="set-title" id="set-title">Set Title</h2>

            <div class="drop-zones-container" id="drop-zones-container">
                <!-- Drop zones generated via JS based on categories count -->
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                <h3 style="color: var(--text-muted); font-size: 1rem; margin: 0;">Items to Sort:</h3>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="size-slider"
                        style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Image Size:</label>
                    <input type="range" id="size-slider" min="80" max="250" value="100"
                        oninput="updateImageSize(this.value)">
                </div>
            </div>
            <div class="source-pool" id="source-pool" ondrop="drop(event)" ondragover="allowDrop(event)">
                <!-- Draggable items generated via JS -->
            </div>

        </div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" id="prev-btn" onclick="prevItem()">← Previous Set</button>
        <button class="nav-btn" id="next-btn" onclick="nextItem()">Next Set →</button>
    </div>

    <script>
        const activityData = [
            {
                id: 1,
                title: "Set 1",
                categories: ["You wear it", "You carry it"],
                items: [
                    { name: "Raincoat", folder: "clothing", img: "raincoat.png" },
                    { name: "Rain boots", folder: "clothing", img: "rain-boots.png" },
                    { name: "Light jacket", folder: "clothing", img: "jacket.png" },
                    { name: "Umbrella", folder: "objects", img: "umbrella.png" },
                    { name: "Basket", folder: "objects", img: "basket.png" },
                    { name: "Backpack", folder: "objects", img: "backpack.png" }
                ]
            },
            {
                id: 2,
                title: "Set 2",
                categories: ["You plant it", "You pick it"],
                items: [
                    { name: "Seeds", folder: "plants", img: "seeds.png" },
                    { name: "Seedling", folder: "plants", img: "seedling.png" },
                    { name: "Sapling", folder: "plants", img: "sapling.png" },
                    { name: "Flower", folder: "plants", img: "tulip.png" },
                    { name: "Strawberry", folder: "food", img: "strawberry.png" },
                    { name: "Tomato", folder: "food", img: "tomato.png" }
                ]
            },
            {
                id: 3,
                title: "Set 3",
                categories: ["It flies", "It hops"],
                items: [
                    { name: "Butterfly", folder: "animals", img: "butterfly.png" },
                    { name: "Bee", folder: "animals", img: "bee.png" },
                    { name: "Robin", folder: "animals", img: "robin.png" },
                    { name: "Frog", folder: "animals", img: "frog.png" },
                    { name: "Rabbit", folder: "animals", img: "rabbit.png" },
                    { name: "Grasshopper", folder: "animals", img: "grasshopper.png" }
                ]
            },
            {
                id: 4,
                title: "Set 4",
                categories: ["Use it in the garden", "Use it in the house"],
                items: [
                    { name: "Watering can", folder: "objects", img: "watering-can.png" },
                    { name: "Shovel", folder: "objects", img: "shovel.png" },
                    { name: "Rake", folder: "objects", img: "rake.png" },
                    { name: "Vase", folder: "objects", img: "vase.png" },
                    { name: "Broom", folder: "objects", img: "broom.png" },
                    { name: "Duster", folder: "objects", img: "duster.png" }
                ]
            },
            {
                id: 5,
                title: "Set 5",
                categories: ["It blooms", "It melts"],
                items: [
                    { name: "Tulip", folder: "plants", img: "tulip.png" },
                    { name: "Daffodil", folder: "plants", img: "daffodil.png" },
                    { name: "Daisy", folder: "plants", img: "daisy.png" },
                    { name: "Snowman", folder: "objects", img: "snowman.png" },
                    { name: "Icicle", folder: "nature", img: "icicle.png" },
                    { name: "Snow", folder: "nature", img: "snow.png" }
                ]
            },
            {
                id: 6,
                title: "Set 6",
                categories: ["You ride it", "You fly it"],
                items: [
                    { name: "Bicycle", folder: "objects", img: "bike.png" },
                    { name: "Scooter", folder: "objects", img: "scooter.png" },
                    { name: "Skateboard", folder: "objects", img: "skateboard.png" },
                    { name: "Kite", folder: "objects", img: "kite.png" },
                    { name: "Paper airplane", folder: "objects", img: "paper_airplane.png" },
                    { name: "Drone", folder: "objects", img: "drone.png" }
                ]
            },
            {
                id: 7,
                title: "Set 7",
                categories: ["Wear in the rain", "Wear in the sun"],
                items: [
                    { name: "Raincoat", folder: "clothing", img: "raincoat.png" },
                    { name: "Rain boots", folder: "clothing", img: "rain-boots.png" },
                    { name: "Poncho", folder: "clothing", img: "poncho.png" },
                    { name: "Sunglasses", folder: "clothing", img: "sunglasses.png" },
                    { name: "Sun hat", folder: "clothing", img: "sun_hat.png" },
                    { name: "T-shirt", folder: "clothing", img: "t-shirt.png" }
                ]
            },
            {
                id: 8,
                title: "Set 8",
                categories: ["Builds a nest", "Digs a hole"],
                items: [
                    { name: "Robin", folder: "animals", img: "robin.png" },
                    { name: "Wasp", folder: "animals", img: "wasp.png" },
                    { name: "Cardinal", folder: "animals", img: "cardinal.png" },
                    { name: "Ant", folder: "animals", img: "ant.png" },
                    { name: "Worm", folder: "animals", img: "earthworm.png" },
                    { name: "Groundhog", folder: "animals", img: "groundhog.png" }
                ]
            },
            {
                id: 9,
                title: "Set 9",
                categories: ["Lives in the ground", "Lives above ground"],
                items: [
                    { name: "Earthworm", folder: "animals", img: "earthworm.png" },
                    { name: "Mole", folder: "animals", img: "mole.png" },
                    { name: "Grub", folder: "animals", img: "larvae.png" },
                    { name: "Robin", folder: "animals", img: "robin.png" },
                    { name: "Butterfly", folder: "animals", img: "butterfly.png" },
                    { name: "Chipmunk", folder: "animals", img: "chipmunk.png" }
                ]
            },
            {
                id: 10,
                title: "Set 10",
                categories: ["Used for gardening", "Used for outdoor fun"],
                items: [
                    { name: "Trowel", folder: "objects", img: "trowel.png" },
                    { name: "Watering can", folder: "objects", img: "watering-can.png" },
                    { name: "Garden gloves", folder: "clothing", img: "garden-gloves.png" },
                    { name: "Kite", folder: "objects", img: "kite.png" },
                    { name: "Jump rope", folder: "objects", img: "jump-rope.png" },
                    { name: "Sidewalk chalk", folder: "objects", img: "chalk.png" }
                ]
            }
        ];

        let currentIndex = 0;

        function init() {
            renderSidebar();
            loadItem(0);
        }

        function renderSidebar() {
            const list = document.getElementById('sidebar-list');
            list.innerHTML = activityData.map((item, index) => `
                <li class="sidebar-item ${index === currentIndex ? 'active' : ''}" 
                    onclick="loadItem(${index})">
                    ${item.categories.join(' / ')}
                </li>
            `).join('');
        }

        function updateSidebar() {
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach((item, index) => {
                if (index === currentIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // Shuffle an array in place
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadItem(index) {
            currentIndex = index;
            const data = activityData[index];

            document.getElementById('current-item-num').innerText = index + 1;
            document.getElementById('set-title').innerText = `Set ${index + 1}: ${data.categories.join(' / ')}`;

            // Build Drop Zones
            const dropZonesContainer = document.getElementById('drop-zones-container');
            dropZonesContainer.innerHTML = data.categories.map(cat => `
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                    <div class="drop-zone-header">${cat}</div>
                    <div class="drop-zone-content"></div>
                </div>
            `).join('');

            // Build Items (shuffled)
            const sourcePool = document.getElementById('source-pool');
            let shuffledItems = shuffle([...data.items]);

            sourcePool.innerHTML = shuffledItems.map((item, i) => `
                <div class="draggable-item" draggable="true" ondragstart="drag(event)" id="drag-item-${i}">
                    <img src="../../images/${item.folder}/${item.img}" alt="${item.name}" class="item-image" draggable="false" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23f1f5f9\\'/><text x=\\'50\\' y=\\'50\\' font-family=\\'sans-serif\\' font-size=\\'12\\' text-anchor=\\'middle\\' dominant-baseline=\\'middle\\' fill=\\'%2394a3b8\\'>Image</text></svg>';">
                    <span class="item-label">${item.name}</span>
                </div>
            `).join('');

            // Nav State
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === activityData.length - 1;

            updateSidebar();
        }

        function updateImageSize(value) {
            const root = document.documentElement;
            root.style.setProperty('--img-size', `${value}px`);
            root.style.setProperty('--item-size', `${parseInt(value) + 30}px`);
        }

        function prevItem() {
            if (currentIndex > 0) loadItem(currentIndex - 1);
        }

        function nextItem() {
            if (currentIndex < activityData.length - 1) loadItem(currentIndex + 1);
        }

        // Drag & Drop Implementation
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function dragEnter(ev) {
            ev.preventDefault();
            // Highlight drop zone
            let target = ev.target;
            while (target && !target.classList.contains('drop-zone') && !target.classList.contains('source-pool')) {
                target = target.parentElement;
            }
            if (target) target.classList.add('drag-over');
        }

        function dragLeave(ev) {
            let target = ev.target;
            while (target && !target.classList.contains('drop-zone') && !target.classList.contains('source-pool')) {
                target = target.parentElement;
            }
            if (target) target.classList.remove('drag-over');
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const element = document.getElementById(data);

            let dropTarget = ev.target;
            // Find the closest drop zone or source pool to append the element to its content container
            while (dropTarget && !dropTarget.classList.contains('drop-zone') && !dropTarget.classList.contains('source-pool')) {
                dropTarget = dropTarget.parentElement;
            }

            if (dropTarget) {
                dropTarget.classList.remove('drag-over');
                if (dropTarget.classList.contains('drop-zone')) {
                    const contentArea = dropTarget.querySelector('.drop-zone-content');
                    if (contentArea) contentArea.appendChild(element);
                } else if (dropTarget.classList.contains('source-pool')) {
                    dropTarget.appendChild(element);
                }
            }
        }

        // Initialize App
        init();

    </script>
</body>

</html>
