<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Functions: Spring</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
</head>

<body class="category-vocabulary">

    <div class="header">
        <div class="app-title">
            <span>🌸</span> Sorting Functions: Spring
        </div>
        <div class="level-indicator">
            Set <span id="current-item-num">1</span> of 10
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Function Sets</div>
            <ul class="sidebar-list" id="sidebar-list">
                <!-- Generated via JS -->
            </ul>
        </div>

        <!-- Main Card -->
        <div class="activity-card" id="activity-card">

            <div class="instruction-banner">
                🎯 Sort the items by dragging them into the correct function box.
            </div>

            <h2 class="set-title" id="set-title">Set Title</h2>

            <div class="drop-zones-container" id="drop-zones-container">
                <!-- Drop zones generated via JS based on categories count -->
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                <h3 style="color: var(--text-muted); font-size: 1rem; margin: 0;">Items to Sort:</h3>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="size-slider"
                        style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Image Size:</label>
                    <input type="range" id="size-slider" min="80" max="250" value="100"
                        oninput="updateImageSize(this.value)">
                </div>
            </div>
            <div class="source-pool" id="source-pool" ondrop="drop(event)" ondragover="allowDrop(event)">
                <!-- Draggable items generated via JS -->
            </div>

        </div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" id="prev-btn" onclick="prevItem()">← Previous Set</button>
        <button class="nav-btn" id="next-btn" onclick="nextItem()">Next Set →</button>
    </div>

    <script>
        const activityData = DataLoader.get("vocabulary", "sortingFunctionsSpring");

        let currentIndex = 0;

        function init() {
            renderSidebar();
            loadItem(0);
        }

        function renderSidebar() {
            const list = document.getElementById('sidebar-list');
            list.innerHTML = activityData.map((item, index) => `
                <li class="sidebar-item ${index === currentIndex ? 'active' : ''}" 
                    onclick="loadItem(${index})">
                    ${item.categories.join(' / ')}
                </li>
            `).join('');
        }

        function updateSidebar() {
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach((item, index) => {
                if (index === currentIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // Shuffle an array in place
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadItem(index) {
            currentIndex = index;
            const data = activityData[index];

            document.getElementById('current-item-num').innerText = index + 1;
            document.getElementById('set-title').innerText = `Set ${index + 1}: ${data.categories.join(' / ')}`;

            // Build Drop Zones
            const dropZonesContainer = document.getElementById('drop-zones-container');
            dropZonesContainer.innerHTML = data.categories.map(cat => `
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                    <div class="drop-zone-header">${cat}</div>
                    <div class="drop-zone-content"></div>
                </div>
            `).join('');

            // Build Items (shuffled)
            const sourcePool = document.getElementById('source-pool');
            let shuffledItems = shuffle([...data.items]);

            sourcePool.innerHTML = shuffledItems.map((item, i) => `
                <div class="draggable-item" draggable="true" ondragstart="drag(event)" id="drag-item-${i}">
                    <img src="../../images/${item.folder}/${item.img}" alt="${item.name}" class="item-image" draggable="false" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23f1f5f9\\'/><text x=\\'50\\' y=\\'50\\' font-family=\\'sans-serif\\' font-size=\\'12\\' text-anchor=\\'middle\\' dominant-baseline=\\'middle\\' fill=\\'%2394a3b8\\'>Image</text></svg>';">
                    <span class="item-label">${item.name}</span>
                </div>
            `).join('');

            // Nav State
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === activityData.length - 1;

            updateSidebar();
        }

        function updateImageSize(value) {
            const root = document.documentElement;
            root.style.setProperty('--img-size', `${value}px`);
            root.style.setProperty('--item-size', `${parseInt(value) + 30}px`);
        }

        function prevItem() {
            if (currentIndex > 0) loadItem(currentIndex - 1);
        }

        function nextItem() {
            if (currentIndex < activityData.length - 1) loadItem(currentIndex + 1);
        }

        // Drag & Drop Implementation
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function dragEnter(ev) {
            ev.preventDefault();
            // Highlight drop zone
            let target = ev.target;
            while (target && !target.classList.contains('drop-zone') && !target.classList.contains('source-pool')) {
                target = target.parentElement;
            }
            if (target) target.classList.add('drag-over');
        }

        function dragLeave(ev) {
            let target = ev.target;
            while (target && !target.classList.contains('drop-zone') && !target.classList.contains('source-pool')) {
                target = target.parentElement;
            }
            if (target) target.classList.remove('drag-over');
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const element = document.getElementById(data);

            let dropTarget = ev.target;
            // Find the closest drop zone or source pool to append the element to its content container
            while (dropTarget && !dropTarget.classList.contains('drop-zone') && !dropTarget.classList.contains('source-pool')) {
                dropTarget = dropTarget.parentElement;
            }

            if (dropTarget) {
                dropTarget.classList.remove('drag-over');
                if (dropTarget.classList.contains('drop-zone')) {
                    const contentArea = dropTarget.querySelector('.drop-zone-content');
                    if (contentArea) contentArea.appendChild(element);
                } else if (dropTarget.classList.contains('source-pool')) {
                    dropTarget.appendChild(element);
                }
            }
        }

        // Initialize App
        init();

    </script>
</body>

</html>
