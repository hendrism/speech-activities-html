<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Context Clues - Progressive Help</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
<style>
        :root {
            --midnight: #0f172a;
            --frost: #e2e8f0;
            --sky: #38bdf8;
            --pine: #0f766e;
            --snow: #f8fafc;
            --sun: #fbbf24;
            --berry: #7c3aed;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 15% 20%, #f1f5f9, #e0f2fe 60%, #f8fafc);
            color: var(--midnight);
            line-height: 1.6;
            padding: 24px 16px 48px;
        }
        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: var(--pine);
            letter-spacing: 0.3px;
        }
        .intro {
            max-width: 1100px;
            margin: 0 auto 16px;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }
        .intro::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 40%),
                        radial-gradient(circle at 80% 0%, rgba(124, 58, 237, 0.06), transparent 35%);
            pointer-events: none;
        }
        .shell {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            position: relative;
            overflow: hidden;
        }
        .shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.06), transparent 40%),
                        radial-gradient(circle at 90% 10%, rgba(124, 58, 237, 0.05), transparent 35%);
            pointer-events: none;
        }
        .card-shell-inner { position: relative; z-index: 1; }
        .card {
            border: 1px solid var(--frost);
            border-radius: 12px;
            padding: 16px;
            background: var(--snow);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        .card h3 {
            margin: 0 0 6px;
            color: var(--pine);
            font-size: 17px;
        }
        .sentence {
            margin: 0 0 10px;
        }
        .clue-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: linear-gradient(135deg, #e0f2fe, #fef9c3);
            color: #92400e;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .help-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
        }
        .btn-clue { background: var(--sky); color: white; }
        .btn-choices { background: var(--sun); color: #92400e; }
        .btn:disabled { background: #cbd5e1; color: #475569; cursor: not-allowed; }
        .hint {
            display: none;
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            background: #fefce8;
            border: 1px solid #fbbf24;
            color: #0f172a;
        }
        .choices {
            display: none;
            grid-template-columns: 1fr;
            gap: 8px;
            margin: 6px 0;
        }
        .choice-btn {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            background: white;
            cursor: pointer;
            font-weight: 700;
            text-align: left;
            transition: all 0.2s ease;
        }
        .choice-btn:hover { border-color: var(--sky); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08); }
        .choice-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .choice-btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
        .feedback {
            display: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 700;
            margin-top: 6px;
        }
        .feedback.correct { background: #dcfce7; color: #166534; }
        .feedback.incorrect { background: #fee2e2; color: #7f1d1d; }
        .response {
            width: 100%;
            min-height: 90px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            margin: 10px 0 8px;
            resize: vertical;
        }
        .nav-bar {
            max-width: 1100px;
            margin: 0 auto 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            position: sticky;
            top: 0;
            background: rgba(241, 245, 249, 0.92);
            padding: 8px 0 6px;
            backdrop-filter: blur(4px);
            z-index: 8;
        }
        .nav-bar button {
            border: 1px solid var(--frost);
            background: white;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            font-weight: 700;
            color: var(--midnight);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.07);
            transition: all 0.2s ease;
        }
        .nav-bar button:hover { border-color: var(--sky); transform: translateY(-1px); }
        .nav-bar button.active {
            background: linear-gradient(135deg, #e0f2fe, #fef9c3);
            border-color: var(--sky);
            color: #92400e;
        }
    </style>
</head>
<body class="category-vocabulary">
    <h1>Winter Context Clues - Progressive Help</h1>
    <div class="intro">
        Read one winter sentence at a time. First, type your own definition in the box. Then use the progressive help: tap "Show clue" for a hint, then "Show choices" to see options. No answers are shown until you pick.
    </div>
    <div class="nav-bar" id="navBar"></div>
    <div class="shell">
        <div class="card-shell-inner" id="cardShell"></div>
    </div>

    <script>
        const items = DataLoader.get("vocabulary", "winterContextCluesProgressive");

        const navBar = document.getElementById('navBar');
        const cardShell = document.getElementById('cardShell');

        function shuffle(array) {
            const copy = array.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightWord(sentence, word) {
            const pattern = new RegExp(`(${escapeRegex(word)})`, 'i');
            return sentence.replace(pattern, '<strong>$1</strong>');
        }

        function createCard(item, index) {
            const card = document.createElement('div');
            card.className = 'card';

            const title = document.createElement('h3');
            title.textContent = `${index + 1}. ${item.word}`;
            card.appendChild(title);

            const type = document.createElement('span');
            type.className = 'clue-type';
            type.textContent = item.type;
            card.appendChild(type);

            const sentence = document.createElement('p');
            sentence.className = 'sentence';
            sentence.innerHTML = highlightWord(item.sentence, item.word);
            card.appendChild(sentence);

            const response = document.createElement('textarea');
            response.className = 'response';
            response.placeholder = 'Type your own definition here before using clues...';
            card.appendChild(response);

            const helpRow = document.createElement('div');
            helpRow.className = 'help-row';
            const clueBtn = document.createElement('button');
            clueBtn.className = 'btn btn-clue';
            clueBtn.textContent = 'Show clue';
            const choicesBtn = document.createElement('button');
            choicesBtn.className = 'btn btn-choices';
            choicesBtn.textContent = 'Show choices';
            choicesBtn.disabled = true;
            helpRow.appendChild(clueBtn);
            helpRow.appendChild(choicesBtn);
            card.appendChild(helpRow);

            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = item.hint;
            card.appendChild(hint);

            const choicesWrap = document.createElement('div');
            choicesWrap.className = 'choices';
            card.appendChild(choicesWrap);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            card.appendChild(feedback);

            clueBtn.addEventListener('click', () => {
                hint.style.display = 'block';
                choicesBtn.disabled = false;
                clueBtn.disabled = true;
            });

            choicesBtn.addEventListener('click', () => {
                choicesWrap.innerHTML = '';
                choicesWrap.style.display = 'grid';
                feedback.style.display = 'none';
                feedback.textContent = '';
                feedback.className = 'feedback';

                const shuffled = shuffle(item.choices);
                shuffled.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice;
                    btn.addEventListener('click', () => {
                        const isCorrect = choice === item.answer;
                        feedback.textContent = isCorrect ? 'Correct!' : 'Not yet—use the hint and context.';
                        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                        feedback.style.display = 'block';
                        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                        if (isCorrect) {
                            choicesWrap.querySelectorAll('button').forEach(b => b.disabled = true);
                        }
                    });
                    choicesWrap.appendChild(btn);
                });
                choicesBtn.disabled = true;
            });

            return card;
        }

        function renderNav(activeId) {
            navBar.innerHTML = '';
            items.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `${idx + 1}. ${item.word}`;
                btn.className = item.word === activeId ? 'active' : '';
                btn.addEventListener('click', () => renderCard(item.word));
                navBar.appendChild(btn);
            });
        }

        function renderCard(word) {
            const item = items.find(entry => entry.word === word) || items[0];
            renderNav(item.word);
            cardShell.innerHTML = '';
            cardShell.appendChild(createCard(item, items.indexOf(item)));
        }

        renderCard(items[0].word);
    </script>
</body>
</html>
