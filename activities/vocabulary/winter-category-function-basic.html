<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Category & Function - Basic</title>
    <style>
        :root {
            --midnight: #0f172a;
            --frost: #e2e8f0;
            --sky: #38bdf8;
            --pine: #0f766e;
            --snow: #f8fafc;
            --sun: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 15% 20%, #f1f5f9, #e0f2fe 60%, #f8fafc);
            color: var(--midnight);
            line-height: 1.6;
            padding: 24px 16px 48px;
        }
        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: var(--pine);
            letter-spacing: 0.3px;
        }
        .intro {
            max-width: 1100px;
            margin: 0 auto 16px;
            background: white;
            border: 1px solid var(--frost);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
        }
        .nav {
            max-width: 1100px;
            margin: 0 auto 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            position: sticky;
            top: 0;
            background: rgba(241, 245, 249, 0.92);
            padding: 8px 0 6px;
            backdrop-filter: blur(4px);
            z-index: 8;
        }
        .nav button {
            border: 1px solid var(--frost);
            background: white;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            font-weight: 700;
            color: var(--midnight);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.07);
            transition: all 0.2s ease;
        }
        .nav button:hover { border-color: var(--sky); transform: translateY(-1px); }
        .nav button.active {
            background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
            border-color: var(--sky);
            color: var(--pine);
        }
        .shell {
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border: 1px solid var(--frost);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .word {
            margin: 0;
            color: var(--pine);
        }
        .tasks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .task {
            border: 1px solid var(--frost);
            border-radius: 12px;
            padding: 12px;
            background: var(--snow);
        }
        .task-title {
            margin: 0 0 6px;
            font-weight: 700;
        }
        .help-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-clue { background: var(--sky); color: white; }
        .btn-choices { background: var(--sun); color: #92400e; }
        .btn:disabled { background: #cbd5e1; color: #475569; cursor: not-allowed; }
        .clue {
            display: none;
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            background: #ecfeff;
            border: 1px solid #bae6fd;
            color: #0f172a;
        }
        .choices {
            display: none;
            grid-template-columns: 1fr;
            gap: 8px;
            margin: 6px 0;
        }
        .choice-btn {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            background: white;
            cursor: pointer;
            font-weight: 700;
            text-align: left;
            transition: all 0.2s ease;
        }
        .choice-btn:hover { border-color: var(--sky); transform: translateY(-1px); }
        .choice-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .choice-btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
        .feedback {
            display: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 700;
            margin-top: 6px;
        }
        .feedback.correct { background: #dcfce7; color: #166534; }
        .feedback.incorrect { background: #fee2e2; color: #7f1d1d; }
        .answer-input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            margin: 8px 0 12px;
            min-height: 72px;
            resize: vertical;
        }
        .answer-input:focus {
            outline: none;
            border-color: var(--sky);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .combine-card {
            margin-top: 14px;
            border: 1px solid var(--frost);
            border-radius: 12px;
            padding: 12px;
            background: #fdfdfb;
        }
        .combine-title {
            margin: 0 0 8px;
            font-size: 1rem;
            color: var(--pine);
        }
        .combine-area {
            width: 100%;
            min-height: 90px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }
        .combine-btn {
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 700;
            background: var(--sky);
            color: white;
            margin-top: 8px;
        }
        .media {
            margin: 10px 0 6px;
            border: 1px solid var(--frost);
            border-radius: 12px;
            background: #f8fafc;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }
        .media img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            display: block;
        }
        .media.placeholder {
            border: 2px dashed #cbd5e1;
            background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #eef2ff 10px, #eef2ff 20px);
            color: #475569;
            font-weight: 700;
            text-align: center;
        }
        @media (max-width: 760px) {
            .tasks { grid-template-columns: 1fr; }
        }
    </style>
</head>

        const navEl = document.getElementById('nav');
        const shellEl = document.getElementById('shell');

        function shuffle(array) {
            const copy = array.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function createTask(title, data) {
            const task = document.createElement('div');
            task.className = 'task';

            const taskTitle = document.createElement('div');
            taskTitle.className = 'task-title';
            taskTitle.textContent = title;
            task.appendChild(taskTitle);

            const answerBox = document.createElement('textarea');
            answerBox.className = 'answer-input';
            answerBox.placeholder = 'Type your answer here before using clues...';
            task.appendChild(answerBox);

            const helpRow = document.createElement('div');
            helpRow.className = 'help-row';
            const clueBtn = document.createElement('button');
            clueBtn.className = 'btn btn-clue';
            clueBtn.textContent = 'Show clue';
            const choicesBtn = document.createElement('button');
            choicesBtn.className = 'btn btn-choices';
            choicesBtn.textContent = 'Show choices';
            choicesBtn.disabled = true;
            helpRow.appendChild(clueBtn);
            helpRow.appendChild(choicesBtn);
            task.appendChild(helpRow);

            const genericClues = {
                'Category': 'Think about what type of thing it is.',
                'Function': 'What is it used for or what does it do?',
                'Attribute 1': 'Pick a word that describes how it looks or feels.',
                'Attribute 2': 'Choose another word that describes it.'
            };

            const clue = document.createElement('div');
            clue.className = 'clue';
            clue.textContent = genericClues[title] || data.clue || 'Use a clue to think it through.';
            task.appendChild(clue);

            const choicesWrap = document.createElement('div');
            choicesWrap.className = 'choices';
            task.appendChild(choicesWrap);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            task.appendChild(feedback);

            clueBtn.addEventListener('click', () => {
                clue.style.display = 'block';
                choicesBtn.disabled = false;
                clueBtn.disabled = true;
            });

            choicesBtn.addEventListener('click', () => {
                choicesWrap.innerHTML = '';
                choicesWrap.style.display = 'grid';
                feedback.style.display = 'none';
                feedback.textContent = '';
                feedback.className = 'feedback';

                const options = shuffle(data.choices);
                options.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice;
                    btn.addEventListener('click', () => {
                        const isCorrect = choice === data.answer;
                        feedback.textContent = isCorrect ? 'Correct!' : 'Try again.';
                        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                        feedback.style.display = 'block';
                        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                        if (isCorrect) {
                            choicesWrap.querySelectorAll('button').forEach(b => b.disabled = true);
                            answerBox.value = choice;
                            answerBox.focus();
                        }
                    });
                    choicesWrap.appendChild(btn);
                });
                choicesBtn.disabled = true;
            });

            return {
                task,
                getValue: () => answerBox.value.trim()
            };
        }

        function renderNav(activeWord) {
            navEl.innerHTML = '';
            words.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `${idx + 1}. ${item.word}`;
                btn.className = item.word === activeWord ? 'active' : '';
                btn.addEventListener('click', () => renderWord(item.word));
                navEl.appendChild(btn);
            });
        }

        function renderWord(target) {
            const entry = words.find(w => w.word === target) || words[0];
            renderNav(entry.word);
            shellEl.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'header';
            const title = document.createElement('h2');
            title.className = 'word';
            title.textContent = entry.word;
            header.appendChild(title);
            card.appendChild(header);

            const media = document.createElement('div');
            media.className = entry.image ? 'media' : 'media placeholder';
            if (entry.image) {
                const img = document.createElement('img');
                img.src = entry.image;
                img.alt = entry.alt || `${entry.word} image`;
                media.appendChild(img);
            } else {
                media.textContent = 'Add an image for this item';
            }
            card.appendChild(media);

            const tasks = document.createElement('div');
            tasks.className = 'tasks';
            const taskRefs = [
                createTask('Category', entry.items.category),
                createTask('Function', entry.items.function),
                createTask('Attribute 1', entry.items.attr1),
                createTask('Attribute 2', entry.items.attr2)
            ];
            taskRefs.forEach(ref => tasks.appendChild(ref.task));

            card.appendChild(tasks);

            const combineCard = document.createElement('div');
            combineCard.className = 'combine-card';
            const combineTitle = document.createElement('div');
            combineTitle.className = 'combine-title';
            combineTitle.textContent = 'Combine your answers into a definition:';
            const combineArea = document.createElement('textarea');
            combineArea.className = 'combine-area';
            combineArea.placeholder = 'Example: Snow is outside stuff. It falls on the ground. It is cold and white.';
            const combineBtn = document.createElement('button');
            combineBtn.className = 'combine-btn';
            combineBtn.textContent = 'Use my answers';
            combineBtn.addEventListener('click', () => {
                const [cat, func, attr1, attr2] = taskRefs.map(ref => ref.getValue());
                const parts = [];
                if (entry.word) {
                    parts.push(`${entry.word} is ${cat || '_____'}.`);
                }
                if (func) {
                    parts.push(`It ${func.toLowerCase().startsWith('it ') ? func.slice(3) : func}.`);
                }
                const attrs = [attr1, attr2].filter(Boolean);
                if (attrs.length) {
                    parts.push(`It is ${attrs.join(' and ')}.`);
                }
                combineArea.value = parts.join(' ');
                combineArea.focus();
            });

            combineCard.appendChild(combineTitle);
            combineCard.appendChild(combineArea);
            combineCard.appendChild(combineBtn);
            card.appendChild(combineCard);
            shellEl.appendChild(card);
        }

        renderWord(words[0].word);
    </script>
</body>
</html>
