<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Vocabulary - Context Clues</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
</head>
<body class="category-vocabulary">
  <header>
    <div class="bar">
      <h1>❄️ Winter Vocabulary - Context Clues</h1>
      <div class="progress" id="progress">Passage 1 of 10</div>
    </div>
  </header>

  <main>
    <div class="passage-card" id="passage-container">
      <!-- Content will be loaded here by JavaScript -->
    </div>

    <div class="navigation">
      <button class="btn btn-secondary" id="prev-btn" onclick="previousPassage()">
        ← Previous
      </button>
      <button class="btn btn-primary" id="next-btn" onclick="nextPassage()">
        Next →
      </button>
    </div>
  </main>

  <script>
    const passages = DataLoader.get("vocabulary", "winterVocabContextClues");

    let currentPassage = 0;

    function loadPassage(index) {
      const passage = passages[index];
      const container = document.getElementById('passage-container');
      
      // Parse the second frame part to create inline inputs
      const framePart2 = passage.frameParts[1];
      const parts = framePart2.split('____________________');
      let inlineSentence = '';
      
      for (let i = 0; i < parts.length; i++) {
        inlineSentence += parts[i];
        if (i < parts.length - 1) {
          inlineSentence += `<input type="text" class="inline-input" placeholder="...">`;
        }
      }
      
      container.innerHTML = `
        <div class="target-word">Target Word: ${passage.word}</div>
        
        <div class="passage-text">
          ${passage.text.map(line => `<p>${line}</p>`).join('')}
        </div>
        
        <div class="question-section">
          <div class="question-label">1. ${passage.questions[0]}</div>
          <input type="text" placeholder="Type your answer here...">
        </div>
        
        <div class="question-section">
          <div class="question-label">2. ${passage.questions[1]}</div>
          <input type="text" placeholder="Type your answer here...">
        </div>
        
        <div class="sentence-frame">
          <div class="sentence-frame-title">📝 Sentence Frame</div>
          <div class="frame-label">${passage.frameParts[0].replace(': ____________________', ':')}</div>
          <textarea class="frame-input" placeholder="Type your definition here..."></textarea>
          
          <div class="inline-sentence">${inlineSentence}</div>
        </div>
      `;
      
      updateProgress();
      updateNavButtons();
    }

    function updateProgress() {
      document.getElementById('progress').textContent = `Passage ${currentPassage + 1} of ${passages.length}`;
    }

    function updateNavButtons() {
      document.getElementById('prev-btn').disabled = currentPassage === 0;
      document.getElementById('next-btn').disabled = currentPassage === passages.length - 1;
    }

    function previousPassage() {
      if (currentPassage > 0) {
        currentPassage--;
        loadPassage(currentPassage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextPassage() {
      if (currentPassage < passages.length - 1) {
        currentPassage++;
        loadPassage(currentPassage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Load the first passage on page load
    loadPassage(0);
  </script>
</body>
</html>
