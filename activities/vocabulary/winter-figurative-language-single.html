<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Figurative Language - One at a Time</title>
    <script src="../../data/vocabulary.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
</head>
<body class="category-vocabulary">
    <h1>Winter Figurative Language</h1>
    <div class="intro">
        One figurative sentence at a time: read it, write your own meaning, then use supports (hint, breakdown, picture cue) before seeing choices. Feedback stays low-pressure, and you control pacing with the Next button.
    </div>
    <div class="nav-bar" id="navBar"></div>
    <div class="shell">
        <div class="shell-inner">
            <div class="progress" id="progress"></div>
            <div id="card"></div>
        </div>
    </div>

    <script>
        const items = DataLoader.get("vocabulary", "winterFigurativeLanguage");

        const progressEl = document.getElementById('progress');
        const cardEl = document.getElementById('card');
        const navBar = document.getElementById('navBar');
        let current = 0;

        function shuffle(array) {
            const copy = array.map(choice => ({ ...choice }));
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightPhrase(sentence, phrase) {
            const pattern = new RegExp(`(${escapeRegex(phrase)})`, 'i');
            return sentence.replace(pattern, '<strong>$1</strong>');
        }

        function renderNav() {
            navBar.innerHTML = '';
            items.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `${idx + 1}. ${item.phrase}`;
                btn.className = idx === current ? 'active' : '';
                btn.addEventListener('click', () => {
                    current = idx;
                    renderCard();
                });
                navBar.appendChild(btn);
            });
        }

        function renderCard() {
            const item = items[current];
            progressEl.textContent = `Item ${current + 1} of ${items.length}`;
            cardEl.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'card';

            const meta = document.createElement('div');
            meta.className = 'meta';
            const h2 = document.createElement('h2');
            h2.textContent = item.phrase;
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = item.type;
            meta.appendChild(h2);
            meta.appendChild(tag);
            card.appendChild(meta);

            const sentence = document.createElement('p');
            sentence.className = 'sentence';
            sentence.innerHTML = highlightPhrase(item.sentence, item.phrase);
            card.appendChild(sentence);

            const prompt = document.createElement('div');
            prompt.className = 'prompt';
            prompt.textContent = item.question;
            card.appendChild(prompt);

            const response = document.createElement('textarea');
            response.className = 'response';
            response.placeholder = 'Type your own meaning here first...';
            card.appendChild(response);

            const helpRow = document.createElement('div');
            helpRow.className = 'help-row';
            const hintBtn = document.createElement('button');
            hintBtn.className = 'btn btn-hint';
            hintBtn.textContent = 'Show hint';
            const supportBtn = document.createElement('button');
            supportBtn.className = 'btn btn-support';
            supportBtn.textContent = 'Show supports';
            const choicesBtn = document.createElement('button');
            choicesBtn.className = 'btn btn-choices';
            choicesBtn.textContent = 'Show choices';
            choicesBtn.disabled = true;
            helpRow.appendChild(hintBtn);
            helpRow.appendChild(supportBtn);
            helpRow.appendChild(choicesBtn);
            card.appendChild(helpRow);

            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = item.hint;
            card.appendChild(hint);

            const support = document.createElement('div');
            support.className = 'support';
            support.innerHTML = '<strong>Break it down:</strong>';
            const list = document.createElement('ul');
            list.className = 'support-list';
            item.breakdown.forEach(bit => {
                const li = document.createElement('li');
                li.textContent = bit;
                list.appendChild(li);
            });
            support.appendChild(list);
            const img = document.createElement('div');
            img.className = 'image-placeholder';
            img.textContent = 'Picture cue placeholder';
            support.appendChild(img);
            card.appendChild(support);

            const choicesWrap = document.createElement('div');
            choicesWrap.className = 'choices';
            card.appendChild(choicesWrap);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            card.appendChild(feedback);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn btn-next';
            nextBtn.textContent = current === items.length - 1 ? 'Finish' : 'Next';
            nextBtn.style.marginTop = '8px';
            nextBtn.disabled = true;
            card.appendChild(nextBtn);

            hintBtn.addEventListener('click', () => {
                hint.style.display = 'block';
                choicesBtn.disabled = false;
                hintBtn.disabled = true;
            });

            supportBtn.addEventListener('click', () => {
                support.style.display = support.style.display === 'block' ? 'none' : 'block';
            });

            choicesBtn.addEventListener('click', () => {
                choicesWrap.innerHTML = '';
                choicesWrap.style.display = 'grid';
                feedback.style.display = 'none';
                feedback.textContent = '';
                feedback.className = 'feedback';

                const shuffled = shuffle(item.choices);
                shuffled.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.addEventListener('click', () => {
                        const isCorrect = choice.correct;
                        feedback.textContent = isCorrect
                            ? 'Nice, that’s the meaning of the figurative phrase.'
                            : 'Not quite. Want a hint or want to try again?';
                        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                        feedback.style.display = 'block';
                        if (isCorrect) {
                            choicesWrap.querySelectorAll('button').forEach(b => b.disabled = true);
                            nextBtn.disabled = false;
                        }
                        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                    });
                    choicesWrap.appendChild(btn);
                });
                choicesBtn.disabled = true;
            });

            nextBtn.addEventListener('click', () => {
                if (current < items.length - 1) {
                    current += 1;
                    renderCard();
                    renderNav();
                } else {
                    progressEl.textContent = 'All done! You finished the set.';
                    cardEl.innerHTML = '';
                }
            });

            cardEl.appendChild(card);
            renderNav();
        }

        renderCard();
    </script>
</body>
</html>
