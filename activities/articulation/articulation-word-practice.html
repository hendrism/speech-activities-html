<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulation Word Practice</title>
</head>

<body class="category-articulation">
    <div class="awp-container">
        <section class="awp-card awp-header">
            <h1>Articulation Word Practice</h1>
            <p>Select a speech sound, preview the words grouped by position, then cycle through randomized word cards
                for focused practice.</p>
        </section>

        <div id="app"></div>
    </div>

    <script src="../../data/articulation.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
  <script>
        const articulationWordData = {};

        // dynamicWordSources removed in favor of data/articulation.json

        // Phoneme group structure — tiles with no categoryId are placeholders (coming soon)
        const PHONEME_GROUPS = [
            {
                label: 'Plosives',
                tiles: [
                    { label: '/p/', categoryId: null },
                    { label: '/b/', categoryId: null },
                    { label: '/t/', categoryId: null },
                    { label: '/d/', categoryId: null },
                    { label: '/k/', categoryId: 'otherSounds', preSelectBlend: 'k' },
                    { label: '/g/', categoryId: 'otherSounds', preSelectBlend: 'g' }
                ]
            },
            {
                label: 'Fricatives',
                tiles: [
                    { label: '/f/', categoryId: 'otherSounds', preSelectBlend: 'f' },
                    { label: '/v/', categoryId: null },
                    { label: '/s/', categoryId: 'sSound' },
                    { label: '/z/', categoryId: null },
                    { label: '/sh/', categoryId: 'shSound' },
                    { label: '/th/ (unvoiced)', categoryId: null },
                    { label: '/th/ (voiced)', categoryId: null },
                    { label: '/h/', categoryId: null }
                ]
            },
            {
                label: 'Affricates',
                tiles: [
                    { label: '/ch/', categoryId: null },
                    { label: '/j/', categoryId: null }
                ]
            },
            {
                label: 'Nasals',
                tiles: [
                    { label: '/m/', categoryId: null },
                    { label: '/n/', categoryId: null },
                    { label: '/ng/', categoryId: null }
                ]
            },
            {
                label: 'Liquids',
                tiles: [
                    { label: '/l/', categoryId: 'lSound' },
                    { label: '/r/ Initial', categoryId: 'initialR' },
                    { label: 'Vocalic /r/', categoryId: 'vocalicR' }
                ]
            },
            {
                label: 'Glides',
                tiles: [
                    { label: '/w/', categoryId: null },
                    { label: '/y/', categoryId: null }
                ]
            },
            {
                label: 'Blends',
                tiles: [
                    { label: 'S-Blends', categoryId: 'sBlends' },
                    { label: 'L-Blends', categoryId: 'lBlends' },
                    { label: 'R-Blends', categoryId: 'rBlends' }
                ]
            }
        ];

        const baseCategoryOrder = [
            'sBlends', 'rBlends', 'lBlends', 'initialR', 'vocalicR', 'lSound', 'sSound', 'shSound', 'otherSounds'
        ];
        const categoryOrder = [...baseCategoryOrder];

        const POS_LABELS = {
            noun: 'Noun',
            verb: 'Verb',
            adjective: 'Adjective'
        };

        const POS_EMOJI = {
            noun: '🔵',
            verb: '🟢',
            adjective: '🟣'
        };

        let state = {
            showSetup: true,
            selectedCategory: null,
            selectedBlends: [],
            deck: [],
            currentIndex: 0,
            practicedWords: [],
            history: [],
            loadingWordLists: false,
            loadErrors: []
        };

        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function formatBlendLabel(blendKey) {
            if (!blendKey) return '';
            if (blendKey.length <= 3) {
                return blendKey.toUpperCase();
            }
            return blendKey.charAt(0).toUpperCase() + blendKey.slice(1);
        }

        function normalizeWordEntry(entry) {
            if (typeof entry === 'string') {
                return { text: entry, pos: 'noun' };
            }

            if (!entry || !entry.text) {
                return null;
            }

            const allowedPos = ['noun', 'verb', 'adjective'];
            const normalizedPos = (entry.pos || 'noun').toLowerCase();
            return {
                text: entry.text,
                pos: allowedPos.includes(normalizedPos) ? normalizedPos : 'noun'
            };
        }

        // Load word data synchronously from articulation.js via DataLoader
        function buildWordData() {
            const raw = DataLoader.get('articulation');
            const categoryMap = {
                's-blends': 'sBlends',
                'r-blends': 'rBlends',
                'l-blends': 'lBlends',
                'other-sounds': 'otherSounds',
                'initial-r': 'initialR',
                'l-all-positions': 'lSound',
                's-all-positions': 'sSound',
                'sh-all-positions': 'shSound',
                'vocalic-r': 'vocalicR'
            };
            const result = {};
            (raw.soundCategories || []).forEach(cat => {
                const camelId = categoryMap[cat.id] || cat.id.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
                const blendsData = {};
                if (cat.groups) {
                    cat.groups.forEach(group => {
                        const key = group.blend || group.position;
                        if (key && group.words && group.words.length > 0) {
                            blendsData[key] = group.words.map((w, i) => ({
                                ...w,
                                id: w.id || `${key}-${i}-${w.text}`
                            }));
                        }
                    });
                }
                result[camelId] = { name: cat.name, blends: blendsData };
            });
            return result;
        }

        function populateWordData() {
            const built = buildWordData();
            Object.assign(articulationWordData, built);
            categoryOrder.length = 0;
            categoryOrder.push(...baseCategoryOrder);
            Object.keys(built).forEach(k => { if (!categoryOrder.includes(k)) categoryOrder.push(k); });
            state.loadingWordLists = false;
            state.loadErrors = [];
            if (state.selectedCategory && !articulationWordData[state.selectedCategory]) {
                state.selectedCategory = null;
                state.selectedBlends = [];
            }
            render();
        }

        function handleCategorySelect(categoryId, preSelectBlend) {
            if (!articulationWordData[categoryId]) return;

            state.selectedCategory = categoryId;
            state.selectedBlends = preSelectBlend ? [preSelectBlend] : [];
            state.deck = [];
            state.currentIndex = 0;
            state.practicedWords = [];
            state.history = [];
            render();
        }

        function handleBlendToggle(blend) {
            if (state.selectedBlends.includes(blend)) {
                state.selectedBlends = state.selectedBlends.filter((item) => item !== blend);
            } else {
                state.selectedBlends.push(blend);
            }
            render();
        }

        function handleSelectAll() {
            if (!state.selectedCategory || !articulationWordData[state.selectedCategory]) return;
            state.selectedBlends = Object.keys(articulationWordData[state.selectedCategory].blends);
            render();
        }

        function handleClearAll() {
            state.selectedBlends = [];
            render();
        }

        function getSelectedWords() {
            if (!state.selectedCategory) return [];
            const category = articulationWordData[state.selectedCategory];
            const blends = state.selectedBlends.length > 0 ? state.selectedBlends : Object.keys(category.blends);

            return blends.flatMap((blendKey) => {
                const entries = category.blends[blendKey] || [];
                return entries.map((word, index) => ({
                    ...word,
                    id: `${blendKey}-${index}-${word.text}`,
                    blend: blendKey
                }));
            });
        }

        function handleStartPractice() {
            const words = getSelectedWords();
            if (words.length === 0) return;

            state.deck = shuffleArray(words);
            state.currentIndex = 0;
            state.practicedWords = [];
            state.history = [];
            state.showSetup = false;
            render();
        }

        function handleRestart() {
            state.showSetup = true;
            state.deck = [];
            state.currentIndex = 0;
            state.practicedWords = [];
            state.history = [];
            render();
        }

        function handleNextWord() {
            if (state.deck.length === 0) return;
            const current = state.deck[state.currentIndex];
            if (current && !state.practicedWords.includes(current.id)) {
                state.practicedWords.push(current.id);
                state.history.push(current);
            }

            state.currentIndex = (state.currentIndex + 1) % state.deck.length;
            render();
        }

        function handlePrevWord() {
            if (state.deck.length === 0) return;
            state.currentIndex = (state.currentIndex - 1 + state.deck.length) % state.deck.length;
            render();
        }

        function handleShuffleRemaining() {
            const practicedSet = new Set(state.practicedWords);
            const remaining = state.deck.filter((word) => !practicedSet.has(word.id));
            const practiced = state.deck.filter((word) => practicedSet.has(word.id));
            state.deck = [...practiced, ...shuffleArray(remaining)];
            state.currentIndex = practiced.length % state.deck.length;
            render();
        }

        function renderSetup() {
            const categoryData = state.selectedCategory ? articulationWordData[state.selectedCategory] : null;

            // Build grouped phoneme tiles
            const groupedHtml = PHONEME_GROUPS.map(group => {
                const tilesHtml = group.tiles.map(tile => {
                    if (!tile.categoryId) {
                        // Placeholder — no data yet
                        return `<button type="button" class="awp-category-btn" disabled title="Coming soon" style="opacity:0.4;cursor:default;">${tile.label}</button>`;
                    }
                    const isLoaded = !!articulationWordData[tile.categoryId];
                    if (!isLoaded) {
                        return `<button type="button" class="awp-category-btn" disabled title="Loading…" style="opacity:0.4;cursor:default;">${tile.label}</button>`;
                    }
                    const isSelected = state.selectedCategory === tile.categoryId &&
                        (!tile.preSelectBlend || state.selectedBlends.includes(tile.preSelectBlend));
                    const clickArg = tile.preSelectBlend
                        ? `handleCategorySelect('${tile.categoryId}', '${tile.preSelectBlend}')`
                        : `handleCategorySelect('${tile.categoryId}')`;
                    return `<button type="button" class="awp-category-btn ${isSelected ? 'selected' : ''}" onclick="${clickArg}">${tile.label}</button>`;
                }).join('');
                return `
                    <div style="margin-bottom:12px;">
                        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--awp-muted);margin-bottom:5px;">${group.label}</div>
                        <div class="awp-category-grid">${tilesHtml}</div>
                    </div>
                `;
            }).join('');

            const blendGroupsHtml = categoryData
                ? Object.entries(categoryData.blends).map(([blendKey, entries]) => {
                    if (!Array.isArray(entries) || entries.length === 0) return '';
                    const wordsHtml = entries.map((word) => {
                        const label = POS_LABELS[word.pos] || (word.pos ? word.pos.toUpperCase() : '');
                        return `
                            <li class="awp-word-item">
                                <span>${word.text}</span>
                                ${label ? `<span class="awp-word-pos">${label}</span>` : ''}
                            </li>
                        `;
                    }).join('');
                    return `
                        <div class="awp-word-group">
                            <h3>${formatBlendLabel(blendKey)}</h3>
                            <ul class="awp-word-list">
                                ${wordsHtml}
                            </ul>
                        </div>
                    `;
                }).filter(Boolean).join('')
                : '';

            const loadingMessage = state.loadingWordLists
                ? '<p class="awp-warning">Loading word lists…</p>'
                : '';

            const errorMessage = state.loadErrors.length > 0
                ? `<p class="awp-warning">${state.loadErrors.map((err) => `⚠️ ${err}`).join('<br>')}</p>`
                : '';

            const selectedWords = getSelectedWords();
            const wordsByPos = selectedWords.reduce((acc, word) => {
                if (!acc[word.pos]) {
                    acc[word.pos] = 0;
                }
                acc[word.pos]++;
                return acc;
            }, { noun: 0, verb: 0, adjective: 0 });

            const blendCheckboxes = categoryData
                ? Object.keys(categoryData.blends).map((blend) => `
                    <label class="awp-blend-option">
                        <input
                            type="checkbox"
                            ${state.selectedBlends.includes(blend) ? 'checked' : ''}
                            onchange="handleBlendToggle('${blend}')"
                        />
                        <span>${formatBlendLabel(blend)}</span>
                    </label>
                `).join('')
                : '';

            return `
                <section class="awp-card" style="padding:20px 24px;">
                    <h2 style="font-size:1.1rem;margin-bottom:14px;">Select Target Sound</h2>
                    ${groupedHtml}
                    ${loadingMessage}
                    ${errorMessage}
                </section>

                ${categoryData ? `
                    <section class="awp-card">
                        <div class="awp-button-group" style="justify-content: space-between; flex-wrap: wrap;">
                            <h2>Select Blends or Word Positions</h2>
                            <div class="awp-button-group">
                                <button type="button" class="awp-secondary-btn" onclick="handleSelectAll()">
                                    Select All ${categoryData.name}
                                </button>
                                <button type="button" class="awp-tertiary-btn" onclick="handleClearAll()">
                                    Clear
                                </button>
                            </div>
                        </div>
                        <div class="awp-blend-list">
                            ${blendCheckboxes || '<p class="awp-warning">No word groups available.</p>'}
                        </div>
                    </section>

                    ${blendGroupsHtml ? `
                        <section class="awp-card">
                            <h2>Words in ${categoryData.name}</h2>
                            <div class="awp-word-groups">
                                ${blendGroupsHtml}
                            </div>
                        </section>
                    ` : ''}
                ` : ''}

                ${selectedWords.length > 0 ? `
                    <section class="awp-card">
                        <h2>Selected Word Summary</h2>
                        <div class="awp-word-summary">
                            <span class="awp-chip noun">🔵 Nouns: ${wordsByPos.noun}</span>
                            <span class="awp-chip verb">🟢 Verbs: ${wordsByPos.verb}</span>
                            <span class="awp-chip adjective">🟣 Adjectives: ${wordsByPos.adjective}</span>
                        </div>
                        <p style="margin: 16px 0 24px; color: var(--awp-muted);">
                            Start practice to cycle through randomized word cards. Use the shuffle option to revisit remaining targets.
                        </p>
                        <button
                            type="button"
                            class="awp-primary-btn"
                            onclick="handleStartPractice()"
                            ${selectedWords.length === 0 ? 'disabled' : ''}
                        >
                            Start Word Practice
                        </button>
                    </section>
                ` : ''}
            `;
        }

        function renderPractice() {
            if (state.deck.length === 0) {
                return `
                    <section class="awp-card">
                        <p class="awp-warning">No words available. Return to setup and select at least one group.</p>
                        <button type="button" class="awp-secondary-btn" onclick="handleRestart()">
                            Back to Setup
                        </button>
                    </section>
                `;
            }

            const currentWord = state.deck[state.currentIndex];
            const progress = `${state.currentIndex + 1} / ${state.deck.length}`;
            const practicedSet = new Set(state.practicedWords);
            const remainingCount = state.deck.filter((word) => !practicedSet.has(word.id)).length;

            return `
                <section class="awp-card">
                    <div class="awp-practice-card">
                        <div class="awp-progress">
                            Word ${progress} · Remaining: ${remainingCount}
                        </div>
                        <div class="awp-word-display">${currentWord.text}</div>
                        <div class="awp-word-meta">
                            ${POS_EMOJI[currentWord.pos] || ''} ${POS_LABELS[currentWord.pos] || 'Word'}
                            · ${formatBlendLabel(currentWord.blend)}
                        </div>
                        <div class="awp-button-group" style="justify-content:center;">
                            <button type="button" class="awp-secondary-btn" onclick="handlePrevWord()">
                                ← Previous
                            </button>
                            <button type="button" class="awp-primary-btn" onclick="handleNextWord()">
                                Next →
                            </button>
                            <button type="button" class="awp-tertiary-btn" onclick="handleShuffleRemaining()">
                                Shuffle Remaining
                            </button>
                        </div>
                        <div class="awp-button-group" style="justify-content:center;">
                            <button type="button" class="awp-tertiary-btn" onclick="handleRestart()">
                                Back to Setup
                            </button>
                        </div>
                        ${state.history.length > 0 ? `
                            <div style="text-align:left;">
                                <h3 style="margin-bottom: 12px;">Practiced Words</h3>
                                <ul class="awp-history">
                                    ${state.history.map((word) => `
                                        <li>${word.text}</li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                </section>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = state.showSetup ? renderSetup() : renderPractice();
        }

        populateWordData();
        render();
    </script>
</body>

</html>
