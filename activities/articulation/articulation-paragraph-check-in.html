<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulation Paragraph Check-In</title>
    <style>
        :root {
            --accent: #0ea5e9;
            --accent-2: #0f172a;
            --muted: #475569;
            --card: #ffffff;
            --bg: #ecfeff;
            --good: #16a34a;
            --work: #ef4444;
            --unsure: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--accent-2);
            min-height: 100vh;
            padding: 24px 16px 64px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 30px;
            letter-spacing: 0.3px;
        }

        .subhead {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }

        .btn {
            border: 2px solid var(--accent);
            background: #e0f2fe;
            color: var(--accent-2);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: var(--accent);
            color: #f8fafc;
        }

        .btn.secondary {
            border-color: #e2e8f0;
            background: #fff;
        }

        .pill {
            padding: 8px 14px;
            border-radius: 999px;
            background: #e2e8f0;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: var(--accent-2);
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
            border: 2px solid #e2e8f0;
        }

        .paragraph-title {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .paragraph-text {
            line-height: 1.7;
            color: #0f172a;
            margin: 0;
        }

        .target-word {
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .highlight-on .target-word {
            background: #fef08a;
            border-radius: 4px;
            padding: 2px 4px;
            font-weight: 800;
        }

        .pulse {
            animation: pulse 1s ease;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.6); }
            100% { box-shadow: 0 0 0 10px rgba(14, 165, 233, 0); }
        }

        .word-checks {
            margin-top: 18px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .word-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .word-label {
            font-weight: 800;
            color: var(--accent-2);
            margin: 0;
        }

        .status-row {
            display: flex;
            gap: 8px;
        }

        .status-btn {
            flex: 1;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            color: var(--accent-2);
            padding: 8px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 13px;
        }

        .status-btn:hover {
            border-color: var(--accent);
        }

        .status-btn.good.active {
            background: #dcfce7;
            border-color: var(--good);
            color: var(--accent-2);
        }

        .status-btn.work.active {
            background: #fee2e2;
            border-color: var(--work);
            color: var(--accent-2);
        }

        .status-btn.unsure.active {
            background: #fef9c3;
            border-color: var(--unsure);
            color: var(--accent-2);
        }

        .progress-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .mini {
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .status-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Articulation Paragraph Check-In</h1>
            <p class="subhead">Read one paragraph at a time, toggle target highlights, then self-rate each target word.</p>
        </header>

        <div class="controls">
            <div class="progress-row">
                <span class="pill" id="progress">1 / 10</span>
                <span class="mini" id="ratedCount"></span>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn secondary" id="toggleHighlight" type="button">Show target highlights</button>
                <button class="btn secondary" id="toggleCheck" type="button">Show self-check</button>
                <button class="btn secondary" id="prevBtn" type="button">Previous</button>
                <button class="btn" id="nextBtn" type="button">Next</button>
            </div>
        </div>

        <div class="card" id="paragraphCard">
            <h3 class="paragraph-title" id="paragraphTitle"></h3>
            <p class="paragraph-text" id="paragraphText"></p>
        </div>

        <div class="card" id="checkSection" style="display:none; margin-top:12px;">
            <h4 style="margin:0 0 8px;">Self-check each target word</h4>
            <p class="mini" style="margin:0 0 10px;">Tap a word below and pick Good / Unsure / Needs work. Use “Locate” to see it in the paragraph.</p>
            <div class="word-checks" id="wordChecks"></div>
        </div>
    </div>

    <script>
        const passages = [
            {
                title: "1) After the Rain",
                text: "After the rain, a rainbow appeared in the sky. A rabbit ran along the road near the river. The grass looked green and fresh. A small rock sat by the water. The rabbit stopped to rest for a moment. Everything felt real and calm. The day was ready for play. The air felt cool and quiet.",
                words: ["rain", "rainbow", "rabbit", "road", "river", "grass", "rock", "rest", "real", "ready"]
            },
            {
                title: "2) Morning at the Ranch",
                text: "A loud rooster crowed at the ranch early in the morning. A farmer grabbed a rake and cleaned the ground. He used a rope to tie a gate. The red barn stood by the road. The farmer felt proud of his work. He took time to rest before lunch. The day started just right. The animals stayed calm.",
                words: ["rooster", "ranch", "rake", "ground", "rope", "red", "proud", "rest", "right"]
            },
            {
                title: "3) Lunch at the Restaurant",
                text: "My friend and I went to a restaurant for lunch. We ordered rice, bread, and fries. I also ate some fruit. The food smelled fresh and warm. We talked and laughed at the table. A friendly server brought our drinks. We took time to relax and rest. Lunch was simple and fun.",
                words: ["friend", "restaurant", "rice", "bread", "fries", "fruit", "fresh", "friendly", "rest"]
            },
            {
                title: "4) Frog by the River",
                text: "A green frog sat on a round rock by the river. The frog did not rush away. It began to crawl toward the water. A crab moved near the sand. The frog stayed still and quiet. The water made a soft sound. The place felt safe and calm. The frog liked to frolic there.",
                words: ["frog", "rock", "river", "rush", "crawl", "crab", "frolic"]
            },
            {
                title: "5) Robot on the Ramp",
                text: "The robot rolled up a ramp at the park. It did not crash or fall. A kid used a ruler to measure the ramp. The robot was ready to race again. A truck passed on the nearby road. The robot waited for the signal. The race would start soon. Everyone felt excited.",
                words: ["robot", "ramp", "crash", "ruler", "ready", "race", "truck"]
            },
            {
                title: "6) Frosty Morning",
                text: "Cold frost covered the grass and the tree branches. The ground felt hard under our shoes. Some grapes hung from a vine. The grapes looked frozen. The air felt frosty and still. We wore warm coats. Our breath made clouds. Winter had arrived.",
                words: ["frost", "grass", "tree", "ground", "grapes", "frozen", "frosty"]
            },
            {
                title: "7) At the Crossing",
                text: "A train slowed near the track. A truck waited by the crossing. Some trash blew across the road. Workers tried to grab it quickly. They wore bright vests. One worker slipped but did not trip. Everyone stayed safe. The area looked clean again.",
                words: ["train", "track", "truck", "trash", "grab", "bright", "trip"]
            },
            {
                title: "8) Creative Colors",
                text: "A crafty kid used a crayon to draw a picture. The picture showed a crown and a dragon. The dragon had green wings. The lines looked neat and clear. The picture went into a frame. The kid smiled with pride. The colors looked great. The artwork stayed on the wall.",
                words: ["crafty", "crayon", "draw", "crown", "dragon", "green", "frame", "great"]
            },
            {
                title: "9) The Practice Speech",
                text: "The prince wore a royal ring. He practiced a speech for the crowd. He wanted to win a prize. The people felt proud of him. He stood tall and calm. The day felt important. The moment felt real. The crowd clapped loudly.",
                words: ["prince", "royal", "ring", "prize", "proud", "real"]
            },
            {
                title: "10) The Dragon Dream",
                text: "That night, I had a strange dream. A loud drum began to sound. A dragon rose from the river. The dragon did not hurt anyone. It made a slow turn in the air. The sound began to fade. I woke up in my bed. The dream felt real.",
                words: ["dream", "drum", "dragon", "river", "real"]
            }
        ];

        let current = 0;
        let highlightOn = false;
        let checkVisible = false;
        const ratings = passages.map(p => p.words.map(() => null));

        const titleEl = document.getElementById("paragraphTitle");
        const textEl = document.getElementById("paragraphText");
        const checksEl = document.getElementById("wordChecks");
        const progressEl = document.getElementById("progress");
        const ratedCountEl = document.getElementById("ratedCount");
        const highlightBtn = document.getElementById("toggleHighlight");
        const checkBtn = document.getElementById("toggleCheck");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const checkSection = document.getElementById("checkSection");

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightText(text, words) {
            let result = text;
            words.forEach(word => {
                const re = new RegExp(`\\b(${escapeRegExp(word)})\\b`, "gi");
                result = result.replace(re, `<span class="target-word" data-word="${word}">$1</span>`);
            });
            return result;
        }

        function setRating(wordIndex, value) {
            ratings[current][wordIndex] = value;
            renderWordChecks();
            updateProgress();
        }

        function renderWordChecks() {
            const { words } = passages[current];
            checksEl.innerHTML = words.map((word, idx) => {
                const state = ratings[current][idx];
                return `
                    <div class="word-card">
                        <p class="word-label">${word}</p>
                        <div class="status-row">
                            <button class="status-btn good ${state === "good" ? "active" : ""}" data-word="${idx}" data-val="good">Good</button>
                            <button class="status-btn unsure ${state === "unsure" ? "active" : ""}" data-word="${idx}" data-val="unsure">Unsure</button>
                            <button class="status-btn work ${state === "work" ? "active" : ""}" data-word="${idx}" data-val="work">Needs work</button>
                        </div>
                        <button class="btn secondary locate-btn" data-word="${idx}" type="button" style="width:100%; text-align:center;">Locate in paragraph</button>
                    </div>
                `;
            }).join("");

            checksEl.querySelectorAll(".status-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const wordIndex = parseInt(btn.dataset.word, 10);
                    const value = btn.dataset.val;
                    setRating(wordIndex, value);
                });
            });

            checksEl.querySelectorAll(".locate-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const wordIndex = parseInt(btn.dataset.word, 10);
                    const word = passages[current].words[wordIndex];
                    pulseWord(word);
                });
            });
        }

        function updateProgress() {
            progressEl.textContent = `${current + 1} / ${passages.length}`;
            const rated = ratings[current].filter(Boolean).length;
            ratedCountEl.textContent = `${rated} of ${passages[current].words.length} words rated`;
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === passages.length - 1;
        }

        function render() {
            const passage = passages[current];
            titleEl.textContent = passage.title;
            textEl.innerHTML = highlightText(passage.text, passage.words);
            renderWordChecks();
            updateProgress();
            document.body.classList.toggle("highlight-on", highlightOn);
            checkSection.style.display = checkVisible ? "block" : "none";
            checkBtn.textContent = checkVisible ? "Hide self-check" : "Show self-check";
        }

        highlightBtn.addEventListener("click", () => {
            highlightOn = !highlightOn;
            highlightBtn.textContent = highlightOn ? "Hide target highlights" : "Show target highlights";
            render();
        });

        checkBtn.addEventListener("click", () => {
            checkVisible = !checkVisible;
            render();
        });

        prevBtn.addEventListener("click", () => {
            if (current > 0) {
                current -= 1;
                render();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (current < passages.length - 1) {
                current += 1;
                render();
            }
        });

        function pulseWord(word) {
            const spans = textEl.querySelectorAll(`.target-word[data-word="${word}"]`);
            spans.forEach(span => {
                span.classList.remove("pulse");
                void span.offsetWidth;
                span.classList.add("pulse");
            });
        }

        render();
    </script>
</body>
</html>
