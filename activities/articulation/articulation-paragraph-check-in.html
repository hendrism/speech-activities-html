<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulation Paragraph Check-In</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="category-articulation">
    <div class="container">
        <header>
            <h1>Articulation Paragraph Check-In</h1>
            <p class="subhead">Read one paragraph at a time, toggle target highlights, then self-rate each target word.</p>
        </header>

        <div class="controls">
            <div class="progress-row">
                <span class="pill" id="progress">1 / 10</span>
                <span class="mini" id="ratedCount"></span>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn secondary" id="toggleHighlight" type="button">Show target highlights</button>
                <button class="btn secondary" id="toggleCheck" type="button">Show self-check</button>
                <button class="btn secondary" id="prevBtn" type="button">Previous</button>
                <button class="btn" id="nextBtn" type="button">Next</button>
            </div>
        </div>

        <div class="card" id="paragraphCard">
            <h3 class="paragraph-title" id="paragraphTitle"></h3>
            <p class="paragraph-text" id="paragraphText"></p>
        </div>

        <div class="card" id="checkSection" style="display:none; margin-top:12px;">
            <h4 style="margin:0 0 8px;">Self-check each target word</h4>
            <p class="mini" style="margin:0 0 10px;">Tap a word below and pick Good / Unsure / Needs work. Use “Locate” to see it in the paragraph.</p>
            <div class="word-checks" id="wordChecks"></div>
        </div>
    </div>

    <script src="../../data/articulation.js"></script>
    <script src="../../js/data-loader.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        const passages = DataLoader.get('articulation', 'paragraphPassages');

        let current = 0;
        let highlightOn = false;
        let checkVisible = false;
        const ratings = passages.map(p => p.words.map(() => null));

        const titleEl = document.getElementById("paragraphTitle");
        const textEl = document.getElementById("paragraphText");
        const checksEl = document.getElementById("wordChecks");
        const progressEl = document.getElementById("progress");
        const ratedCountEl = document.getElementById("ratedCount");
        const highlightBtn = document.getElementById("toggleHighlight");
        const checkBtn = document.getElementById("toggleCheck");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const checkSection = document.getElementById("checkSection");

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightText(text, words) {
            let result = text;
            words.forEach(word => {
                const re = new RegExp(`\\b(${escapeRegExp(word)})\\b`, "gi");
                result = result.replace(re, `<span class="target-word" data-word="${word}">$1</span>`);
            });
            return result;
        }

        function setRating(wordIndex, value) {
            ratings[current][wordIndex] = value;
            renderWordChecks();
            updateProgress();
        }

        function renderWordChecks() {
            const { words } = passages[current];
            checksEl.innerHTML = words.map((word, idx) => {
                const state = ratings[current][idx];
                return `
                    <div class="word-card">
                        <p class="word-label">${word}</p>
                        <div class="status-row">
                            <button class="status-btn good ${state === "good" ? "active" : ""}" data-word="${idx}" data-val="good">Good</button>
                            <button class="status-btn unsure ${state === "unsure" ? "active" : ""}" data-word="${idx}" data-val="unsure">Unsure</button>
                            <button class="status-btn work ${state === "work" ? "active" : ""}" data-word="${idx}" data-val="work">Needs work</button>
                        </div>
                        <button class="btn secondary locate-btn" data-word="${idx}" type="button" style="width:100%; text-align:center;">Locate in paragraph</button>
                    </div>
                `;
            }).join("");

            checksEl.querySelectorAll(".status-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const wordIndex = parseInt(btn.dataset.word, 10);
                    const value = btn.dataset.val;
                    setRating(wordIndex, value);
                });
            });

            checksEl.querySelectorAll(".locate-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const wordIndex = parseInt(btn.dataset.word, 10);
                    const word = passages[current].words[wordIndex];
                    pulseWord(word);
                });
            });
        }

        function updateProgress() {
            progressEl.textContent = `${current + 1} / ${passages.length}`;
            const rated = ratings[current].filter(Boolean).length;
            ratedCountEl.textContent = `${rated} of ${passages[current].words.length} words rated`;
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === passages.length - 1;
        }

        function render() {
            const passage = passages[current];
            titleEl.textContent = passage.title;
            textEl.innerHTML = highlightText(passage.text, passage.words);
            renderWordChecks();
            updateProgress();
            document.body.classList.toggle("highlight-on", highlightOn);
            checkSection.style.display = checkVisible ? "block" : "none";
            checkBtn.textContent = checkVisible ? "Hide self-check" : "Show self-check";
        }

        highlightBtn.addEventListener("click", () => {
            highlightOn = !highlightOn;
            highlightBtn.textContent = highlightOn ? "Hide target highlights" : "Show target highlights";
            render();
        });

        checkBtn.addEventListener("click", () => {
            checkVisible = !checkVisible;
            render();
        });

        prevBtn.addEventListener("click", () => {
            if (current > 0) {
                current -= 1;
                render();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (current < passages.length - 1) {
                current += 1;
                render();
            }
        });

        function pulseWord(word) {
            const spans = textEl.querySelectorAll(`.target-word[data-word="${word}"]`);
            spans.forEach(span => {
                span.classList.remove("pulse");
                void span.offsetWidth;
                span.classList.add("pulse");
            });
        }

        render();
    </script>
</body>
</html>
