<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plural Noun Fill-In Stories</title>
    <script src="../../data/grammar.js"></script>
    <script src="../../js/data-loader.js"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #6366f1;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
        }

        .sidebar-title {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .sidebar-subtitle {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .nav-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background: #f1f5f9;
        }

        .nav-item.active {
            background: #e0f2fe;
            color: var(--primary-dark);
            border-color: #bae6fd;
            font-weight: 600;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 32px;
            gap: 24px;
        }

        .content-container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .story-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .story-title {
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            font-weight: 800;
        }

        .story-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-main);
        }

        .story-text p {
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 40px 0 20px;
            color: var(--secondary);
            font-weight: 700;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        /* Question Card & Interactions */
        .question-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .question-card:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .input-area {
            margin-bottom: 16px;
        }

        .text-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 45px;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .action-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #f1f5f9;
            color: var(--primary);
            border-color: var(--primary);
        }

        .action-btn.active {
            background: #e0f2fe;
            color: var(--primary-dark);
            border-color: #bae6fd;
        }

        .collapsible-content {
            display: none;
            margin-top: 12px;
            animation: fadeIn 0.3s ease;
        }

        .collapsible-content.visible {
            display: block;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            text-align: left;
            padding: 12px 16px;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: #166534;
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: #fee2e2;
            color: #991b1b;
        }

        .hint-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 12px;
            color: #92400e;
            font-style: italic;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-blank {
            display: inline-block;
            min-width: 60px;
            border-bottom: 2px solid var(--primary);
            color: var(--primary-dark);
            font-weight: 700;
            padding: 0 4px;
            transition: all 0.2s;
        }

        .story-blank.filled {
            background-color: #e0f2fe;
            border-bottom-color: transparent;
            border-radius: 4px;
        }

        @media (max-width: 900px) {
            .sidebar {
                display: none;
            }

            .main {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Plural Nouns</h1>
            <p class="sidebar-subtitle">Fill-In Stories</p>
            <a href="../../index.html"
                style="display: block; margin-top: 10px; font-size: 0.9rem; color: var(--primary); text-decoration: none;">←
                Back to Hub</a>
        </div>
        <div class="nav-list" id="navList">
            <!-- Nav items generated here -->
        </div>
    </div>

    <main class="main" id="mainContent">
        <!-- Content injected here -->
    </main>

    <script>
        const stories = DataLoader.filter('grammar', 'items', function(s) { return s.sourceFile === 'activities/grammar/plural-noun-stories.html'; });

        let currentStory = stories[0];
        const navList = document.getElementById('navList');
        const mainContent = document.getElementById('mainContent');

        function init() {
            renderNav();
            loadStory(stories[0].id);
        }

        function renderNav() {
            navList.innerHTML = '';
            stories.forEach(story => {
                const item = document.createElement('div');
                item.className = `nav-item ${story.id === currentStory.id ? 'active' : ''}`;
                item.onclick = () => loadStory(story.id);
                item.innerHTML = `
                    <span>Story ${story.id}</span>
                `;
                navList.appendChild(item);
            });
        }

        function loadStory(id) {
            currentStory = stories.find(s => s.id === id);
            renderNav();
            renderContent();
            // Scroll to top
            document.querySelector('.main').scrollTop = 0;
        }

        function renderContent() {
            // 1. Prepare Story HTML with Spans
            // We need to replace the placeholders "________ (word)" with spans
            let storyHtml = currentStory.text;

            // We'll iterate through items to replace them in order.
            // Assumption: The order of items in 'items' array matches the order of appearance in text.
            // The text format is "________ (word)". Regex: /________ \(([^)]+)\)/g
            // But to ensure we match specific items to specific blanks, we iterate.

            // Ideally, we split by the placeholder regex.
            let parts = storyHtml.split(/________ \([^)]+\)/);
            // parts will be [ "Start text ", " middle text ", " end text." ]
            // interspersed with the blanks.

            let finalStoryHtml = '';
            parts.forEach((part, index) => {
                finalStoryHtml += part;
                if (index < currentStory.items.length) {
                    // Add the blank span
                    finalStoryHtml += `<span id="story-blank-${index}" class="story-blank">________</span>`;
                }
            });

            // 2. Generate Exercises interactions
            const exercisesHtml = currentStory.items.map((item, index) => {
                const uniqueId = `item_${index}`;
                return `
                <div class="question-card">
                    <div class="question-text">${index + 1}. ${item.label}</div>
                    
                    <div class="input-area">
                        <textarea class="text-input" 
                            placeholder="Type the plural form here..." 
                            oninput="updateStoryText(${index}, this.value)"
                        ></textarea>
                    </div>

                    <div class="action-bar">
                        <button class="action-btn" onclick="toggleSection('${uniqueId}_hint', this)">
                            <span>💡</span> I need help
                        </button>
                        <button class="action-btn" onclick="toggleSection('${uniqueId}_choices', this)">
                             <span>📋</span> Choices
                        </button>
                    </div>

                    <div id="${uniqueId}_hint" class="collapsible-content">
                        <div class="hint-box">
                            <span>💡</span> ${item.hint}
                        </div>
                    </div>

                    <div id="${uniqueId}_choices" class="collapsible-content">
                        <div class="options-grid">
                            ${item.options.map((opt, i) => `
                                <button class="option-btn" onclick="checkAnswer(this, ${i}, ${item.answer}, ${index}, '${opt}')">
                                    ${['A', 'B', 'C', 'D'][i]}) ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            mainContent.innerHTML = `
                <div class="content-container">
                    <div class="story-card">
                        <h1 class="story-title">${currentStory.title}</h1>
                        <div class="story-text">
                            ${finalStoryHtml}
                        </div>
                    </div>

                    <div class="section-title">Fill in the Blanks</div>
                    ${exercisesHtml}
                    
                    <div style="height: 50px;"></div>
                </div>
            `;
        }

        function updateStoryText(index, value) {
            const span = document.getElementById(`story-blank-${index}`);
            if (span) {
                if (value.trim() === '') {
                    span.textContent = '________';
                    span.classList.remove('filled');
                } else {
                    span.textContent = value;
                    span.classList.add('filled');
                }
            }
        }

        function toggleSection(id, btn) {
            const el = document.getElementById(id);
            el.classList.toggle('visible');
            btn.classList.toggle('active');
        }

        function checkAnswer(btn, selectedIndex, correctIndex, itemIndex, textValue) {
            // Reset siblings
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.classList.remove('correct', 'incorrect');
                b.disabled = false;
            });

            if (selectedIndex === correctIndex) {
                btn.classList.add('correct');
                // Also auto-fill the text box and story?
                // Yes, that's often helpful.
                const textArea = document.querySelectorAll('.text-input')[itemIndex];
                if (textArea) {
                    textArea.value = textValue;
                    updateStoryText(itemIndex, textValue);
                }
            } else {
                btn.classList.add('incorrect');
            }
        }

        // Initialize
        init();

    </script>
</body>

</html>
