<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Subject-Action-Object Builder</title>
  <script src="../../data/grammar.js"></script>
  <script src="../../js/data-loader.js"></script>
</head>
<body class="category-grammar">
    <h1>Winter Subject-Action-Object Builder</h1>
    <div class="intro">
        Pick any winter scene image (from both story sets), then build a clear subject-action-object sentence. Fill in WHO, DOING WHAT, and WHERE/WITH WHAT to make a complete thought. Use the quick chips to spark ideas, and read the bold sentence to check for clarity.
    </div>

    <div class="nav" id="nav"></div>

    <div class="shell">
        <div class="top">
            <div class="image-wrap">
                <p class="title" id="sceneTitle"></p>
                <img id="sceneImage" src="" alt="">
                <div class="sentence-box" id="sentenceBox"></div>
            </div>
            <div class="inputs">
                <div class="input-row">
                    <label for="whoInput">Who?</label>
                    <input id="whoInput" class="big-input" type="text">
                    <button class="toggle-btn" type="button" data-target="who">Show ideas</button>
                    <div class="helpers" data-target="who"></div>
                </div>
                <div class="input-row">
                    <label for="actionInput">Doing what?</label>
                    <input id="actionInput" class="big-input" type="text">
                    <button class="toggle-btn" type="button" data-target="action">Show ideas</button>
                    <div class="helpers" data-target="action"></div>
                </div>
                <div class="input-row">
                    <label for="detailInput">Where/with what?</label>
                    <input id="detailInput" class="big-input" type="text">
                    <button class="toggle-btn" type="button" data-target="detail">Show ideas</button>
                    <div class="helpers" data-target="detail"></div>
                </div>
                <div class="controls">
                    <button class="btn btn-secondary" id="clearBtn" type="button">Clear sentence</button>
                    <button class="btn btn-primary" id="shuffleBtn" type="button">Shuffle ideas</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scenes = DataLoader.get('grammar', 'winterSAOScenes');

        const chipBank = DataLoader.get('grammar', 'winterSAOChips');

        const navEl = document.getElementById('nav');
        const sceneTitle = document.getElementById('sceneTitle');
        const sceneImage = document.getElementById('sceneImage');
        const whoInput = document.getElementById('whoInput');
        const actionInput = document.getElementById('actionInput');
        const detailInput = document.getElementById('detailInput');
        const sentenceBox = document.getElementById('sentenceBox');
        const clearBtn = document.getElementById('clearBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');

        let current = 0;
        const drafts = scenes.map(() => ({ who: '', action: '', detail: '' }));

        function renderNav() {
            navEl.innerHTML = scenes.map((scene, idx) => `
                <button data-idx="${idx}" class="${idx === current ? 'active' : ''}">${idx + 1}. ${scene.title}</button>
            `).join('');
            navEl.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    current = parseInt(btn.dataset.idx, 10);
                    renderScene();
                    navEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        function renderScene() {
            const scene = scenes[current];
            const draft = drafts[current];
            sceneTitle.textContent = scene.title;
            sceneImage.src = scene.image;
            sceneImage.alt = scene.alt || scene.title;
            whoInput.value = draft.who;
            actionInput.value = draft.action;
            detailInput.value = draft.detail;
            updateSentence();
        }

        function updateSentence() {
            const draft = drafts[current];
            drafts[current] = {
                who: whoInput.value.trim(),
                action: actionInput.value.trim(),
                detail: detailInput.value.trim()
            };
            const who = drafts[current].who || '____';
            const action = drafts[current].action || '____';
            const detail = drafts[current].detail ? ` ${drafts[current].detail}` : ' ____';
            sentenceBox.textContent = `${who} ${action}${detail}`.trim().replace(/\s+/g, ' ');
        }

        function populateChips() {
            document.querySelectorAll('.helpers').forEach(helper => {
                const target = helper.dataset.target;
                helper.innerHTML = chipBank[target].map(text => `<button class="chip" data-target="${target}">${text}</button>`).join('');
                helper.classList.add('hidden');
                helper.querySelectorAll('.chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const field = chip.dataset.target;
                        const value = chip.textContent;
                        if (field === 'who') {
                            whoInput.value = value;
                        } else if (field === 'action') {
                            actionInput.value = value;
                        } else {
                            detailInput.value = value;
                        }
                        updateSentence();
                    });
                });
            });
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                const target = btn.dataset.target;
                const helper = document.querySelector(`.helpers[data-target="${target}"]`);
                btn.addEventListener('click', () => {
                    if (!helper) return;
                    helper.classList.toggle('hidden');
                    btn.textContent = helper.classList.contains('hidden') ? 'Show ideas' : 'Hide ideas';
                });
            });
        }

        function shuffleIdeas() {
            whoInput.value = pickRandom(chipBank.who);
            actionInput.value = pickRandom(chipBank.action);
            detailInput.value = pickRandom(chipBank.detail);
            updateSentence();
        }

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        whoInput.addEventListener('input', updateSentence);
        actionInput.addEventListener('input', updateSentence);
        detailInput.addEventListener('input', updateSentence);
        clearBtn.addEventListener('click', () => {
            whoInput.value = '';
            actionInput.value = '';
            detailInput.value = '';
            updateSentence();
        });
        shuffleBtn.addEventListener('click', shuffleIdeas);

        populateChips();
        renderNav();
        renderScene();
    </script>
</body>
</html>
