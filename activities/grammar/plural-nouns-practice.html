<!DOCTYPE html>

Activity: Plural Nouns Practice
Description: Form regular and irregular plural nouns with scaffolds.
Tags: Plurals, Grammar, Nouns
-->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plural Nouns Practice - Fill in the Blanks</title>
    <script src="../../data/grammar.js"></script>
    <script src="../../js/data-loader.js"></script>
<style>
  :root {
    --w: 1000px;
    --accent: #7c3aed;
    --bg: #faf8ff;
    --ink: #1e1b4b;
    --ok: #16a34a;
    --err: #dc2626;
    --warning: #ea580c;
    --blue: #2563eb;
    --purple: #8b5cf6;
    --gray: #64748b;
  }
  
  * { box-sizing: border-box; }
  
  body { 
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; 
    background: var(--bg); 
    color: var(--ink); 
    margin: 0; 
    line-height: 1.6;
    font-size: 18px;
  }
  
  header { 
    background: white; 
    border-bottom: 3px solid #e2e8f0; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  
  .bar { 
    max-width: var(--w); 
    margin: 0 auto; 
    padding: 20px; 
    display: grid; 
    grid-template-columns: 1fr auto auto; 
    gap: 20px;

  .bar h1 { 
    font-size: 24px; 
    margin: 0; 
    color: var(--accent);
    font-weight: 700;
  }
  
  .controls { 
    display: flex; 
    gap: 12px; 
    align-items: center; 
  }
  
  .progress-info {
    font-weight: 600;
    color: var(--purple);
    font-size: 16px;
  }
  
  main { 
    max-width: var(--w); 
    margin: 30px auto; 
    padding: 0 20px; 
  }
  
  .noun-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .mode-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-bottom: 25px;
  }
  
  .mode-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  
  .mode-label {
    font-weight: 700;
    color: var(--purple);
  }
  
  .mode-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    font-size: 14px;
    font-weight: 600;

  }
  
  .mode-btn:hover {

  }

  .noun-btn {
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;

  }
  
  .noun-btn.active {
    background: var(--accent);

    border-color: var(--accent);
  }
  
  .practice-container {
    background: white;
    border: 3px solid #e2e8f0;

  .noun-header {

  .sentence-label {

    color: #1d4ed8;

  .blank-input {

    border: 3px solid #ea580c;

  .blank-input:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
  }

    background: #f0fdf4;

  .blank-input.incorrect {
    border-color: var(--err);
    background: #fef2f2;

  }
  
  .image-placeholder {
    width: 120px;

    border: 3px dashed #cbd5e1;
    border-radius: 12px;

    justify-content: center;
    margin: 20px auto;
    background: #f8fafc;

    text-align: center;
    font-style: italic;
  }
  
  .support-section {
    text-align: center;
    margin-top: 30px;
  }
  
  .hint-btn {
    background: var(--warning);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin: 0 8px;
  }
  
  .hint-btn:hover {
    background: #c2410c;
    transform: translateY(-2px);
  }
  
  .hint-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;

  }
  
  .hint-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  
  .hint-message {
    display: none;
    margin: 10px auto 20px;
    max-width: 520px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #ea580c;
    background: #fff7ed;
    color: #c2410c;
    font-weight: 600;
    text-align: center;
  }
  
  .hint-message.show {
    display: block;

  .multiple-choice {

    margin-top: 25px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  
  .multiple-choice.show {
    display: block;
    animation: slideDown 0.4s ease;

  .choice-option {
    background: white;
    border: 3px solid #e5e7eb;
    border-radius: 12px;

    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
  }
  
  .choice-option:hover {
    border-color: var(--purple);
    background: #faf5ff;
    transform: translateY(-2px);
  }
  
  .choice-option.selected {
    border-color: var(--accent);
    background: #ede9fe;
  }
  
  .choice-option.correct {
    border-color: var(--ok);
    background: #f0fdf4;
    color: var(--ok);
  }
  
  .choice-option.incorrect {
    border-color: var(--err);
    background: #fef2f2;
    color: var(--err);
  }
  
  .check-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 25px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 20px;
  }
  
  .check-btn:hover {
    background: #6d28d9;
    transform: translateY(-2px);
  }
  
  .feedback {
    background: #f8fafc;
    border: 3px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
    display: none;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
  }
  
  .feedback.show {
    display: block;
    animation: fadeIn 0.3s ease;
  }
  
  .feedback.success {
    background: #f0fdf4;
    border-color: var(--ok);
    color: #065f46;
  }
  
  .feedback.error {
    background: #fef2f2;
    border-color: var(--err);
    color: #991b1b;
  }
  
  .navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    gap: 20px;
  }
  
  .nav-btn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .nav-btn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
  }
  
  .nav-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
    transform: none;
  }
  
  button:not(.mode-btn) {
    border: 3px solid #cbd5e1;
    background: #f8fafc;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  
  button:not(.mode-btn):hover {
    background: #e2e8f0;
    border-color: #94a3b8;
  }
  
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  
  button.primary:hover {
    background: #6d28d9;
  }
  
  button.success {
    background: var(--ok);
    color: white;
    border-color: var(--ok);
  }
  
  button.warning {
    background: var(--warning);
    color: white;

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }

  @keyframes fadeIn {
    from { opacity: 0; }

  }
  
  @media (max-width: 768px) {
    .bar {
      grid-template-columns: 1fr;
      gap: 15px;
      text-align: center;
    }
    
    .controls {
      justify-content: center;
    }
    
    .sentence-text {
      font-size: 20px;
    }
    
    .blank-input {
      font-size: 20px;
      min-width: 100px;
    }
    
    .navigation {
      flex-direction: column;
      align-items: center;
    }

      gap: 6px;

      padding: 8px 12px;

<body>
  <header>
    <div class="bar">
      <h1>📝 Plural Nouns Practice</h1>
      <div class="progress-info" id="progressInfo">Item 1 of 25</div>
      <div class="controls">
        <button id="addImageBtn" class="primary">📷 Add Image</button>
        <button id="resetItem" class="warning">🔄 Reset</button>
        <button id="nextItem" class="success" style="display:none;">Next Item →</button>
      </div>
    </div>
  </header>

  <main>
    <div class="mode-controls" id="modeControls">
      <div class="mode-group">
        <span class="mode-label">Practice:</span>
        <button class="mode-btn active" data-mode="all">All Nouns</button>
        <button class="mode-btn" data-mode="regular">Regular Only</button>
        <button class="mode-btn" data-mode="irregular">Irregular Only</button>
      </div>
      <div class="mode-group">
        <span class="mode-label">Jump To:</span>
        <button class="mode-btn" data-random="all">🎲 Any</button>
        <button class="mode-btn" data-random="regular">🎲 Regular</button>
        <button class="mode-btn" data-random="irregular">🎲 Irregular</button>
      </div>
    </div>
    
    <div class="noun-selector" id="nounSelector">
      <!-- Noun buttons will be generated -->
    </div>

    <div class="practice-container">
      <div class="noun-header">
        <h2 class="noun-title" id="nounTitle">Mouse</h2>
      </div>

      <div class="sentence-pair">
        <!-- Image area (hidden by default) -->
        <div class="image-placeholder" id="imagePlaceholder" style="display: none;">
          [Add picture here]<br>
          <small>Click to upload image</small>
        </div>

        <!-- Singular sentence -->
        <div class="sentence-container">
          <div class="sentence-label">Singular (One)</div>
          <p class="sentence-text" id="singularSentence">
            I saw one <span class="singular-noun">mouse</span> in the kitchen.
          </p>
        </div>

        <!-- Plural sentence with blank -->
        <div class="sentence-container">
          <div class="sentence-label">Plural (Many)</div>
          <p class="sentence-text" id="pluralSentence">
            I saw lots of <input type="text" class="blank-input" id="pluralInput" placeholder="?"> in the kitchen.
          </p>
        </div>
      </div>

      <div class="support-section">
        <div class="hint-buttons">
          <button class="hint-btn" id="showHintBtn">💡 I Need Help</button>
          <button class="hint-btn" id="moreHelpBtn" disabled>✨ I Need More Help</button>
        </div>
        <div class="hint-message" id="hintMessage"></div>
        <button class="check-btn" id="checkAnswerBtn">✓ Check My Answer</button>
        
        <div class="multiple-choice" id="multipleChoice">
          <h3 style="color: var(--purple); margin-bottom: 20px;">Choose the correct plural form:</h3>
          <div id="choiceOptions">
            <!-- Multiple choice options will be populated -->
          </div>
          <button class="check-btn" id="checkChoiceBtn">Check My Choice</button>
        </div>

        <div class="feedback" id="feedback">
          <p id="feedbackText"></p>
        </div>
      </div>

      <div class="navigation">
        <button class="nav-btn" id="prevBtn">⬅ Previous</button>
        <button class="nav-btn" id="nextBtn">Next ➡</button>
      </div>
    </div>
  </main>

  <!-- Hidden file input for image upload -->
  <input type="file" id="imageInput" accept="image/*" style="display: none;">

<script>
const nounData = DataLoader.filter('grammar', 'items', function(s) { return s.sourceFile === 'activities/grammar/plural-nouns-practice.html'; });

let currentItem = 0;
let currentListIndex = 0;
let selectedChoice = null;
let activeIndices = [];
let currentMode = 'all';
let hintStage = 0;

function setPracticeMode(mode, options = {}) {
  currentMode = mode;
  
  if (mode === 'regular') {
    activeIndices = nounData
      .map((noun, index) => ({ noun, index }))
      .filter(item => item.noun.type === 'Regular')
      .map(item => item.index);
  } else if (mode === 'irregular') {
    activeIndices = nounData
      .map((noun, index) => ({ noun, index }))
      .filter(item => item.noun.type === 'Irregular')
      .map(item => item.index);
  } else {
    activeIndices = nounData.map((_, index) => index);
  }
  
  if (activeIndices.length === 0) {
    document.getElementById('nounSelector').innerHTML = '';
    document.getElementById('nounTitle').textContent = 'No nouns available';
    document.getElementById('singularSentence').innerHTML = '';
    document.getElementById('pluralSentence').innerHTML = '';
    document.getElementById('progressInfo').textContent = 'Item 0 of 0';
    return;
  }
  
  currentListIndex = 0;
  refreshNounSelector();
  updateModeButtons();
  
  if (options.skipLoad) {
    return;
  }
  
  loadItem(0);
}

function updateModeButtons() {
  document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });
}

function goToRandom(target) {
  if (target === 'regular' || target === 'irregular') {
    setPracticeMode(target, { skipLoad: true });
  } else {
    setPracticeMode('all', { skipLoad: true });
  }
  
  if (activeIndices.length === 0) {
    return;
  }
  
  const randomIndex = Math.floor(Math.random() * activeIndices.length);
  loadItem(randomIndex);
}

function initializePage() {
  setPracticeMode('all');
  setupEventListeners();
}

function refreshNounSelector() {
  const selector = document.getElementById('nounSelector');
  selector.innerHTML = '';

  activeIndices.forEach((nounIndex, position) => {
    const noun = nounData[nounIndex];
    const btn = document.createElement('button');
    btn.className = `noun-btn ${position === currentListIndex ? 'active' : ''}`;
    btn.dataset.position = position;
    btn.textContent = `${position + 1}`;
    btn.title = `${noun.singular} → ${noun.plural}`;
    selector.appendChild(btn);
  });
}

function loadItem(listPosition) {
  if (activeIndices.length === 0) {
    return;
  }
  currentListIndex = listPosition;
  currentItem = activeIndices[listPosition];
  const noun = nounData[currentItem];
  hintStage = 0;
  selectedChoice = null;
  
  // Update title and type
  document.getElementById('nounTitle').textContent = noun.singular.charAt(0).toUpperCase() + noun.singular.slice(1);
  
  // Update sentences
  const singularSentence = noun.sentence.split('[noun]').join(`<span class="singular-noun">${noun.singular}</span>`);
  const pluralTemplate = noun.pluralSentence || noun.sentence;
  const blankInput = '<input type="text" class="blank-input" id="pluralInput" placeholder="?">';
  let pluralSentence = pluralTemplate;
  
  if (pluralSentence.includes('[noun]')) {
    pluralSentence = pluralSentence.split('[noun]').join(blankInput);
  } else {
    pluralSentence = `${pluralSentence} ${blankInput}`;
  }
  
  document.getElementById('singularSentence').innerHTML = singularSentence;
  document.getElementById('pluralSentence').innerHTML = pluralSentence;
  
  // Update progress
  document.getElementById('progressInfo').textContent = `Item ${listPosition + 1} of ${activeIndices.length}`;
  
  // Update selector
  document.querySelectorAll('.noun-btn').forEach((btn) => {
    const position = parseInt(btn.dataset.position, 10);
    btn.classList.toggle('active', position === listPosition);
  });
  
  // Reset UI elements
  resetUI();
  
  // Re-setup input listener for new input element
  setupInputListener();
}

function resetUI() {
  hintStage = 0;
  const input = document.getElementById('pluralInput');
  if (input) {
    input.value = '';
    input.classList.remove('correct', 'incorrect');
  }
  const hintMessage = document.getElementById('hintMessage');
  hintMessage.classList.remove('show');
  hintMessage.textContent = '';
  const primaryHintBtn = document.getElementById('showHintBtn');
  primaryHintBtn.textContent = '💡 I Need Help';
  primaryHintBtn.disabled = false;
  const secondaryHintBtn = document.getElementById('moreHelpBtn');
  secondaryHintBtn.textContent = '✨ I Need More Help';
  secondaryHintBtn.disabled = true;
  document.getElementById('multipleChoice').classList.remove('show');
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextItem').style.display = 'none';
  selectedChoice = null;
  
  // Reset image area
  const placeholder = document.getElementById('imagePlaceholder');
  placeholder.style.display = 'none';
  placeholder.innerHTML = '[Add picture here]<br><small>Click to upload image</small>';
  placeholder.style.border = '3px dashed #cbd5e1';
  placeholder.style.background = '#f8fafc';
  
  // Update navigation buttons
  document.getElementById('prevBtn').disabled = currentListIndex === 0;
  document.getElementById('nextBtn').disabled = currentListIndex === activeIndices.length - 1;
}

function showTypeHint() {
  if (hintStage >= 1) return;
  
  hintStage = 1;
  const noun = nounData[currentItem];
  const hintMessage = document.getElementById('hintMessage');
  const typeHint = noun.type === 'Irregular'
    ? 'Hint: This is an irregular plural. The word changes its form when you make it plural.'
    : 'Hint: This is a regular plural. Add -s or -es to make it plural.';
  hintMessage.textContent = typeHint;
  hintMessage.classList.add('show');
  
  const primaryHintBtn = document.getElementById('showHintBtn');
  primaryHintBtn.textContent = '✓ Hint Shown';
  primaryHintBtn.disabled = true;
  document.getElementById('moreHelpBtn').disabled = false;
}

function showChoiceHint() {
  if (hintStage >= 2) return;
  
  hintStage = 2;
  const noun = nounData[currentItem];
  
  // Create multiple choice options
  const choices = [noun.plural, ...noun.foils].sort(() => Math.random() - 0.5);
  const choiceContainer = document.getElementById('choiceOptions');
  choiceContainer.innerHTML = '';
  
  choices.forEach((choice) => {
    const option = document.createElement('div');
    option.className = 'choice-option';
    option.textContent = choice;
    option.dataset.choice = choice;
    option.addEventListener('click', () => selectChoice(option, choice));
    choiceContainer.appendChild(option);
  });
  
  document.getElementById('multipleChoice').classList.add('show');
  const secondaryHintBtn = document.getElementById('moreHelpBtn');
  secondaryHintBtn.textContent = '✓ Choices Shown';
  secondaryHintBtn.disabled = true;
}

function selectChoice(element, choice) {
  document.querySelectorAll('.choice-option').forEach(opt => opt.classList.remove('selected'));
  element.classList.add('selected');
  selectedChoice = choice;
}

function checkAnswer() {
  const input = document.getElementById('pluralInput');
  const userAnswer = input.value.trim().toLowerCase();
  const correctAnswer = nounData[currentItem].plural.toLowerCase();
  const isCorrect = userAnswer === correctAnswer;
  
  input.classList.remove('correct', 'incorrect');
  input.classList.add(isCorrect ? 'correct' : 'incorrect');
  
  showFeedback(isCorrect, 'text');
}

function checkChoice() {
  if (!selectedChoice) {
    showFeedback(false, 'choice', 'Please select an answer first!');
    return;
  }
  
  const isCorrect = selectedChoice.toLowerCase() === nounData[currentItem].plural.toLowerCase();
  
  // Mark choices
  document.querySelectorAll('.choice-option').forEach(option => {
    option.classList.remove('correct', 'incorrect');
    if (option.dataset.choice === nounData[currentItem].plural) {
      option.classList.add('correct');
    } else if (option.classList.contains('selected') && !isCorrect) {
      option.classList.add('incorrect');
    }
  });
  
  // Fill in the text input with the selected choice
  const input = document.getElementById('pluralInput');
  input.value = selectedChoice;
  input.classList.remove('correct', 'incorrect');
  input.classList.add(isCorrect ? 'correct' : 'incorrect');
  
  showFeedback(isCorrect, 'choice');
}

function showFeedback(isCorrect, source, customMessage = null) {
  const feedback = document.getElementById('feedback');
  const feedbackText = document.getElementById('feedbackText');
  const noun = nounData[currentItem];
  
  feedback.classList.remove('success', 'error');
  
  if (customMessage) {
    feedback.classList.add('error');
    feedbackText.innerHTML = `<strong>${customMessage}</strong>`;
  } else if (isCorrect) {
    feedback.classList.add('success');
    feedbackText.innerHTML = `
      <strong>🎉 Excellent!</strong><br>
      The plural of "${noun.singular}" is "${noun.plural}".
      ${noun.type === 'Irregular' ? ' This is an irregular plural!' : ' Just add -s or -es!'}
    `;
    document.getElementById('nextItem').style.display = 'inline-block';
  } else {
    feedback.classList.add('error');
    feedbackText.innerHTML = `
      <strong>Not quite right.</strong><br>
      The correct plural of "${noun.singular}" is "<strong>${noun.plural}</strong>".
      ${noun.type === 'Irregular' ? ' This is an irregular plural - it changes form!' : ' Remember the rule for regular plurals!'}
    `;
  }
  
  feedback.classList.add('show');
}

function setupEventListeners() {
  // Noun selector
  document.getElementById('nounSelector').addEventListener('click', (e) => {
    if (e.target.classList.contains('noun-btn')) {
      const itemIndex = parseInt(e.target.dataset.position, 10);
      if (!Number.isNaN(itemIndex)) {
        loadItem(itemIndex);
      }
    }
  });
  
  // Hint button
  document.getElementById('showHintBtn').addEventListener('click', showTypeHint);
  document.getElementById('moreHelpBtn').addEventListener('click', showChoiceHint);
  
  // Check buttons
  document.getElementById('checkAnswerBtn').addEventListener('click', checkAnswer);
  document.getElementById('checkChoiceBtn').addEventListener('click', checkChoice);
  
  // Navigation
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentListIndex > 0) loadItem(currentListIndex - 1);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentListIndex < activeIndices.length - 1) loadItem(currentListIndex + 1);
  });
  
  // Control buttons
  document.getElementById('resetItem').addEventListener('click', () => loadItem(currentListIndex));
  document.getElementById('nextItem').addEventListener('click', () => {
    if (currentListIndex < activeIndices.length - 1) {
      loadItem(currentListIndex + 1);
    }
  });
  
  // Mode controls
  const modeControls = document.getElementById('modeControls');
  if (modeControls) {
    modeControls.addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (!button) return;
      
      if (button.dataset.mode) {
        setPracticeMode(button.dataset.mode);
      } else if (button.dataset.random) {
        goToRandom(button.dataset.random);
      }
    });
  }
  
  // Image upload
  document.getElementById('addImageBtn').addEventListener('click', () => {
    document.getElementById('imageInput').click();
  });
  
  document.getElementById('imagePlaceholder').addEventListener('click', () => {
    document.getElementById('imageInput').click();
  });
  
  document.getElementById('imageInput').addEventListener('change', handleImageUpload);
  
  // Initial input setup
  setupInputListener();
}

function setupInputListener() {
  const input = document.getElementById('pluralInput');
  if (input) {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });
    
    input.addEventListener('input', () => {
      input.classList.remove('correct', 'incorrect');
      document.getElementById('feedback').classList.remove('show');
    });
  }
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = function(event) {
      const placeholder = document.getElementById('imagePlaceholder');
      placeholder.innerHTML = `<img src="${event.target.result}" style="max-width: 100%; max-height: 100%; border-radius: 8px;">`;
      placeholder.style.border = '3px solid var(--ok)';
      placeholder.style.background = '#f0fdf4';
      placeholder.style.display = 'flex'; // Show the image area
    };
    reader.readAsDataURL(file);
  }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', initializePage);
