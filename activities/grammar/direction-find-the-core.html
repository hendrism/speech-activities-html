<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find the Core Highlighter</title>
  <script src="../../data/grammar.js"></script>
  <script src="../../js/data-loader.js"></script>
<style>
    :root {
      --purple: #7c3aed;
      --purple-dark: #5b21b6;
      --green: #10b981;
      --muted: #6b7280;
      --ink: #111827;
      --surface: #ffffff;
      --bg: radial-gradient(circle at top, #ede9fe 0%, #f8fafc 55%, #eef2ff 100%);
      --shadow: 0 16px 28px rgba(124, 58, 237, 0.16);
      --border: 1px solid rgba(124, 58, 237, 0.18);
      --radius: 20px;
      --max: 860px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
    }

    main {
      width: min(94%, var(--max));
      padding: 40px 0 64px;
      display: grid;
      gap: 24px;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 26px 26px 22px;
      display: grid;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 32px);
      color: var(--purple-dark);
    }

    .quick-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .quick-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.14);
      color: var(--purple-dark);
      font-size: 14px;
      font-weight: 600;
    }

    section {
      background: rgba(255, 255, 255, 0.96);
      border-radius: var(--radius);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 26px;
      display: grid;
      gap: 18px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      color: var(--purple-dark);
    }

    .direction-card {
      background: rgba(248, 250, 252, 0.95);
      border-radius: 18px;
      border: 2px solid rgba(124, 58, 237, 0.16);
      padding: 18px;
      display: grid;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.16);
      color: var(--purple-dark);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .direction-text {
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink);
    }

    .token-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .token {
      padding: 8px 11px;
      border-radius: 12px;
      border: 2px dashed rgba(148, 163, 184, 0.4);
      font-size: 15px;
      background: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .token:hover {
      border-color: var(--purple);
      transform: translateY(-2px);
    }

    .token.selected {
      border-color: var(--purple);
      border-style: solid;
      background: rgba(233, 213, 255, 0.52);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.16);
    }

    .token.correct {
      border-color: var(--green);
      background: rgba(209, 250, 229, 0.8);
      color: #065f46;
    }

    .token.missed {
      border-color: #f97316;
      background: rgba(254, 215, 170, 0.7);
      color: #7c2d12;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(124, 58, 237, 0.12);
      color: var(--purple-dark);
      font-size: 14px;
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: var(--purple);
      color: #fff;
      box-shadow: 0 14px 24px rgba(124, 58, 237, 0.25);
    }

    .btn-outline {
      background: #fff;
      border: 2px solid rgba(124, 58, 237, 0.28);
      color: var(--purple-dark);
    }

    .btn-primary:hover,
    .btn-outline:hover {
      transform: translateY(-1px);
    }

    .feedback {
      display: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .feedback.good {
      background: rgba(16, 185, 129, 0.18);
      color: #047857;
      border: 2px solid rgba(16, 185, 129, 0.35);
    }

    .feedback.try {
      background: rgba(234, 179, 8, 0.18);
      color: #713f12;
      border: 2px solid rgba(234, 179, 8, 0.35);
    }

    .mini-title {
      margin: 10px 0 2px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .scenario-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .scenario-btn {
      border: 2px dashed rgba(124, 58, 237, 0.28);
      border-radius: 12px;
      background: #fff;
      color: var(--purple-dark);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .scenario-btn:hover {
      transform: translateY(-1px);
      border-color: var(--purple);
    }

    .scenario-btn.active {
      border-style: solid;
      background: rgba(233, 213, 255, 0.55);
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.18);
    }

    @media (max-width: 600px) {
      header, section {
        padding: 22px;
      }
      .quick-tag {
        font-size: 13px;
      }
      .token {
        font-size: 14px;
      }
    }
  </style>
</head>
<body class="category-grammar">
  <main>
    <header>
      <h1>Find the Core</h1>
      <div class="quick-steps">
        <span class="quick-tag">👀 Tap the verbs and must-do parts</span>
        <span class="quick-tag">📝 Shrink the sentence to the command</span>
        <span class="quick-tag">🚫 Ignore extra reasons or comments</span>
      </div>
    </header>

    <section>
      <h2>Highlight what matters</h2>
      <div class="direction-card">
        <span class="badge" id="scenarioTag"></span>
        <div class="direction-text" id="directionText"></div>
        <div class="token-grid" id="tokenGrid"></div>
      </div>

      <div class="chip-row" id="strategyRow"></div>

      <div class="btn-row">
        <button class="btn-primary" id="checkBtn">Check picks</button>
        <button class="btn-outline" id="revealBtn">Show answer</button>
        <button class="btn-outline" id="nextBtn">New direction</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div>
        <div class="mini-title">Quick pick</div>
        <div class="scenario-list" id="scenarioList"></div>
      </div>
    </section>
  </main>

  <script>
    const scenarios = DataLoader.get('grammar', 'directionFindTheCore');

    const scenarioTag = document.getElementById('scenarioTag');
    const directionText = document.getElementById('directionText');
    const tokenGrid = document.getElementById('tokenGrid');
    const feedback = document.getElementById('feedback');
    const strategyRow = document.getElementById('strategyRow');
    const checkBtn = document.getElementById('checkBtn');
    const revealBtn = document.getElementById('revealBtn');
    const nextBtn = document.getElementById('nextBtn');
    const scenarioList = document.getElementById('scenarioList');

    let currentIndex = 0;
    let current = scenarios[currentIndex];
    let selected = new Set();
    let locked = false;

    function renderScenario() {
      current = scenarios[currentIndex];
      locked = false;
      selected = new Set();
      scenarioTag.textContent = current.tag;
      directionText.textContent = current.direction;
      tokenGrid.innerHTML = current.chunks.map((chunk, index) => `
        <span class="token" data-index="${index}">${chunk.text}</span>
      `).join('');
      strategyRow.innerHTML = current.tips.map(tip => `<span class="chip">${tip}</span>`).join('');
      feedback.style.display = 'none';
      feedback.className = 'feedback';

      renderScenarioList();

      tokenGrid.querySelectorAll('.token').forEach(token => {
        token.classList.remove('correct', 'missed', 'selected');
        token.addEventListener('click', () => {
          if (locked) return;
          const index = Number(token.dataset.index);
          if (selected.has(index)) {
            selected.delete(index);
            token.classList.remove('selected');
          } else {
            selected.add(index);
            token.classList.add('selected');
          }
        });
      });
    }

    function check() {
      if (locked) return;
      if (selected.size === 0) {
        feedback.textContent = "Tap the verbs, deadlines, or names that matter most.";
        feedback.classList.add('try');
        feedback.style.display = 'block';
        return;
      }

      let hits = 0;
      tokenGrid.querySelectorAll('.token').forEach(token => {
        const index = Number(token.dataset.index);
        const chunk = current.chunks[index];
        const choose = selected.has(index);
        token.classList.remove('correct', 'missed');
        if (chunk.key && choose) {
          token.classList.add('correct');
          hits++;
        } else if (!chunk.key && choose) {
          token.classList.add('missed');
        } else if (chunk.key && !choose) {
          token.classList.add('missed');
        }
      });

      const total = current.chunks.filter(chunk => chunk.key).length;
      feedback.textContent = hits === total
        ? "Nice catch! Tell which strategy you’ll use to follow it."
        : `You grabbed ${hits} of ${total}. Check for any verbs or time words you missed.`;

      feedback.classList.add(hits === total ? 'good' : 'try');
      feedback.style.display = 'block';
      locked = true;
    }

    function reveal() {
      tokenGrid.querySelectorAll('.token').forEach(token => {
        const index = Number(token.dataset.index);
        const chunk = current.chunks[index];
        token.classList.remove('selected', 'missed');
        token.classList.toggle('correct', chunk.key);
      });
      feedback.textContent = "Green = worth planning for. Say the steps in order before you start.";
      feedback.className = 'feedback good';
      feedback.style.display = 'block';
      locked = true;
    }

    function renderScenarioList() {
      scenarioList.innerHTML = scenarios.map((item, index) => `
        <button type="button" class="scenario-btn${index === currentIndex ? ' active' : ''}" data-index="${index}">
          ${item.name}
        </button>
      `).join('');

      scenarioList.querySelectorAll('.scenario-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = Number(btn.dataset.index);
          if (index === currentIndex) return;
          currentIndex = index;
          renderScenario();
        });
      });
    }

    checkBtn.addEventListener('click', check);
    revealBtn.addEventListener('click', reveal);
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % scenarios.length;
      renderScenario();
    });

    renderScenario();
  </script>
</body>
</html>
