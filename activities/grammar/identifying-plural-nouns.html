            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);

        }

        * {
            box-sizing: border-box;
            line-height: 1.5;
        }

        body {
            font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        /* Typography */
        h1,
        h2,
        h3 {
            margin: 0;
            font-weight: 700;
        }

        /* Header */
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .app-title {
            font-size: 1.5rem;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .level-indicator {
            background: var(--surface);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        /* Layout */
        .app-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            max-height: calc(100vh - 150px);
        }

        .sidebar-header {
            padding: 1rem;
            background: #f1f5f9;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
        }

        .sidebar-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f8fafc;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-item:hover {
            background: #f8fafc;
            color: var(--primary);
        }

        .sidebar-item.active {
            background: #eef2ff;
            color: var(--primary-dark);
            border-left: 4px solid var(--primary);
            font-weight: 600;
        }

        .sidebar-item.correct {
            color: var(--secondary);
        }

        .sidebar-item.correct::after {
            content: "✓";
            font-weight: bold;
        }
        
        .item-context {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Main Card */
        .activity-card {
            background: var(--surface);
            width: 100%;
            max-width: 900px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            border: 1px solid var(--border);
            animation: fadeIn 0.5s ease-out;
            flex: 1;
        }

        .card-header {
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .vocab-word {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .context-display {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Interactive Areas */
        .instruction-banner {
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid #bae6fd;
        }

        .support-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .student-input-area {
            margin-bottom: 1rem;
        }

        .student-input {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            background: #fff;
        }

        .student-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .support-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-outline {
            background: transparent;
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: #eef2ff;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Content Boxes */
        .content-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-top: 1rem;
            display: none;
            /* Hidden by default */
            animation: slideDown 0.3s ease-out;
        }

        .content-box.visible {
            display: block;
        }

        .hint-text {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-style: italic;
        }

        .hint-label {
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Choices Grid */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .choices-grid {
                grid-template-columns: 1fr;
            }
        }

        .choice-btn {
            background: white;
            border: 2px solid var(--border);
            padding: 1.25rem;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .choice-btn:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #f8fafc;
            transform: translateY(-2px);
        }

        .choice-btn.correct {
            border-color: var(--secondary);
            background: #ecfdf5;
            color: #064e3b;
        }

        .choice-btn.incorrect {
            border-color: #ef4444;
            background: #fef2f2;
            color: #991b1b;
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        /* Navigation */
        .nav-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

</head>

                    <div class="choices-grid" id="choices-grid">

        </div>
    </div>

    </div>

        document.getElementById('total-items').innerText = activityData.length;

        let currentIndex = 0;
        let completedItems = new Set();

        // Initialization
        function init() {
            renderSidebar();
            loadItem(0);
        }

        // Sidebar
        function renderSidebar() {
            const list = document.getElementById('sidebar-list');
            list.innerHTML = activityData.map((item, index) => `
                <li class="sidebar-item ${index === currentIndex ? 'active' : ''} ${completedItems.has(index) ? 'correct' : ''}" 
                    onclick="loadItem(${index})">
                    <div>
                        ${index + 1}. <strong>${item.word}</strong>
                        <div class="item-context">${item.context}</div>
                    </div>
                </li>
            `).join('');
        }

        function updateSidebar() {
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach((item, index) => {
                item.classList.remove('active');
                if (index === currentIndex) item.classList.add('active');

                if (completedItems.has(index)) {
                    item.classList.add('correct');
                } else {
                    item.classList.remove('correct');
                }
            });
            // Auto scroll sidebar
            const activeItem = document.querySelector('.sidebar-item.active');
            if (activeItem) {
                const container = document.querySelector('.sidebar-list');
                const offsetTop = activeItem.offsetTop;
                if (offsetTop > container.clientHeight || offsetTop < container.scrollTop) {
                    container.scrollTop = offsetTop - 50;
                }
            }
        }

        // Main Content
        function loadItem(index) {
            currentIndex = index;
            const data = activityData[index];

            // Update UI Text
            document.getElementById('current-item-num').innerText = index + 1;
            document.getElementById('vocab-word').innerText = data.word;

            document.getElementById('context-display').innerHTML = `Paragraph Context: <strong>${data.context}</strong>`;
            document.getElementById('hint-text').innerText = data.hint;

            // Reset UI State
            document.getElementById('hint-box').classList.remove('visible');
            document.getElementById('choices-box').classList.remove('visible');
            document.getElementById('feedback-area').style.display = 'none';
            document.getElementById('student-input').value = ''; // Clear text box

            // Buttons Text
            document.getElementById('btn-hint').innerHTML = '💡 I need help';
            document.getElementById('btn-choices').innerHTML = '🔍 I need more help';

            // Render Choices
            const choicesGrid = document.getElementById('choices-grid');
            choicesGrid.innerHTML = data.choices.map(choice => `
                <button class="choice-btn" onclick="checkAnswer(this, '${choice}')">${choice}</button>
            `).join('');

            // Navigation State
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === activityData.length - 1;

            updateSidebar();
        }

        // Interaction Logic
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const btn = document.getElementById('btn-hint');

            if (hintBox.classList.contains('visible')) {
                hintBox.classList.remove('visible');
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline');
                btn.innerHTML = '💡 I need help';
            } else {
                hintBox.classList.add('visible');
                btn.classList.add('btn-primary');
                btn.classList.remove('btn-outline');
                btn.innerHTML = '💡 Hide hint';
            }
        }

        function toggleChoices() {
            const choicesBox = document.getElementById('choices-box');
            const btn = document.getElementById('btn-choices');

            if (choicesBox.classList.contains('visible')) {
                choicesBox.classList.remove('visible');
                btn.classList.remove('btn-secondary');
                btn.classList.add('btn-outline');
                btn.innerHTML = '🔍 I need more help';
            } else {
                choicesBox.classList.add('visible');
                btn.classList.add('btn-secondary');
                btn.classList.remove('btn-outline');
                btn.innerHTML = '🔍 Hide choices';
            }
            
            // Auto scroll to choices
            if(choicesBox.classList.contains('visible')) {
                setTimeout(() => {
                    choicesBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            }
        }

        function checkAnswer(btn, selectedChoice) {
            const data = activityData[currentIndex];
            const isCorrect = selectedChoice.toLowerCase() === data.correct.toLowerCase();

            // Reset all buttons
            document.querySelectorAll('.choice-btn').forEach(b => {
                b.classList.remove('correct', 'incorrect');
                b.disabled = true; // Disable all after guess
            });

            if (isCorrect) {
                btn.classList.add('correct');
                document.getElementById('feedback-area').style.display = 'block';
                completedItems.add(currentIndex);

                // Re-enable navigation without disabled styling
                document.querySelectorAll('.choice-btn').forEach(b => {
                    if (b !== btn) b.style.opacity = '0.5';
                });

                updateSidebar();
            } else {
                btn.classList.add('incorrect');

                // Let them try again after showing error
                setTimeout(() => {
                    btn.classList.remove('incorrect');
                    document.querySelectorAll('.choice-btn').forEach(b => {
                        b.disabled = false;
                        b.style.opacity = '1';
                    });
                }, 1500);
            }
        }

        function nextItem() {
            if (currentIndex < activityData.length - 1) {
                loadItem(currentIndex + 1);
            }
        }

        function prevItem() {
            if (currentIndex > 0) {
                loadItem(currentIndex - 1);
            }
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
