<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Negation</title>
  <script src="../../data/grammar.js"></script>
  <script src="../../js/data-loader.js"></script>
</head>

<body class="category-grammar">

    <header class="main-header">
        <div class="header-controls">
            <a href="../../index.html" class="btn btn-outline btn-sm">← Hub</a>
            <h1 style="font-size: 1.2rem; margin: 0; font-weight: 700;">Understanding Negation</h1>
        </div>
        <div class="header-controls">
            <button class="btn btn-outline btn-sm" id="textSizeBtn" title="Toggle Text Size">Aa</button>
        </div>
    </header>

    <div class="pagination-container">
        <button class="btn btn-outline" id="prevBtn">← Previous</button>
        <select id="itemSelect" class="pagination-info"
            style="padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border); font-size: 1rem; cursor: pointer; background: var(--card-bg); color: var(--text-main); font-family: inherit;">
        </select>
        <button class="btn btn-outline" id="nextBtn">Next →</button>
    </div>

    <main class="container">
        <div class="card" id="activityCard">
            <div class="sentence-display" id="sentenceText">
                Sentence goes here.
            </div>

            <div class="choices-container">
                <div class="choice-item">
                    <button class="image-button" id="btnA" aria-label="Choice A">
                        <img id="imgA" src="" alt="Choice A Image">
                    </button>
                    <div class="image-label">A</div>
                </div>

                <div class="choice-item">
                    <button class="image-button" id="btnB" aria-label="Choice B">
                        <img id="imgB" src="" alt="Choice B Image">
                    </button>
                    <div class="image-label">B</div>
                </div>
            </div>

            <div id="feedbackText" class="feedback-message"></div>
        </div>
    </main>

    <script>
        // Data loaded via DataLoader
        const basePath = '../../negation_images_separated/';
        const activityData = DataLoader.get('grammar', 'negation');

        let currentIndex = 0;
        let isLargeText = false;
        let currentChoices = [];

        // DOM Elements
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const itemSelect = document.getElementById('itemSelect');
        const sentenceText = document.getElementById('sentenceText');
        const btnA = document.getElementById('btnA');
        const btnB = document.getElementById('btnB');
        const imgA = document.getElementById('imgA');
        const imgB = document.getElementById('imgB');
        const feedbackText = document.getElementById('feedbackText');

        function init() {
            // Populate select dropdown
            activityData.forEach((item, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${index + 1}. ${item.sentence}`;
                itemSelect.appendChild(option);
            });

            setupEventListeners();
            loadItem(0);
        }

        // Shuffle an array (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadItem(index) {
            currentIndex = index;
            const item = activityData[index];

            // Render text
            sentenceText.textContent = item.sentence;

            // Randomize images
            currentChoices = shuffle([...item.images]);

            imgA.src = currentChoices[0].src;
            imgB.src = currentChoices[1].src;

            // Store metadata on buttons for click handling
            btnA.dataset.correct = currentChoices[0].correct;
            btnB.dataset.correct = currentChoices[1].correct;

            // Reset UI states
            btnA.className = 'image-button';
            btnB.className = 'image-button';
            btnA.disabled = false;
            btnB.disabled = false;

            feedbackText.className = 'feedback-message';
            feedbackText.textContent = '';

            // Render Pagination
            itemSelect.value = index;
            prevBtn.disabled = (currentIndex === 0);
            prevBtn.style.opacity = prevBtn.disabled ? "0.5" : "1";
            prevBtn.style.cursor = prevBtn.disabled ? "not-allowed" : "pointer";

            nextBtn.disabled = (currentIndex === activityData.length - 1);
            nextBtn.style.opacity = nextBtn.disabled ? "0.5" : "1";
            nextBtn.style.cursor = nextBtn.disabled ? "not-allowed" : "pointer";
        }

        function handleChoiceClick(e) {
            const btn = e.currentTarget;
            const isCorrect = btn.dataset.correct === 'true';

            // Reset all buttons first
            btnA.className = 'image-button';
            btnB.className = 'image-button';

            if (isCorrect) {
                // Correct answer
                btn.classList.add('correct');
                feedbackText.textContent = 'Correct! Great job.';
                feedbackText.className = 'feedback-message success show';

                // Optional: disable clicking after correct
                // btnA.disabled = true;
                // btnB.disabled = true;
            } else {
                // Incorrect answer
                btn.classList.add('incorrect');
                feedbackText.textContent = 'Not quite. Try again!';
                feedbackText.className = 'feedback-message error show';
            }
        }

        function setupEventListeners() {
            // Text Size Toggle
            document.getElementById('textSizeBtn').onclick = () => {
                isLargeText = !isLargeText;
                document.body.classList.toggle('text-large', isLargeText);
            };

            // Pagination
            prevBtn.onclick = () => {
                if (currentIndex > 0) loadItem(currentIndex - 1);
            };

            nextBtn.onclick = () => {
                if (currentIndex < activityData.length - 1) loadItem(currentIndex + 1);
            };

            itemSelect.addEventListener('change', (e) => {
                loadItem(parseInt(e.target.value, 10));
            });

            // Choice Handling
            btnA.addEventListener('click', handleChoiceClick);
            btnB.addEventListener('click', handleChoiceClick);
        }

        // Start
        init();

    </script>
</body>

</html>
