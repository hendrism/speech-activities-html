            <button class="btn btn-outline btn-sm" id="editModeBtn" title="Edit Content">✏️ Edit</button>

    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Story / Activity Card -->
        <div class="card" id="activityCard">
            <div class="story-header" style="flex-direction: column; gap: 0;">
                <h2 class="story-title editable-field" id="displayTitle">Item Title</h2>
            </div>

            <div class="story-text editable-field" id="displaySentence">
                Sentence goes here...
            </div>

            <!-- Student Inputs Section (Replacing Parts List) -->
            <div class="input-section" style="margin-bottom: 2rem;">
                <label style="display:block; font-weight:700; color:var(--text-muted); margin-bottom:0.5rem;">1. What do
                    we know? (Organize your ideas)</label>
                <textarea id="weKnowInput" class="editable-field"
                    style="width:100%; height:80px; padding:1rem; border:2px solid var(--border); border-radius:0.5rem; font-family:inherit; font-size:1rem; margin-bottom:1.5rem; resize: vertical;"
                    placeholder="Type the key parts of the sentence here..."></textarea>

                <label style="display:block; font-weight:700; color:var(--text-muted); margin-bottom:0.5rem;">2.
                    Rephrase the sentence</label>
                <textarea id="rephraseInput" class="editable-field"
                    style="width:100%; height:80px; padding:1rem; border:2px solid var(--border); border-radius:0.5rem; font-family:inherit; font-size:1rem; resize: vertical;"
                    placeholder="Say it in your own words..."></textarea>
            </div>

            <!-- Independent Progressive Help -->
            <div class="help-section">
                <div class="help-controls">
                    <button class="btn btn-outline" id="toggleHintBtn">💡 Hint</button>
                    <button class="btn btn-outline" id="toggleChoicesBtn">📋 Choices</button>
                </div>

                <!-- Step 1: Hint -->
                <div class="help-content hint-box" id="hintBox">
                    <strong>Hint:</strong> <span class="editable-field" id="displayHint">Hint text goes here...</span>
                </div>

                <!-- Step 2: Choices -->
                <div class="help-content choices-box" id="choicesBox">
                    <div class="choices-grid" id="choicesGrid">
                        <!-- Choices injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Mode Floating Controls -->

        <button class="floating-btn save-btn" id="saveChangesBtn" title="Download Updated File">💾</button>

        // --- State ---
        let currentIndex = 0;
        let isLargeText = false;
        let isEditMode = false;

        // --- DOM Elements ---
        const navScroller = document.getElementById('navScroller');
        const displayTitle = document.getElementById('displayTitle');
        const displaySentence = document.getElementById('displaySentence');

        // NEW: Inputs (Replacing Parts List)
        const weKnowInput = document.getElementById('weKnowInput');
        const rephraseInput = document.getElementById('rephraseInput');

        const displayHint = document.getElementById('displayHint');
        const choicesGrid = document.getElementById('choicesGrid');

        const hintBox = document.getElementById('hintBox');
        const choicesBox = document.getElementById('choicesBox');

        const toggleHintBtn = document.getElementById('toggleHintBtn');
        const toggleChoicesBtn = document.getElementById('toggleChoicesBtn');

        // --- Initialization ---
        function init() {
            renderNav();
            loadItem(0);
            setupEventListeners();
        }

        // --- Rendering ---
        function renderNav() {
            navScroller.innerHTML = '';
            activityData.items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-item ${index === currentIndex ? 'active' : ''}`;
                btn.textContent = item.title;
                btn.onclick = () => loadItem(index);
                navScroller.appendChild(btn);
            });
        }

        function loadItem(index) {
            currentIndex = index;
            const item = activityData.items[index];

            // Render Content
            displayTitle.textContent = item.title;
            displaySentence.textContent = item.sentence;
            displayHint.textContent = item.hint || "No hint available.";

            // Clear inputs for new item
            weKnowInput.value = '';
            rephraseInput.value = '';

            // Render Choices
            choicesGrid.innerHTML = '';
            item.choices.forEach((choice, choiceIndex) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn editable-field';
                btn.textContent = choice.text;
                // Click logic (Answer Checking)
                btn.onclick = (e) => {
                    if (isEditMode) return; // Don't trigger answer logic in edit mode
                    if (choice.correct) {
                        btn.classList.add('correct');
                        btn.textContent += ' ✅';
                    } else {
                        btn.classList.add('incorrect');
                        btn.textContent += ' ❌';
                    }
                };
                choicesGrid.appendChild(btn);
            });

            // Reset Toggles
            hintBox.classList.remove('show');
            choicesBox.classList.remove('show');
            toggleHintBtn.classList.remove('active');
            toggleChoicesBtn.classList.remove('active');

            // Update Nav State
            renderNav();
        }

        function setupEventListeners() {
            // Text Size Toggle
            document.getElementById('textSizeBtn').onclick = () => {
                isLargeText = !isLargeText;
                document.body.classList.toggle('text-large', isLargeText);
            };

            // Progressive Help Toggles
            toggleHintBtn.onclick = () => {
                hintBox.classList.toggle('show');
                toggleHintBtn.classList.toggle('active');
            };

            toggleChoicesBtn.onclick = () => {
                choicesBox.classList.toggle('show');
                toggleChoicesBtn.classList.toggle('active');
            };

            // Edit Mode Toggle
            document.getElementById('editModeBtn').onclick = toggleEditMode;

            // Save Changes
            document.getElementById('saveChangesBtn').onclick = downloadUpdatedFile;
        }

        // --- Edit Mode Logic ---
        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);

            const editableElements = document.querySelectorAll('.editable-field');
            editableElements.forEach(el => {
                el.contentEditable = isEditMode;
            });

            if (isEditMode) {
                alert("✏️ Edit Mode Active\n\n- Click any text box to edit.\n- Click the 'Floppy Disk' icon at the bottom right to download your changes.");
            }
        }

        function downloadUpdatedFile() {
            const currentItem = activityData.items[currentIndex];
            currentItem.title = displayTitle.innerText;
            currentItem.sentence = displaySentence.innerText;
            currentItem.hint = displayHint.innerText;

            // Note: We don't save student input values (textareas) because they are transient.
            // We only save changes to the *activity content* (title, sentence, hint, choices).

            // Capture Choices
            const choiceBtns = choicesGrid.querySelectorAll('.choice-btn');
            choiceBtns.forEach((btn, idx) => {
                if (currentItem.choices[idx]) {
                    // Clean text (remove status icons)
                    let cleanText = btn.innerText.replace(' ✅', '').replace(' ❌', '');
                    currentItem.choices[idx].text = cleanText;
                }
            });

            const clone = document.documentElement.cloneNode(true);

            clone.querySelector('body').classList.remove('edit-mode');
            const editables = clone.querySelectorAll('[contenteditable]');
            editables.forEach(el => el.removeAttribute('contenteditable'));

            // Clear input values in the clone so the saved file is clean
            clone.querySelector('#weKnowInput').textContent = '';
            clone.querySelector('#rephraseInput').textContent = '';

            const scriptContent = clone.querySelector('script').textContent;
            const newScriptContent = scriptContent.replace(
                /const activityData = \{[\s\S]*?\};/,
                `const activityData = ${JSON.stringify(activityData, null, 4)};`
            );
            clone.querySelector('script').textContent = newScriptContent;

            const htmlContent = "<!DOCTYPE html>\n" + clone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const currentFilename = window.location.pathname.split('/').pop() || 'sentence-breakdown-paraphrasing.html';
            const safeFilename = decodeURIComponent(currentFilename);

            const a = document.createElement('a');
            a.href = url;
            a.download = safeFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        init();
    </script>
