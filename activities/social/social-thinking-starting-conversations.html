<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting Conversations - Social Thinking</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --surface: #ffffff;
            --background: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: var(--border);
        }

        .starters-toggle {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .starters-toggle:hover {
            background: #c7d2fe;
        }

        /* --- Scroller --- */
        .scroller {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
            /* Firefox */
        }

        .scroller::-webkit-scrollbar {
            display: none;
        }

        .nav-dot {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: var(--background);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .nav-dot.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .nav-dot.completed {
            border-color: var(--success);
            color: var(--success);
            background: #d1fae5;
        }

        /* --- Main --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--surface);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scenario-tag {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        h2 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .scenario-text {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* --- Input Sections --- */
        .path-container {
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 1.5rem;
            border-radius: 0.75rem;
        }

        .path-container h3 {
            margin-top: 0;
            color: #475569;
            font-size: 1rem;
        }

        .field-group {
            margin-bottom: 1rem;
        }

        .field-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* --- Helpers --- */
        .helpers {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .helper-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            color: #64748b;
            margin-right: 0.5rem;
            transition: all 0.2s;
        }

        .helper-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .helper-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .helper-content {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: none;
        }

        .helper-content.visible {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .hint-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            color: #92400e;
        }

        .mc-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .mc-option {
            background: white;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .mc-option:hover {
            background: #dbeafe;
        }

        /* --- Starters Modal/Panel --- */
        .starters-panel {
            position: fixed;
            top: 70px;
            /* Below header */
            right: 20px;
            width: 250px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            display: none;
            z-index: 50;
        }

        .starters-panel.visible {
            display: block;
        }

        .starter-chip {
            display: block;
            background: #f1f5f9;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .starter-chip:hover {
            background: #e2e8f0;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.9;
        }

        .btn:hover {
            opacity: 1;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
    </style>
</head>

<body>

    <header>
        <div class="header-left">
            <a href="../../index.html" class="back-btn">← Hub</a>
            <h1 style="font-size:1.25rem; margin:0;">Starting Conversations</h1>
        </div>
        <button class="starters-toggle" onclick="toggleStarters()">💡 Sentence Starters</button>
    </header>

    <div class="starters-panel" id="startersPanel">
        <h4 style="margin-top:0; color:#475569;">Try starting with:</h4>
        <div id="startersList">
            <!-- Populated via JS -->
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#94a3b8; text-align:center;">Click to copy</div>
    </div>

    <div class="scroller" id="navScroller">
        <!-- Dots injected here -->
    </div>

    <main id="mainContent">
        <!-- Activity Card Injected Here -->
    </main>

    <script>
        const scenarios = [
            {
                id: 1,
                title: "Scenario 1: Wrong Project",
                text: "You sit down with your group and realize they are talking about a different project than the one you thought you were doing. They start planning without you. You can't just sit there and say nothing.",
                hint: "Think about: Telling them you might be confused, or asking what project they're talking about.",
                mc: [
                    "Wait, I thought we were doing the history project. Did I miss something?",
                    "(Say nothing and just sit there)",
                    "This is stupid.",
                    "Whatever."
                ]
            },
            {
                id: 2,
                title: "Scenario 2: Someone Is in Your Seat",
                text: "You come into class and someone is sitting in your usual seat with their stuff spread out. You need that seat.",
                hint: "You might ask politely, or explain that you usually sit there.",
                mc: [
                    "Hey, sorry, I usually sit there. Could I sit there today?",
                    "(Stare at them and stand there)",
                    "You're in my seat. Move.",
                    "Go sit on the floor."
                ]
            },
            {
                id: 3,
                title: "Scenario 3: Confusing Directions",
                text: "The teacher finishes explaining an assignment, but you don't understand what to do. Everyone else starts working.",
                hint: "You could ask the teacher, or you could ask someone nearby.",
                mc: [
                    "Sorry, can you explain what we're supposed to write?",
                    "(Do nothing and wait)",
                    "This makes no sense.",
                    "Put your head down."
                ]
            },
            {
                id: 4,
                title: "Scenario 4: Partner Isn't Working",
                text: "You're paired with someone, but they're just on their phone and not starting the work.",
                hint: "You might remind them you're partners, or ask how to split the work.",
                mc: [
                    "Hey, do you want to split this up or work together?",
                    "(Say nothing and do all the work yourself)",
                    "You're so lazy.",
                    "Just stare at them."
                ]
            },
            {
                id: 5,
                title: "Scenario 5: You Didn't Hear Them",
                text: "Someone says something to you, but you didn't hear or didn't understand. They are waiting for an answer.",
                hint: "You can ask them to repeat it, or say you didn't hear.",
                mc: [
                    "Sorry, can you say that again?",
                    "Guess and answer something random",
                    "Ignore them",
                    "Walk away"
                ]
            },
            {
                id: 6,
                title: "Scenario 6: You Need to Borrow a Charger",
                text: "Your Chromebook is almost dead. Someone across the room has a charger.",
                hint: "You might ask politely, or explain your computer is dying.",
                mc: [
                    "Hey, sorry to bother you. Could I borrow your charger for a few minutes?",
                    "Take it without asking",
                    "Give me that.",
                    "Just let your computer die"
                ]
            },
            {
                id: 7,
                title: "Scenario 7: You're Not in a Group",
                text: "In PE or another class, groups are forming. Everyone seems to be in a group except you.",
                hint: "You might ask to join a group, or ask the teacher what to do.",
                mc: [
                    "Can I join your group?",
                    "Stand there and wait forever",
                    "Nobody likes me.",
                    "Sit down and do nothing"
                ]
            }
        ];

        const starters = [
            "Hey, I think...",
            "Um, sorry, but...",
            "Wait, are we supposed to...",
            "Can I...",
            "I'm not sure, but...",
            "Excuse me, I think..."
        ];

        let currentIndex = 0;
        let userData = {}; // Stores user inputs by scenario ID

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderStarters();
            loadScenario(0);
        });

        function renderStarters() {
            const list = document.getElementById('startersList');
            list.innerHTML = starters.map(s =>
                `<span class="starter-chip" onclick="copyText('${s.replace(/'/g, "\\'")}')">${s}</span>`
            ).join('');
        }

        function toggleStarters() {
            document.getElementById('startersPanel').classList.toggle('visible');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            const btn = document.querySelector('.starters-toggle');
            const original = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => btn.textContent = original, 1000);
        }

        function renderNav() {
            const nav = document.getElementById('navScroller');
            nav.innerHTML = scenarios.map((s, idx) => `
                <div class="nav-dot ${idx === currentIndex ? 'active' : ''} ${userData[idx]?.completed ? 'completed' : ''}" 
                     onclick="loadScenario(${idx})">
                    ${idx + 1}
                </div>
            `).join('');
        }

        function loadScenario(index) {
            currentIndex = index;
            renderNav(); // Update active dot

            const item = scenarios[index];
            const data = userData[index] || { way1: '', resp1: '', way2: '', resp2: '' };

            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="card">
                    <span class="scenario-tag">Situation ${index + 1} of ${scenarios.length}</span>
                    <h2 class="editable" contenteditable="true">${item.title}</h2>
                    <div class="scenario-text editable" contenteditable="true">${item.text}</div>

                    <!-- Path 1 -->
                    <div class="path-container">
                        <h3>Way #1</h3>
                        <div class="field-group">
                            <label class="field-label">I could start the conversation by saying:</label>
                            <textarea oninput="saveInput(${index}, 'way1', this.value)" placeholder="Type here...">${data.way1}</textarea>
                        </div>
                        <div class="field-group">
                            <label class="field-label">What might they say back?</label>
                            <textarea oninput="saveInput(${index}, 'resp1', this.value)" placeholder="Type here...">${data.resp1}</textarea>
                        </div>
                    </div>

                    <!-- Path 2 -->
                    <div class="path-container" style="background:#e0f2fe;">
                        <h3>Way #2</h3>
                        <div class="field-group">
                            <label class="field-label">Another way I could start is:</label>
                            <textarea oninput="saveInput(${index}, 'way2', this.value)" placeholder="Type here...">${data.way2}</textarea>
                        </div>
                        <div class="field-group">
                            <label class="field-label">What might they say back?</label>
                            <textarea oninput="saveInput(${index}, 'resp2', this.value)" placeholder="Type here...">${data.resp2}</textarea>
                        </div>
                    </div>

                    <!-- Helpers -->
                    <div class="helpers">
                        <div style="margin-bottom:1rem;">
                            <button class="helper-btn" onclick="toggleHelper('hint')">💡 Hint</button>
                            <button class="helper-btn" onclick="toggleHelper('mc')">❓ Multiple Choice</button>
                        </div>
                        
                        <div id="hintContent" class="helper-content hint-box">
                            <strong>Think about:</strong> ${item.hint}
                        </div>

                        <div id="mcContent" class="helper-content mc-box">
                            <div style="margin-bottom:0.5rem; font-weight:600;">Which acts as a good starter?</div>
                            ${item.mc.map(opt => `<div class="mc-option">${opt}</div>`).join('')}
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="nav-controls">
                        <button class="btn btn-outline" onclick="prev()" ${index === 0 ? 'disabled' : ''}>Previous</button>
                        <button class="btn" onclick="next()" ${index === scenarios.length - 1 ? 'disabled' : ''}>Next Scenario</button>
                    </div>
                </div>
            `;
        }

        function saveInput(idx, field, val) {
            if (!userData[idx]) userData[idx] = {};
            userData[idx][field] = val;

            // Mark complete if all filled
            const d = userData[idx];
            if (d.way1 && d.resp1 && d.way2 && d.resp2) {
                userData[idx].completed = true;
            } else {
                userData[idx].completed = false;
            }
            renderNav(); // Update dots
        }

        function toggleHelper(type) {
            const el = document.getElementById(`${type}Content`);
            el.classList.toggle('visible');
        }

        function next() {
            if (currentIndex < scenarios.length - 1) {
                loadScenario(currentIndex + 1);
            }
        }

        function prev() {
            if (currentIndex > 0) {
                loadScenario(currentIndex - 1);
            }
        }

    </script>
</body>

</html>
