<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labeling Emotions with Clear Speech Strategies</title>
    <script src="../../data/social.js"></script>
    <script src="../../js/data-loader.js"></script>
</head>
<body class="category-social">
    <header>
        <h1>Labeling Emotions with Clear Speech Strategies</h1>
        <p>Read the scenario, answer two prompts with full sentences, and practice clear articulation. Use the clue and choices if you need support.</p>
    </header>
    <main>
        <div class="shell">
            <div class="layout">
                <aside class="sidebar">
                    <h2>Scenarios</h2>
                    <div class="progress"><span id="progressCount">0/10 started</span><span id="progressHint">Fill either prompt to log progress.</span></div>
                    <div class="scenario-list" id="scenarioList"></div>
                </aside>
                <section class="workspace">
                    <div class="scenario-top">
                        <span class="badge" id="scenarioNumber">Scenario 1</span>
                        <h2 class="scenario-title" id="scenarioTitle">Title</h2>
                    </div>
                    <div class="scenario-card" id="scenarioText"></div>
                    <div class="prompt-grid">
                        <div class="prompt-card">
                            <h3>Prompt 1</h3>
                            <p class="question" id="question1"></p>
                            <div class="help-row">
                                <button class="help-btn" id="help1Btn">I need help</button>
                                <button class="help-btn secondary" id="choices1Btn">I need more help (choices)</button>
                            </div>
                            <div class="clue hidden" id="clue1"></div>
                            <div class="choices hidden" id="choices1"></div>
                            <label for="answer1">Your sentence:</label>
                            <textarea id="answer1" placeholder="Say the emotion out loud while you write it in a full sentence."></textarea>
                        </div>
                        <div class="prompt-card">
                            <h3>Prompt 2</h3>
                            <p class="question" id="question2"></p>
                            <div class="help-row">
                                <button class="help-btn" id="help2Btn">I need help</button>
                                <button class="help-btn secondary" id="choices2Btn">I need more help (choices)</button>
                            </div>
                            <div class="clue hidden" id="clue2"></div>
                            <div class="choices hidden" id="choices2"></div>
                            <label for="answer2">Your sentence:</label>
                            <textarea id="answer2" placeholder="Say the emotion out loud while you write it in a full sentence."></textarea>
                        </div>
                    </div>
                    <div class="controls">
                        <button class="btn" id="prevBtn">Previous</button>
                        <button class="btn primary" id="nextBtn">Next scenario</button>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script>
        const scenarios = DataLoader.filter('social', 'scenarios', function(s) { return s.sourceFile === 'activities/social/labeling-emotions-speech-strategies.html'; });

        const responses = scenarios.map(() => ({
            answer1: "",
            answer2: ""
        }));

        let activeIndex = 0;

        const scenarioList = document.getElementById("scenarioList");
        const scenarioNumber = document.getElementById("scenarioNumber");
        const scenarioTitle = document.getElementById("scenarioTitle");
        const scenarioText = document.getElementById("scenarioText");
        const question1El = document.getElementById("question1");
        const question2El = document.getElementById("question2");
        const clue1El = document.getElementById("clue1");
        const clue2El = document.getElementById("clue2");
        const choices1El = document.getElementById("choices1");
        const choices2El = document.getElementById("choices2");
        const answer1 = document.getElementById("answer1");
        const answer2 = document.getElementById("answer2");
        const progressCount = document.getElementById("progressCount");
        const progressHint = document.getElementById("progressHint");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const help1Btn = document.getElementById("help1Btn");
        const help2Btn = document.getElementById("help2Btn");
        const choices1Btn = document.getElementById("choices1Btn");
        const choices2Btn = document.getElementById("choices2Btn");

        function renderScenarioList() {
            scenarioList.innerHTML = "";
            scenarios.forEach((scenario, index) => {
                const btn = document.createElement("button");
                btn.className = "scenario-btn" + (index === activeIndex ? " active" : "");
                const strong = document.createElement("strong");
                strong.textContent = `${index + 1}. ${scenario.title}`;
                const subtitle = document.createElement("span");
                subtitle.textContent = "2 prompts • use clue or choices";
                const status = document.createElement("span");
                status.className = "status-pill";
                if (responses[index].answer1.trim() || responses[index].answer2.trim()) {
                    status.textContent = "Started";
                    status.classList.add("done");
                } else {
                    status.textContent = "—";
                }
                btn.appendChild(strong);
                btn.appendChild(subtitle);
                btn.appendChild(status);
                btn.addEventListener("click", () => loadScenario(index));
                scenarioList.appendChild(btn);
            });
        }

        function loadScenario(index) {
            activeIndex = index;
            const scenario = scenarios[index];
            scenarioNumber.textContent = `Scenario ${index + 1}`;
            scenarioTitle.textContent = scenario.title;
            scenarioText.textContent = scenario.text;
            question1El.textContent = scenario.prompt1;
            question2El.textContent = scenario.prompt2;
            clue1El.textContent = scenario.clue1;
            clue2El.textContent = scenario.clue2;
            renderChoices(choices1El, scenario.choices1, answer1, scenario.clue1);
            renderChoices(choices2El, scenario.choices2, answer2, scenario.clue2);
            answer1.value = responses[index].answer1;
            answer2.value = responses[index].answer2;
            renderScenarioList();
            updateProgress();
            resetSupports();
        }

        function renderChoices(container, choices, targetTextarea, clueText) {
            container.innerHTML = "";
            choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "choice-btn";
                btn.textContent = choice;
                btn.addEventListener("click", () => insertChoice(choice, targetTextarea, clueText));
                container.appendChild(btn);
            });
        }

        function insertChoice(text, target, clueText) {
            const current = target.value.trim();
            if (!current) {
                target.value = text;
            } else {
                const replace = confirm("Use this choice to replace what you wrote? Click Cancel to add it instead.");
                target.value = replace ? text : `${current} ${text}`;
            }
            saveAnswers();
            target.focus();
        }

        function insertClue(text, target, clueEl) {
            const current = target.value.trim();
            target.value = current ? `${target.value} ${text}` : text;
            clueEl.classList.remove("hidden");
            saveAnswers();
            target.focus();
        }

        function toggleElement(el) {
            el.classList.toggle("hidden");
        }

        function resetSupports() {
            clue1El.classList.add("hidden");
            clue2El.classList.add("hidden");
            choices1El.classList.add("hidden");
            choices2El.classList.add("hidden");
        }

        function saveAnswers() {
            responses[activeIndex].answer1 = answer1.value;
            responses[activeIndex].answer2 = answer2.value;
            updateProgress();
            renderScenarioList();
        }

        function updateProgress() {
            const started = responses.filter(r => r.answer1.trim() || r.answer2.trim()).length;
            progressCount.textContent = `${started}/${scenarios.length} started`;
            const filled = responses.reduce((acc, r) => acc + (r.answer1.trim() ? 1 : 0) + (r.answer2.trim() ? 1 : 0), 0);
            progressHint.textContent = filled ? `${filled} prompts answered` : "Fill either prompt to log progress.";
        }

        [answer1, answer2].forEach(field => field.addEventListener("input", saveAnswers));

        prevBtn.addEventListener("click", () => {
            const newIndex = activeIndex === 0 ? scenarios.length - 1 : activeIndex - 1;
            loadScenario(newIndex);
        });

        nextBtn.addEventListener("click", () => {
            const newIndex = activeIndex === scenarios.length - 1 ? 0 : activeIndex + 1;
            loadScenario(newIndex);
        });

        help1Btn.addEventListener("click", () => insertClue(scenarios[activeIndex].clue1, answer1, clue1El));
        help2Btn.addEventListener("click", () => insertClue(scenarios[activeIndex].clue2, answer2, clue2El));
        choices1Btn.addEventListener("click", () => toggleElement(choices1El));
        choices2Btn.addEventListener("click", () => toggleElement(choices2El));

        renderScenarioList();
        loadScenario(0);
        updateProgress();
    </script>
</body>
</html>
