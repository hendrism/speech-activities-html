<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Both Perspectives</title>
    <script src="../../data/social.js"></script>
    <script src="../../js/data-loader.js"></script>
</head>

<body class="category-social">

    <header class="main-header">
        <div class="header-title">
            <span>🧠</span> Understanding Both Perspectives
        </div>
        <div>
            <a href="../../index.html" class="btn btn-outline" style="padding: 0.5rem 1rem; text-decoration: none;">Exit to
                Hub</a>
        </div>
    </header>

    <nav class="nav-scroller" id="navScroller">
        <!-- Generated via JS -->
    </nav>

    <main class="container" id="mainContent">
        <!-- Content Generated via JS -->
    </main>

    <script>
        // --- Data ---
        const scenarios = DataLoader.filter('social', 'scenarios', function(s) { return s.sourceFile === 'activities/social/understanding-both-perspectives.html'; });

        let currentIndex = 0;

        // --- render functions ---

        function init() {
            renderNav();
            renderScenario(0);
        }

        function renderNav() {
            const nav = document.getElementById('navScroller');
            nav.innerHTML = '';
            scenarios.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = `nav-item ${idx === currentIndex ? 'active' : ''}`;
                btn.textContent = `${idx + 1}. ${s.title}`;
                btn.onclick = () => {
                    currentIndex = idx;
                    renderNav(); // Update active state
                    renderScenario(idx);
                };
                nav.appendChild(btn);
            });
        }

        function renderScenario(index) {
            const data = scenarios[index];
            const container = document.getElementById('mainContent');

            // Note: In a real app we might want to preserve state/inputs when switching.
            // For now, we allow the browser to handle transient state or reset on switch.
            // (If persistence is needed in a static file, we'd store values in a JS object).

            container.innerHTML = `
                <div class="card fade-in">
                    <div class="scenario-header">
                        <div class="scenario-label">Scenario ${index + 1}</div>
                        <h2 class="scenario-title">${data.title}</h2>
                        <div class="scenario-text" style="white-space: pre-wrap;">${data.text}</div>
                    </div>

                    <!-- Part A: Your Perspective -->
                    <div class="section-container">
                        <div class="section-header part-a-header">
                            <span>👤</span>
                            <h3>Part A: Your Perspective</h3>
                        </div>

                        <div class="question-group">
                            <label class="question-label">1. What might you be thinking in this moment?</label>
                            <textarea placeholder="I might be thinking..."></textarea>
                        </div>

                        <div class="question-group">
                            <label class="question-label">2. How might you be feeling?</label>
                            <div class="feelings-grid" id="feelingsGrid">
                                ${data.feelings.map(f => `<button class="feeling-tag" onclick="toggleFeeling(this)">${f}</button>`).join('')}
                                <button class="feeling-tag" onclick="toggleOther(this)">Other...</button>
                            </div>
                            <input type="text" id="otherFeelingInput" style="display:none;" placeholder="Type other feeling here...">
                        </div>

                        <div class="question-group">
                            <label class="question-label">3. What would you want to say or do right away?</label>
                            <textarea placeholder="I would say/do..."></textarea>
                        </div>
                    </div>

                    <hr style="border: 0; border-top: 2px dashed var(--border); margin: 2rem 0;">

                    <!-- Part B: The Other Person's Perspective -->
                    <div class="section-container">
                        <div class="section-header part-b-header">
                            <span>👥</span>
                            <h3>Part B: The Other Person's Perspective</h3>
                        </div>

                        <div class="question-group">
                            <label class="question-label">4. What might the other person be thinking?</label>
                            <textarea placeholder="They might be thinking..."></textarea>
                        </div>

                        <div class="question-group">
                            <label class="question-label">5. Why might they feel annoyed, frustrated, or disappointed?</label>
                            <textarea placeholder="They might feel this way because..."></textarea>
                        </div>

                        <div class="question-group">
                            <label class="question-label">6. What are two other reasons their reaction might be happening (besides "you doing something wrong")?</label>
                            <div style="display:flex; flex-direction:column; gap: 0.5rem;">
                                <input type="text" placeholder="Reason 1...">
                                <input type="text" placeholder="Reason 2...">
                            </div>
                        </div>
                    </div>
                     
                    <hr style="border: 0; border-top: 2px dashed var(--border); margin: 2rem 0;">

                    <!-- Part C: Bigger Picture -->
                    <div class="section-container">
                        <div class="section-header part-c-header">
                            <span>🌍</span>
                            <h3>Part C: Bigger Picture</h3>
                        </div>

                        <div class="question-group">
                            <label class="question-label">7. Is this a small problem or a big problem? Why?</label>
                            <textarea placeholder="It is a ... problem because..."></textarea>
                        </div>

                        <div class="question-group">
                            <label class="question-label">8. Does this automatically mean they are trying to be mean to you?</label>
                            <div class="toggle-group" style="margin-bottom: 1rem;">
                                <div class="toggle-btn yes" onclick="selectMean(this, true)">Yes</div>
                                <div class="toggle-btn no" onclick="selectMean(this, false)">No</div>
                            </div>
                            <label class="question-label" style="font-size: 0.9rem;">Why?</label>
                            <input type="text" placeholder="Explain your answer...">
                        </div>

                        <div class="question-group">
                            <label class="question-label">9. What is one calm and reasonable response you could say?</label>
                            <textarea placeholder="I could say..."></textarea>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="nav-controls">
                        <button class="btn btn-outline" onclick="prevScenario()" ${index === 0 ? 'disabled' : ''}>Previous Scenario</button>
                        <button class="btn btn-primary" onclick="nextScenario()">${index === scenarios.length - 1 ? 'Finish' : 'Next Scenario'}</button>
                    </div>

                </div>
            `;

            // Scroll to top
            // window.scrollTo(0, 0);
        }

        function prevScenario() {
            if (currentIndex > 0) {
                currentIndex--;
                renderNav();
                renderScenario(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextScenario() {
            if (currentIndex < scenarios.length - 1) {
                currentIndex++;
                renderNav();
                renderScenario(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert("You have completed all scenarios! Great job thinking about both perspectives.");
            }
        }

        // --- Interaction Handlers ---

        window.toggleFeeling = function (btn) {
            btn.classList.toggle('selected');
        }

        window.toggleOther = function (btn) {
            btn.classList.toggle('selected');
            const input = document.getElementById('otherFeelingInput');
            input.style.display = btn.classList.contains('selected') ? 'block' : 'none';
            if (input.style.display === 'block') input.focus();
        }

        window.selectMean = function (btn, isYes) {
            // clear siblings
            const group = btn.parentElement;
            group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        // --- Start ---
        init();

    </script>
</body>

</html>
