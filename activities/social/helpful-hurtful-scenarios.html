<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpful vs Hurtful Responses — Speech Therapy</title>
    <script src="../../data/social.js"></script>
    <script src="../../js/data-loader.js"></script>

    <!-- Shared design system -->
    <link rel="stylesheet" href="../../css/styles.css">

    <style>
        body {
            background: #f8fafc;
        }

        .activity-header {
            text-align: center;
            color: var(--text-main);
            margin-bottom: var(--space-6);
        }

        .activity-header h1 {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
        }

        .scenario-box {
            background-color: var(--surface-100);
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
            border-left: 4px solid var(--color-primary);
        }

        .draggable-responses {
            display: flex;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
            justify-content: center;
            flex-wrap: wrap;
        }

        .response-card {
            background-color: var(--color-white);
            border: 2px solid var(--border-color);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            cursor: grab;
            user-select: none;
            font-size: var(--font-size-lg);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
            max-width: 45%;
            text-align: center;
        }

        .response-card:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        .response-card.dragging {
            opacity: 0.5;
        }

        .sorting-area {
            display: flex;
            gap: var(--space-4);
            margin-top: var(--space-4);
        }

        .drop-zone {
            flex: 1;
            min-height: 150px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--color-off-white);
            transition: background-color 0.2s;
        }

        .drop-zone.drag-over {
            background-color: var(--surface-100);
        }

        .helpful-zone {
            background-color: var(--color-success, #22c55e);
            border: 2px solid #16a34a;
        }

        .helpful-zone.drag-over {
            background-color: #16a34a;
            border-color: #15803d;
        }

        .hurtful-zone {
            background-color: var(--color-error, #ef4444);
            border: 2px solid #dc2626;
        }

        .hurtful-zone.drag-over {
            background-color: #dc2626;
            border-color: #b91c1c;
        }

        .zone-title {
            font-weight: 700;
            font-size: var(--font-size-xl);
            margin-bottom: var(--space-4);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Container for dropped items */
        .dropped-items {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            width: 100%;
        }

        .dropped-items .response-card {
            max-width: 100%;
            cursor: pointer;
            /* Can optionally click to put back, or just allow dragging back */
        }

        /* Sidebar Navigation styling */
        .nav-pills {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .nav-pill {
            padding: var(--space-3);
            border-radius: var(--radius-md);
            background-color: transparent;
            color: var(--text-main);
            font-size: var(--font-size-md);
            text-align: left;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .nav-pill:hover {
            background-color: var(--surface-100);
        }

        .nav-pill.active {
            background-color: var(--color-primary);
            color: var(--color-white);
            font-weight: 600;
            border-color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .layout-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .scenario-sidebar {
            width: 280px;
            background-color: white;
            border-right: 1px solid var(--border-color);
            padding: var(--space-6) var(--space-4);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            padding: var(--space-6) var(--space-4);
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="layout-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="scenario-sidebar">
            <h2
                style="font-size: var(--font-size-xl); font-weight: 700; margin-bottom: var(--space-4); color: var(--text-main); text-align: center;">
                Scenarios</h2>
            <div class="nav-pills" id="scenario-nav"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="activity-header">
                <h1>🗣️ Helpful or Hurtful?</h1>
                <p style="color: var(--text-secondary);">Sort the responses into the helpful or hurtful sides.</p>
            </div>

            <div class="container" style="max-width: 800px; margin: 0 auto;">
                <!-- Progress bar -->
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-label" id="progress-label"></div>

                <div class="card" id="card">
                    <!-- Dynamic content injected by JavaScript -->
                </div>

                <div class="flex-between mt-4">
                    <button class="btn btn-secondary" id="prev-btn" onclick="prevItem()">← Previous</button>
                    <button class="btn btn-secondary" onclick="resetItems()">🔄 Reset Responses</button>
                    <button class="btn btn-primary" id="next-btn" onclick="nextItem()">Next →</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Shared utilities -->
    <script src="../../js/utils.js"></script>

    <script>
        const ACTIVITY_DATA = DataLoader.filter('social', 'scenarios', function(s) { return s.sourceFile === 'activities/social/helpful-hurtful-scenarios.html'; });

        const state = {
            currentIndex: 0
        };

        function renderScenarioNav() {
            const navContainer = document.getElementById('scenario-nav');
            navContainer.innerHTML = '';

            ACTIVITY_DATA.forEach((item, index) => {
                const button = document.createElement('button');
                button.className = `nav-pill ${index === state.currentIndex ? 'active' : ''}`;
                button.textContent = item.name;
                button.onclick = () => {
                    state.currentIndex = index;
                    renderCard();
                    renderScenarioNav(); // update active class
                };
                navContainer.appendChild(button);
            });
        }

        function renderCard() {
            const item = ACTIVITY_DATA[state.currentIndex];
            const card = document.getElementById('card');

            // Update progress
            updateProgress(
                'progress-fill',
                state.currentIndex + 1,
                ACTIVITY_DATA.length,
                'progress-label'
            );

            // Randomize responses
            const randomizedResponses = shuffleArray([...item.responses]);

            card.innerHTML = `
                <h2 style="font-size: var(--font-size-2xl); font-weight: 700; margin-bottom: var(--space-4); text-align: center;">${item.name}</h2>
                
                <div class="scenario-box">
                    <strong>Scenario:</strong> ${item.scenario}
                </div>

                <p style="text-align: center; margin-bottom: var(--space-2); color: var(--text-secondary);">Drag the responses to the helpful or hurtful side:</p>

                <div class="draggable-responses" id="source-zone">
                    <div class="response-card" draggable="true" id="resp-0">${randomizedResponses[0]}</div>
                    <div class="response-card" draggable="true" id="resp-1">${randomizedResponses[1]}</div>
                </div>

                <div class="sorting-area">
                    <div class="drop-zone helpful-zone" id="helpful-zone">
                        <div class="zone-title helpful-title">Helpful ✅</div>
                        <div class="dropped-items"></div>
                    </div>
                    <div class="drop-zone hurtful-zone" id="hurtful-zone">
                        <div class="zone-title hurtful-title">Hurtful ❌</div>
                        <div class="dropped-items"></div>
                    </div>
                </div>
            `;

            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const draggables = document.querySelectorAll('.response-card');
            const dropZones = document.querySelectorAll('.drop-zone, #source-zone');

            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', () => {
                    draggable.classList.add('dragging');
                });

                draggable.addEventListener('dragend', () => {
                    draggable.classList.remove('dragging');
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', e => {
                    e.preventDefault(); // necessary to allow dropping
                    if (zone.classList.contains('drop-zone')) {
                        zone.classList.add('drag-over');
                    }
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    const draggable = document.querySelector('.dragging');
                    if (!draggable) return;

                    if (zone.id === 'source-zone') {
                        zone.appendChild(draggable);
                    } else {
                        const itemsContainer = zone.querySelector('.dropped-items');
                        itemsContainer.appendChild(draggable);
                    }
                });
            });
        }

        function resetItems() {
            // Re-render current card to reset
            renderCard();
        }

        function nextItem() {
            if (state.currentIndex < ACTIVITY_DATA.length - 1) {
                state.currentIndex++;
                renderCard();
                renderScenarioNav();
            }
        }

        function prevItem() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderCard();
                renderScenarioNav();
            }
        }

        // Initialize
        renderScenarioNav();
        renderCard();

    </script>
</body>

</html>
