<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Vocabulary Builder</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #6366f1;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
        }

        .sidebar-title {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .sidebar-subtitle {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .nav-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background: #f1f5f9;
        }

        .nav-item.active {
            background: #e0f2fe;
            color: var(--primary-dark);
            border-color: #bae6fd;
            font-weight: 600;
        }

        .nav-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .nav-item.completed .status-dot {
            background: var(--success);
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 32px;
            gap: 24px;
        }

        .activity-container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* Image Card */
        .visual-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 0;
        }

        .word-display {
            font-size: 2rem;
            margin: 0 0 16px;
            color: var(--primary-dark);
            font-weight: 800;
        }

        .main-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 12px;
            background: #f1f5f9;
            border: 1px solid var(--border);
        }

        .image-placeholder {
            width: 100%;
            height: 300px;
            background: #f1f5f9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border: 2px dashed #cbd5e1;
            padding: 20px;
        }

        /* Workspace */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .step-card.active {
            opacity: 1;
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.1);
        }

        .step-header {
            padding: 16px 24px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .step-card.active .step-header {
            background: linear-gradient(to right, #f0f9ff, #ffffff);
        }

        .step-title {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            background: #e2e8f0;
            color: #475569;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .step-card.active .step-number {
            background: var(--primary);
            color: white;
        }

        .step-card.completed .step-number {
            background: var(--success);
            color: white;
        }

        .step-content {
            padding: 24px;
            display: none;
        }

        .step-card.active .step-content {
            display: block;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .text-input {
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s;
            background: #fff;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .tools {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .tool-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .tool-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f0f9ff;
        }

        .tool-btn.active {
            background: #e0f2fe;
            color: var(--primary-dark);
            border-color: #bae6fd;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .choice-chip {
            padding: 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.2s;
        }

        .choice-chip:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .choice-chip.selected {
            background: #dcfce7;
            color: #166534;
            border-color: #22c55e;
        }

        .sentence-preview {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid var(--secondary);
            font-style: italic;
            color: var(--text-muted);
        }

        .sentence-preview strong {
            color: var(--text-main);
            font-style: normal;
        }

        .review-section {
            background: var(--surface);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .final-sentence {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .highlight {
            color: var(--primary-dark);
            font-weight: 600;
            background: #e0f2fe;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 900px) {
            .activity-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .main {
                padding: 16px;
            }

            .visual-card {
                position: static;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Winter Vocab</h1>
            <p class="sidebar-subtitle">Category & Attributes</p>
        </div>
        <div class="nav-list" id="navList">
            <!-- Nav items generated here -->
        </div>
    </div>

    <main class="main" id="mainContent">
        <!-- Content injected here -->
    </main>

    <script>
        // Utilities
        function genChoices(correct, pool) {
            const others = pool.filter(x => x !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
            const all = [correct, ...others].sort(() => Math.random() - 0.5);
            return all;
        }

        function getCommonCategories() {
            return ['Winter Weather', 'Winter Clothing', 'Winter Sport', 'Winter Tool', 'Winter Food', 'Household Item', 'Vehicle', 'Plant', 'Animal', 'Decoration'];
        }

        function getCommonFunctions() {
            return ['keeps you warm', 'falls from the sky', 'covers the ground', 'slides on snow', 'protects hands', 'clears snow', 'heats the room', 'protects feet'];
        }

        function getCommonAttributes() {
            return ['white', 'cold', 'hot', 'soft', 'hard', 'long', 'heavy', 'light', 'waterproof', 'sweet', 'round', 'wooden', 'metal', 'plastic'];
        }

        // Base Data
        const itemsData = [
            { id: 'snow', word: 'Snow', isPlural: false, cat: 'Winter Weather', func: 'covers the ground', attrs: ['White', 'Cold'], qAttrs: ['What color is it?', 'How does it feel?'], img: 'images/winter_items/snow_2.jpg' },
            { id: 'ice', word: 'Ice', isPlural: false, cat: 'Winter Weather', func: 'forms when water freezes', attrs: ['Hard', 'Slippery'], qAttrs: ['How does it feel?', 'Is it slippery or sticky?'], img: 'images/winter_items/ice_1.jpg' },
            { id: 'snowflake', word: 'Snowflake', isPlural: false, cat: 'Winter Weather', func: 'falls from the sky', attrs: ['Six-sided', 'Unique'], qAttrs: ['What is its shape?', 'Is it unique or identical?'], img: 'images/winter_items/snowflake.jpg' },
            { id: 'icicle', word: 'Icicle', isPlural: false, cat: 'Winter Weather', func: 'hangs from roofs', attrs: ['Pointed', 'Clear'], qAttrs: ['What is its shape?', 'What color is it?'], img: 'images/winter_items/icicle.jpg' },
            { id: 'frost', word: 'Frost', isPlural: false, cat: 'Winter Weather', func: 'forms on windows', attrs: ['Thin', 'Crystalline'], qAttrs: ['Is it thick or thin?', 'Describe the texture.'], img: 'images/winter_items/frost.jpg' },
            { id: 'blizzard', word: 'Blizzard', isPlural: false, cat: 'Winter Weather', func: 'blows snow with wind', attrs: ['Dangerous', 'Windy'], qAttrs: ['Is it safe or dangerous?', 'What is the weather like?'], img: 'images/winter_items/blizzard.jpg' },

            { id: 'coat', word: 'Coat', isPlural: false, cat: 'Winter Clothing', func: 'keeps you warm', attrs: ['Insulated', 'Heavy'], qAttrs: ['Is it thin or insulated?', 'Is it light or heavy?'], img: 'images/winter_items/winter-coat.png' },
            { id: 'scarf', word: 'Scarf', isPlural: false, cat: 'Winter Clothing', func: 'protects your neck', attrs: ['Woven', 'Soft'], qAttrs: ['What material is it?', 'How does it feel?'], img: 'images/winter_items/scarf.png' },
            { id: 'gloves', word: 'Gloves', isPlural: true, cat: 'Winter Clothing', func: 'cover your hands', attrs: ['Fitted', 'Warm'], qAttrs: ['How do they fit?', 'Do they keep you warm?'], img: 'images/winter_items/gloves.png' },
            { id: 'mittens', word: 'Mittens', isPlural: true, cat: 'Winter Clothing', func: 'keep hands cozy', attrs: ['Rounded', 'No-fingers'], qAttrs: ['What is the shape?', 'Do they have separate fingers?'], img: 'images/winter_items/mittens.png' },
            { id: 'boots', word: 'Boots', isPlural: true, cat: 'Winter Clothing', func: 'protect feet from snow', attrs: ['Waterproof', 'Tall'], qAttrs: ['Can water get in?', 'Are they short or tall?'], img: 'images/winter_items/boots.png' },
            { id: 'hat', word: 'Hat', isPlural: false, cat: 'Winter Clothing', func: 'keeps head warm', attrs: ['Knitted', 'Stretchy'], qAttrs: ['What is it made of?', 'Is it stiff or stretchy?'], img: 'images/winter_items/winter-hat.jpg' },

            { id: 'sled', word: 'Sled', isPlural: false, cat: 'Winter Recreation', func: 'slides downhill', attrs: ['Smooth', 'Fast'], qAttrs: ['How is the bottom?', 'Does it go slow or fast?'], img: 'images/winter_items/sled.jpg' },
            { id: 'skis', word: 'Skis', isPlural: true, cat: 'Winter Recreation', func: 'glide over snow', attrs: ['Long', 'Paired'], qAttrs: ['Are they short or long?', 'Do you use one or two?'], img: 'images/winter_items/skis.jpg' },
            { id: 'iceskates', word: 'Ice Skates', isPlural: true, cat: 'Winter Recreation', func: 'glide on ice', attrs: ['Bladed', 'Sharp'], qAttrs: ['What is on the bottom?', 'Is the blade dull or sharp?'], img: 'images/new_winter_items/ice_skates.jpg' },
            { id: 'snowboard', word: 'Snowboard', isPlural: false, cat: 'Winter Recreation', func: 'slides sideways on snow', attrs: ['Wide', 'Curved'], qAttrs: ['Is it narrow or wide?', 'Is the edge straight or curved?'], img: 'images/new_winter_items/snowboard.jpg' },
            { id: 'hockeystick', word: 'Hockey Stick', isPlural: false, cat: 'Winter Recreation', func: 'hits a puck', attrs: ['Long-handled', 'Angled'], qAttrs: ['Describe the handle.', 'Is it straight or angled?'], img: 'images/winter_items/hockey_stick.jpg' },

            { id: 'snowball', word: 'Snowball', isPlural: false, cat: 'Winter Activity', func: 'is thrown for fun', attrs: ['Round', 'Compact'], qAttrs: ['What shape is it?', 'Is it loose or compact?'], img: 'images/winter_items/snowball.jpg' },
            { id: 'snowman', word: 'Snowman', isPlural: false, cat: 'Winter Activity', func: 'is built from three balls', attrs: ['Three-tiered', 'Cold'], qAttrs: ['How is it built?', 'How does it feel?'], img: 'images/winter_items/snowman.jpg' },
            { id: 'snowfort', word: 'Snow Fort', isPlural: false, cat: 'Winter Activity', func: 'provides shelter', attrs: ['Hollow', 'Protective'], qAttrs: ['Is it solid or hollow?', 'What does it do?'], img: 'images/winter_items/snow_fort.png' },

            { id: 'shovel', word: 'Shovel', isPlural: false, cat: 'Winter Tool', func: 'scoops snow', attrs: ['Long-handled', 'Metal-edged'], qAttrs: ['Describe the handle.', 'Describe the edge.'], img: 'images/winter_items/snow-shovel.jpg' },
            { id: 'snowplow', word: 'Snowplow', isPlural: false, cat: 'Winter Vehicle', func: 'pushes snow off roads', attrs: ['Large', 'Heavy-duty'], qAttrs: ['Is it small or large?', 'Is it weak or heavy-duty?'], img: 'images/winter_items/snow_plow.jpg' },
            { id: 'icescraper', word: 'Ice Scraper', isPlural: false, cat: 'Winter Tool', func: 'clears car windows', attrs: ['Flat', 'Rigid'], qAttrs: ['Is it round or flat?', 'Is it floppy or rigid?'], img: 'images/winter_items/ice_scraper.png' },

            { id: 'fireplace', word: 'Fireplace', isPlural: false, cat: 'Indoor Comfort', func: 'warms the house', attrs: ['Hot', 'Brick'], qAttrs: ['Is it cold or hot?', 'What is it often made of?'], img: 'images/winter_items/fireplace.png' },
            { id: 'blanket', word: 'Blanket', isPlural: false, cat: 'Indoor Comfort', func: 'keeps you cozy', attrs: ['Soft', 'Thick'], qAttrs: ['How does it feel?', 'Is it thin or thick?'], img: 'images/winter_items/blanket.png' },
            { id: 'heater', word: 'Space Heater', isPlural: false, cat: 'Indoor Comfort', func: 'blows hot air', attrs: ['Portable', 'Electric'], qAttrs: ['Can you move it easily?', 'How is it powered?'], img: 'images/winter_items/space_heater.png' },

            { id: 'hotcocoa', word: 'Hot Chocolate', isPlural: false, cat: 'Winter Beverage', func: 'warms you up', attrs: ['Sweet', 'Chocolatey'], qAttrs: ['How does it taste?', 'What is the flavor?'], img: 'images/compare_contrast_seasonal/hot_chocolate_1.jpg' },
            { id: 'soup', word: 'Soup', isPlural: false, cat: 'Winter Food', func: 'fills your belly', attrs: ['Savory', 'Hot'], qAttrs: ['Is it sweet or savory?', 'Is it cold or hot?'], img: 'images/winter_items/soup.jpg' },
            { id: 'thermos', word: 'Thermos', isPlural: false, cat: 'Winter Container', func: 'keeps drinks hot', attrs: ['Insulated', 'Metal'], qAttrs: ['Why does it work?', 'What is it made of?'], img: 'images/winter_items/thermos.jpg' },

            { id: 'pinetree', word: 'Pine Tree', isPlural: false, cat: 'Winter Plant', func: 'stays green all year', attrs: ['Evergreen', 'Prickly'], qAttrs: ['What kind of tree is it?', 'Do the needles feel soft or prickly?'], img: 'images/winter_items/pine_tree.png' },
            { id: 'cardinal', word: 'Cardinal', isPlural: false, cat: 'Winter Bird', func: 'flies in winter', attrs: ['Red', 'Feathered'], qAttrs: ['What color is it?', 'What covers its body?'], img: 'images/winter_items/cardinal.jpg' }
        ];

        // Process entries to add choices
        const entries = itemsData.map(item => {
            return {
                id: item.id,
                word: item.word,
                image: item.img,
                isPlural: item.isPlural,
                category: {
                    answer: item.cat,
                    choices: genChoices(item.cat, getCommonCategories())
                },
                function: {
                    answer: item.func,
                    choices: genChoices(item.func, getCommonFunctions())
                },
                attributes: [
                    {
                        question: item.qAttrs[0],
                        answer: item.attrs[0],
                        choices: genChoices(item.attrs[0], getCommonAttributes())
                    },
                    {
                        question: item.qAttrs[1],
                        answer: item.attrs[1],
                        choices: genChoices(item.attrs[1], getCommonAttributes())
                    }
                ]
            };
        });

        let currentEntry = entries[0];
        let userAnswers = {};

        // DOM Elements
        const navList = document.getElementById('navList');
        const mainContent = document.getElementById('mainContent');

        function init() {
            renderNav();
            loadEntry(entries[0].id);
        }

        function renderNav() {
            navList.innerHTML = '';
            entries.forEach(entry => {
                const item = document.createElement('div');
                item.className = `nav-item ${entry.id === currentEntry.id ? 'active' : ''}`;
                item.onclick = () => loadEntry(entry.id);
                item.innerHTML = `
                    <span>${entry.word}</span>
                    <div class="status-dot"></div>
                `;
                navList.appendChild(item);
            });
        }

        function loadEntry(id) {
            currentEntry = entries.find(e => e.id === id);
            userAnswers = {
                category: '',
                function: '',
                attr1: '',
                attr2: ''
            };
            renderNav();
            renderActivity();
        }

        function renderActivity() {
            // Check if image is placeholder
            let imgHtml = '';
            if (currentEntry.image) {
                imgHtml = `<img src="${currentEntry.image}" class="main-image" alt="${currentEntry.word}">`;
            } else {
                imgHtml = `<div class="image-placeholder">No Image Available</div>`;
            }

            // Grammar helpers
            const verbDo = currentEntry.isPlural ? 'do' : 'does';
            const verbBe = currentEntry.isPlural ? 'are' : 'is';
            const pronoun = currentEntry.isPlural ? 'They' : 'It';
            const pronounObj = currentEntry.isPlural ? 'them' : 'it'; // not used yet but handy

            // Step 1 Sentence
            const catSentence = currentEntry.isPlural
                ? `${currentEntry.word} are a type of <span id="catPreview">________</span>.`
                : `${currentEntry.word} is a type of <span id="catPreview">________</span>.`;

            // Step 2 Sentence
            const funcSentence = `${pronoun} <span id="funcPreview">________</span>.`;

            // Step 3 Sentence
            const attrSentence = `${pronoun} ${verbBe} <span id="attr1Preview">________</span> and <span id="attr2Preview">________</span>.`;

            mainContent.innerHTML = `
                <div class="activity-container">
                    <div class="visual-card">
                        <div class="word-display">${currentEntry.word}</div>
                        ${imgHtml}
                    </div>
                    
                    <div class="workspace">
                        <!-- Step 1: Category -->
                        <div class="step-card active" id="step1">
                            <div class="step-header" onclick="toggleStep('step1')">
                                <div class="step-title">
                                    <div class="step-number">1</div>
                                    Category
                                </div>
                            </div>
                            <div class="step-content">
                                <div class="question-text">What category ${verbDo} ${currentEntry.word} belong to?</div>
                                <div class="input-group">
                                    <input type="text" class="text-input" id="catInput" 
                                        placeholder="Type to add category..." oninput="updatePreview('cat', this.value)">
                                    <div class="tools">
                                        <button class="tool-btn" id="catBtn" onclick="toggleChoices('cat')">Show Ideas</button>
                                    </div>
                                    <div class="choices-grid hidden" id="catChoices"></div>
                                    <div class="sentence-preview">
                                        Sentence: <strong>${catSentence}</strong>
                                    </div>
                                    <div style="text-align: right; margin-top: 10px;">
                                        <button class="primary-btn" onclick="nextStep('step1', 'step2')">Next</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step 2: Function -->
                        <div class="step-card" id="step2">
                            <div class="step-header" onclick="toggleStep('step2')">
                                <div class="step-title">
                                    <div class="step-number">2</div>
                                    Function vs. Feature
                                </div>
                            </div>
                            <div class="step-content">
                                <div class="question-text">What ${verbDo} ${currentEntry.word} do?</div>
                                <div class="input-group">
                                    <input type="text" class="text-input" id="funcInput" 
                                        placeholder="Type to add function..." oninput="updatePreview('func', this.value)">
                                    <div class="tools">
                                        <button class="tool-btn" id="funcBtn" onclick="toggleChoices('func')">Show Ideas</button>
                                    </div>
                                    <div class="choices-grid hidden" id="funcChoices"></div>
                                    <div class="sentence-preview">
                                        Sentence: <strong>${funcSentence}</strong>
                                    </div>
                                    <div style="text-align: right; margin-top: 10px;">
                                        <button class="primary-btn" onclick="nextStep('step2', 'step3')">Next</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step 3: Attributes -->
                        <div class="step-card" id="step3">
                            <div class="step-header" onclick="toggleStep('step3')">
                                <div class="step-title">
                                    <div class="step-number">3</div>
                                    Attributes (Details)
                                </div>
                            </div>
                            <div class="step-content">
                                <p style="margin-bottom:20px; color:var(--text-muted);">Describe two features (think about color, size, shape, feel, etc).</p>
                                
                                <!-- Attr 1 -->
                                <div style="margin-bottom: 24px;">
                                    <div class="question-text">Detail 1:</div>
                                    <div class="input-group">
                                        <div style="font-size:0.9rem; color:#64748b; font-style:italic; margin-bottom:5px;">Hint: ${currentEntry.attributes[0].question}</div>
                                        <input type="text" class="text-input" id="attr1Input" 
                                            placeholder="Type a detail..." oninput="updatePreview('attr', this.value)">
                                        <div class="tools">
                                            <button class="tool-btn" id="attr1Btn" onclick="toggleChoices('attr1')">Show Ideas</button>
                                        </div>
                                        <div class="choices-grid hidden" id="attr1Choices"></div>
                                    </div>
                                </div>

                                <!-- Attr 2 -->
                                <div>
                                    <div class="question-text">Detail 2:</div>
                                    <div class="input-group">
                                        <div style="font-size:0.9rem; color:#64748b; font-style:italic; margin-bottom:5px;">Hint: ${currentEntry.attributes[1].question}</div>
                                        <input type="text" class="text-input" id="attr2Input" 
                                            placeholder="Type a detail..." oninput="updatePreview('attr', this.value)">
                                        <div class="tools">
                                            <button class="tool-btn" id="attr2Btn" onclick="toggleChoices('attr2')">Show Ideas</button>
                                        </div>
                                        <div class="choices-grid hidden" id="attr2Choices"></div>
                                    </div>
                                </div>

                                <div class="sentence-preview" style="margin-top: 20px;">
                                    Sentence: <strong>${attrSentence}</strong>
                                </div>
                                <div style="text-align: right; margin-top: 10px;">
                                    <button class="primary-btn" onclick="finalize()">Create Definition</button>
                                </div>
                            </div>
                        </div>

                        <!-- Review -->
                        <div class="review-section hidden" id="reviewSection">
                            <h3 style="margin-top:0">Final Definition</h3>
                            <div class="final-sentence" id="finalText"></div>
                            <button class="primary-btn" onclick="reset()">Do Another Word</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Logic Functions
        function toggleStep(id) {
            document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function nextStep(currentId, nextId) {
            document.getElementById(currentId).classList.add('completed');
            toggleStep(nextId);
        }

        function toggleChoices(type) {
            const grid = document.getElementById(`${type}Choices`);
            const btn = document.getElementById(`${type}Btn`);

            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                btn.textContent = 'Hide Ideas';
                btn.classList.add('active');

                // If empty, generate
                if (grid.children.length === 0) {
                    generateChoicesUI(type, grid);
                }
            } else {
                grid.classList.add('hidden');
                btn.textContent = 'Show Ideas';
                btn.classList.remove('active');
            }
        }

        function generateChoicesUI(type, container) {
            let choices = [];
            if (type === 'cat') choices = currentEntry.category.choices;
            if (type === 'func') choices = currentEntry.function.choices;
            if (type === 'attr1') choices = currentEntry.attributes[0].choices;
            if (type === 'attr2') choices = currentEntry.attributes[1].choices;

            container.innerHTML = choices.map(c =>
                `<div class="choice-chip" onclick="selectChoice('${type}', '${c}')">${c}</div>`
            ).join('');
        }

        function selectChoice(type, value) {
            if (type === 'cat') {
                document.getElementById('catInput').value = value;
                updatePreview('cat', value);
                toggleChoices('cat'); // auto-hide on select
            }
            if (type === 'func') {
                document.getElementById('funcInput').value = value;
                updatePreview('func', value);
                toggleChoices('func');
            }
            if (type === 'attr1') {
                document.getElementById('attr1Input').value = value;
                updatePreview('attr');
                toggleChoices('attr1');
            }
            if (type === 'attr2') {
                document.getElementById('attr2Input').value = value;
                updatePreview('attr');
                toggleChoices('attr2');
            }
        }

        function updatePreview(type, val) {
            if (type === 'cat') {
                document.getElementById('catPreview').textContent = val || '________';
                userAnswers.category = val;
            }
            if (type === 'func') {
                document.getElementById('funcPreview').textContent = val || '________';
                userAnswers.function = val;
            }
            if (type === 'attr') {
                const a1 = document.getElementById('attr1Input').value;
                const a2 = document.getElementById('attr2Input').value;
                document.getElementById('attr1Preview').textContent = a1 || '________';
                document.getElementById('attr2Preview').textContent = a2 || '________';
                userAnswers.attr1 = a1;
                userAnswers.attr2 = a2;
            }
        }

        function finalize() {
            document.getElementById('step3').classList.add('completed');
            document.getElementById('step3').classList.remove('active');
            document.getElementById('reviewSection').classList.remove('hidden');

            const cat = userAnswers.category.trim();
            const func = userAnswers.function.trim();
            const a1 = userAnswers.attr1.trim();
            const a2 = userAnswers.attr2.trim();

            // Construct sentences
            let s1 = `${currentEntry.word} is a type of <span class="highlight">${cat}</span>.`;
            // Simple vowel check
            if (['a', 'e', 'i', 'o', 'u'].includes(cat[0]?.toLowerCase())) {
                s1 = `${currentEntry.word} is an <span class="highlight">${cat}</span>.`;
            } else {
                s1 = `${currentEntry.word} is a <span class="highlight">${cat}</span>.`;
            }
            // Just use generic phrasing if it's broad
            if (cat.toLowerCase().includes('winter') || cat.toLowerCase().includes('clothing')) {
                s1 = `${currentEntry.word} is a type of <span class="highlight">${cat}</span>.`;
            }

            let s2 = `It <span class="highlight">${func}</span>.`;
            if (func.toLowerCase().startsWith('used')) {
                s2 = `It is <span class="highlight">${func}</span>.`;
            }

            let s3 = `It is <span class="highlight">${a1}</span> and <span class="highlight">${a2}</span>.`;

            document.getElementById('finalText').innerHTML = `${s1} ${s2} ${s3}`;
        }

        function reset() {
            loadEntry(currentEntry.id);
        }

        // Init
        init();

    </script>
</body>

</html>
