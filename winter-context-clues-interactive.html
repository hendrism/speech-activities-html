<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Context Clues Challenge</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #8b5cf6;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
        }

        .sidebar-title {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .sidebar-subtitle {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .nav-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background: #f1f5f9;
        }

        .nav-item.active {
            background: #e0f2fe;
            color: var(--primary-dark);
            border-color: #bae6fd;
            font-weight: 600;
        }

        .nav-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .nav-item.completed .status-dot {
            background: var(--success);
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 32px;
            gap: 24px;
        }

        /* Main Layout Grid */
        .activity-container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 32px;
            align-items: start;
        }

        /* Visual Card */
        .visual-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .visual-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            max-height: 600px;
            object-fit: contain;
        }

        .visual-caption {
            margin-top: 20px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Main Work Area */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .passage-text {
            font-size: 1.25rem;
            line-height: 1.8;
            background: #f0f9ff;
            padding: 24px;
            border-radius: 12px;
            border-left: 5px solid var(--primary);
            margin-bottom: 30px;
        }

        .passage-line {
            margin-bottom: 8px;
            display: block;
        }

        .questions-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed var(--border);
        }

        .question-block {
            margin-bottom: 24px;
        }

        .question-label {
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .text-input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.1rem;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        textarea.text-input {
            min-height: 80px;
            resize: vertical;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Sentence Frame Styles - Original Look */
        .sentence-frame {
            background: #fef3c7;
            border-left: 6px solid #f59e0b;
            padding: 24px;
            border-radius: 12px;
            margin-top: 24px;
            margin-bottom: 24px;
        }

        .sentence-frame-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #b45309;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .frame-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #92400e;
            margin-bottom: 8px;
        }

        .frame-input-large {
            width: 100%;
            padding: 16px;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1.2rem;
            background: white;
            margin-bottom: 20px;
            min-height: 80px;
            resize: vertical;
            display: block;
        }

        .frame-input-large:focus {
            outline: none;
            border-color: #d97706;
            background: #fffbeb;
        }

        .inline-sentence {
            font-size: 1.25rem;
            line-height: 2.2;
            color: #78350f;
            font-weight: 500;
        }

        .inline-input {
            padding: 12px;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1.2rem;
            background: white;
            min-width: 100%;
            /* Full width for multi-line feel */
            min-height: 60px;
            /* Give it some height */
            transition: border-color 0.2s;
            display: block;
            /* Stack them for better multi-line layout */
            margin: 10px 0;
            resize: vertical;
        }

        .inline-input:focus {
            outline: none;
            border-color: #d97706;
            background: #fffbeb;
        }

        /* Reveal Section */
        .reveal-section {
            margin-top: 30px;
            background: #fdf4ff;
            /* Light purple bg */
            border: 2px solid #ddd6fe;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            display: none;
        }

        .reveal-section.visible {
            display: block;
            animation: slideUp 0.5s ease;
        }

        .definition-box {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 10px;
            margin-top: 10px;
        }

        .student-response-box {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
            font-size: 1.1rem;
            color: #475569;
        }

        .student-response-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .student-response-text {
            color: #334155;
            line-height: 1.6;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-check {
            width: 100%;
            margin-top: 10px;
            background: var(--secondary);
            font-size: 1.1rem;
            padding: 16px;
        }

        .btn-check:hover {
            background: #7c3aed;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 900px) {
            .activity-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .visual-card {
                position: static;
                margin-bottom: 20px;
            }

            .main {
                padding: 16px;
            }

            .inline-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Context Clues</h1>
            <p class="sidebar-subtitle">Winter Edition</p>
        </div>
        <div class="nav-list" id="navList">
            <!-- Nav items generated here -->
        </div>
    </div>

    <main class="main" id="mainContent">
        <!-- Content injected here -->
    </main>

    <script>
        const entries = [
            {
                id: 'orderly',
                word: 'Orderly',
                text: [
                    "Ben walked into his room after playing in the snow.",
                    "His boots were by the door.",
                    "His hat was on the floor.",
                    "His gloves were on the bed.",
                    "Ben picked things up and put them where they belonged.",
                    "Ben wanted his room to be orderly."
                ],
                questions: [
                    { q: "What is on the floor and bed?", hint: "Look at sentence 3 and 4." },
                    { q: "What does Ben start to do?", hint: "Look at sentence 5." }
                ],
                def: "neat and organized",
                evidence: "The room had his hat and gloves everywhere, and Ben picked them up.",
                img: 'images/winter_context_clues/orderly.png',
                frameHelp: [
                    "The word orderly probably means:",
                    "I know this because the room had [blank] and Ben [blank]."
                ]
            },
            {
                id: 'exhausted',
                word: 'Exhausted',
                text: [
                    "Maya played in the snow.",
                    "She made a snowman.",
                    "Then she had a snowball fight.",
                    "Then she walked home in her boots.",
                    "She sat on the couch and did not move.",
                    "Maya was exhausted."
                ],
                questions: [
                    { q: "What did Maya do outside?", hint: "She did three active things." },
                    { q: "What did she do when she got home?", hint: "She sat down." }
                ],
                def: "very tired",
                evidence: "Maya played hard and then sat on the couch without moving.",
                img: 'images/winter_context_clues/exhausted.png',
                frameHelp: [
                    "The word exhausted probably means:",
                    "I know this because Maya [blank] and then she [blank]."
                ]
            },
            {
                id: 'tiny',
                word: 'Tiny',
                text: [
                    "Dad opened the door on a cold day.",
                    "A snowflake landed on his glove.",
                    "It was very small.",
                    "It was smaller than a bead.",
                    "The snowflake was tiny."
                ],
                questions: [
                    { q: "Where did the snowflake land?", hint: "On his clothing." },
                    { q: "How big is it?", hint: "Compare it to a bead." }
                ],
                def: "very small",
                evidence: "The snowflake was smaller than a bead.",
                img: 'images/winter_context_clues/tiny.png',
                frameHelp: [
                    "The word tiny probably means:",
                    "I know this because the snowflake was [blank] and [blank]."
                ]
            },
            {
                id: 'frustrated',
                word: 'Frustrated',
                text: [
                    "Leo put on his winter coat.",
                    "He tried to zip it up.",
                    "The zipper got stuck.",
                    "He pulled and pulled.",
                    "It still did not move.",
                    "Leo felt frustrated."
                ],
                questions: [
                    { q: "What is Leo trying to do?", hint: "Fix his coat." },
                    { q: "Does it work?", hint: "Did it move?" }
                ],
                def: "upset because you can't do something",
                evidence: "The zipper was stuck and wouldn't move even when he pulled.",
                img: 'images/winter_context_clues/frustrated.png',
                frameHelp: [
                    "The word frustrated probably means:",
                    "I know this because Leo tried to [blank] and it [blank]."
                ]
            },
            {
                id: 'generous',
                word: 'Generous',
                text: [
                    "Ava had a cup of hot chocolate.",
                    "Her friend did not have one.",
                    "Ava shared her drink.",
                    "She gave her friend half.",
                    "Ava was generous."
                ],
                questions: [
                    { q: "What did Ava have?", hint: "A warm drink." },
                    { q: "What did she do with it?", hint: "She didn't keep it all." }
                ],
                def: "kind and ready to share",
                evidence: "Ava shared her drink with a friend who didn't have one.",
                img: 'images/winter_context_clues/generous.png',
                frameHelp: [
                    "The word generous probably means:",
                    "I know this because Ava [blank] and [blank]."
                ]
            },
            {
                id: 'nervous',
                word: 'Nervous',
                text: [
                    "Sam stood at the top of the big sled hill.",
                    "The hill was high.",
                    "His hands were tight on the sled.",
                    "He did not move right away.",
                    "Sam felt nervous."
                ],
                questions: [
                    { q: "Where is Sam standing?", hint: "Top of the hill." },
                    { q: "What is his body doing?", hint: "Hands are tight, not moving." }
                ],
                def: "worried or scared",
                evidence: "The hill was high and he was holding tight and not moving.",
                img: 'images/winter_context_clues/nervous.png',
                frameHelp: [
                    "The word nervous probably means:",
                    "I know this because Sam [blank] and [blank]."
                ]
            },
            {
                id: 'careful',
                word: 'Careful',
                text: [
                    "Lena carried a mug of hot soup.",
                    "The floor was wet from snow.",
                    "She walked very slowly.",
                    "She held the mug with two hands.",
                    "Lena was being careful."
                ],
                questions: [
                    { q: "What is Lena carrying?", hint: "Hot soup." },
                    { q: "How is she walking?", hint: "Speed?" }
                ],
                def: "taking care to avoid danger or mistakes",
                evidence: "She walked slowly and held the hot mug with two hands.",
                img: 'images/winter_context_clues/careful.png',
                frameHelp: [
                    "The word careful probably means:",
                    "I know this because Lena [blank] and [blank]."
                ]
            },
            {
                id: 'proud',
                word: 'Proud',
                text: [
                    "Eli built a big snowman.",
                    "He rolled the snow by himself.",
                    "He put on the hat and scarf.",
                    "His dad said, \"That looks great!\"",
                    "Eli felt proud."
                ],
                questions: [
                    { q: "What did Eli build?", hint: "A snowman." },
                    { q: "What did his dad say?", hint: "A compliment." }
                ],
                def: "feeling happy about something you did",
                evidence: "He built it himself and his dad liked it.",
                img: 'images/winter_context_clues/proud.png',
                frameHelp: [
                    "The word proud probably means:",
                    "I know this because Eli [blank] and his dad [blank]."
                ]
            },
            {
                id: 'confused',
                word: 'Confused',
                text: [
                    "The teacher said to put on boots, coats, and hats.",
                    "The class lined up to go outside.",
                    "Everyone got ready.",
                    "Jake only put on his hat and stood there.",
                    "He looked around at the other kids.",
                    "Jake was confused."
                ],
                questions: [
                    { q: "What were the students supposed to put on?", hint: "Three things." },
                    { q: "What did Jake do instead?", hint: "Just one thing." }
                ],
                def: "unable to understand clearly",
                evidence: "He didn't follow all the instructions and looked around at others.",
                img: 'images/winter_context_clues/confused.png',
                frameHelp: [
                    "The word confused probably means:",
                    "I know this because the teacher [blank] and Jake [blank]."
                ]
            },
            {
                id: 'relieved',
                word: 'Relieved',
                text: [
                    "Nina could not find her gloves.",
                    "Her hands were cold.",
                    "She looked in her bag and on the floor.",
                    "Then she saw the gloves in her coat pocket.",
                    "Nina smiled.",
                    "She felt relieved."
                ],
                questions: [
                    { q: "What did Nina lose?", hint: "Her gloves." },
                    { q: "Where did she find it?", hint: "In her pocket." }
                ],
                def: "feeling happy that something bad is over",
                evidence: "She was worried about her lost gloves but then found them.",
                img: 'images/winter_context_clues/relieved.png',
                frameHelp: [
                    "The word relieved probably means:",
                    "I know this because Nina [blank] and then she [blank]."
                ]
            }
        ];

        let currentEntryId = 'orderly';
        const navList = document.getElementById('navList');
        const mainContent = document.getElementById('mainContent');

        function init() {
            renderNav();
            loadEntry(entries[0].id);
        }

        function renderNav() {
            navList.innerHTML = '';
            entries.forEach(entry => {
                const item = document.createElement('div');
                item.className = `nav-item ${entry.id === currentEntryId ? 'active' : ''}`;
                item.onclick = () => loadEntry(entry.id);
                item.innerHTML = `
                    <span>Passage ${entries.indexOf(entry) + 1}</span>
                    <div class="status-dot"></div>
                `;
                navList.appendChild(item);
            });
        }

        function loadEntry(id) {
            currentEntryId = id;
            const entry = entries.find(e => e.id === id);

            // Highlight the target word
            const textHTML = entry.text.map(line => {
                if (line.toLowerCase().includes(entry.word.toLowerCase())) {
                    return `<span class="passage-line"><strong>${line}</strong></span>`;
                }
                return `<span class="passage-line">${line}</span>`;
            }).join('');

            renderNav();

            // Build the dynamic sentence frame
            const framePart1 = entry.frameHelp[0];
            const framePart2 = entry.frameHelp[1]; // Contains [blank] markers

            // Replace [blank] with textarea fields
            const sentenceWithInputs = framePart2.split('[blank]').map((part, i, arr) => {
                if (i === arr.length - 1) return part;
                return `${part}<textarea class="inline-input" placeholder="Type answer..."></textarea>`;
            }).join('');

            mainContent.innerHTML = `
                <div class="activity-container">
                    <!-- Left: Visual -->
                    <div class="visual-card">
                        <img src="${entry.img}" class="visual-image" alt="${entry.word}">
                        <div class="visual-caption">?</div>
                    </div>

                    <!-- Right: Work -->
                    <div class="card">
                        <div class="passage-text">
                            ${textHTML}
                        </div>

                        <div class="questions-area">
                            <div class="question-block">
                                <div class="question-label">1. ${entry.questions[0].q}</div>
                                <textarea class="text-input" placeholder="Type answer..."></textarea>
                            </div>
                            <div class="question-block">
                                <div class="question-label">2. ${entry.questions[1].q}</div>
                                <textarea class="text-input" placeholder="Type answer..."></textarea>
                            </div>
                            
                            <!-- Sentence Frames -->
                            <div class="sentence-frame">
                                <div class="sentence-frame-title">📝 Sentence Frame</div>
                                
                                <div class="frame-label">${framePart1}</div>
                                <textarea class="frame-input-large" placeholder="Type meaning here..."></textarea>
                                
                                <div class="inline-sentence" style="margin-top: 20px;">
                                    ${sentenceWithInputs}
                                </div>
                            </div>

                            <button class="btn btn-check" onclick="revealAnswer()">Check Meaning</button>
                        </div>

                        <div class="reveal-section" id="revealSection">
                            <div style="font-size: 0.9rem; color: #666; text-transform: uppercase; letter-spacing: 1px;">The word is</div>
                            <div style="font-size: 2rem; font-weight: 800; color: var(--secondary); margin: 5px 0;">${entry.word}</div>
                            <div class="definition-box">Means: <strong>${entry.def}</strong></div>
                             <div style="font-size: 1.1rem; color: #475569; font-style: italic; margin-top:10px;">
                                Context Clue: ${entry.evidence}
                            </div>
                            
                            <div class="student-response-box">
                                <span class="student-response-label">Your Sentence:</span>
                                <div class="student-response-text" id="studentSentenceOutput"></div>
                            </div>

                            <div style="margin-top: 20px;">
                                <button class="btn" onclick="nextEntry()">Next Passage &rarr;</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function revealAnswer() {
            // Get user inputs
            const inputs = document.querySelectorAll('.inline-input');
            const meaningInput = document.querySelector('.frame-input-large');
            const entry = entries.find(e => e.id === currentEntryId);

            // Part 1: Definition Guess
            const part1Label = entry.frameHelp[0];
            const part1Value = meaningInput.value.trim() || "______";

            // Part 2: Context Clues
            const messageParts = entry.frameHelp[1].split('[blank]');
            let part2Sentence = "";

            // Reconstruct sentence interleaving static text and user input
            messageParts.forEach((part, index) => {
                part2Sentence += part;
                if (index < inputs.length) {
                    const val = inputs[index].value.trim() || "______";
                    part2Sentence += `<strong style="color: var(--primary-dark); border-bottom: 2px solid var(--primary-dark);">${val}</strong>`;
                }
            });

            // Combine into full response
            const fullResponse = `
                <div style="margin-bottom: 8px;">
                    ${part1Label} <strong style="color: var(--primary-dark); border-bottom: 2px solid var(--primary-dark);">${part1Value}</strong>
                </div>
                <div>${part2Sentence}</div>
            `;

            document.getElementById('studentSentenceOutput').innerHTML = fullResponse;

            document.getElementById('revealSection').classList.add('visible');
            document.querySelector('.visual-caption').textContent = entry.word;
            document.querySelector('.visual-caption').style.color = '#10b981'; // Green
        }

        function nextEntry() {
            const idx = entries.findIndex(e => e.id === currentEntryId);
            if (idx < entries.length - 1) {
                loadEntry(entries[idx + 1].id);
                document.querySelector('.main').scrollTop = 0;
            }
        }

        // Start
        init();

    </script>
</body>

</html>
