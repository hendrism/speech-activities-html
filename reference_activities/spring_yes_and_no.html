<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Questions Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f0fdf4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            color: #166534;
        }

        .question-card {
            transition: all 0.3s ease;
        }

        .btn-choice {
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-choice:active {
            transform: scale(0.95);
        }

        .nav-item {
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-item.active {
            background-color: #16a34a;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .nav-item.visited {
            background-color: #dcfce7;
            color: #15803d;
            border-color: #86efac;
        }

        .feedback-overlay {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto w-full px-4 py-8 flex-grow flex flex-col items-center">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-green-800">Spring Questions</h1>
            <p class="text-green-600">Click a choice to answer!</p>
        </header>

        <!-- Navigation Grid -->
        <div class="w-full bg-white p-4 rounded-2xl shadow-sm border border-green-100 mb-8">
            <div class="flex items-center justify-between mb-4 border-b border-green-50 pb-3">
                <div class="flex gap-2">
                    <button id="btn-prev" class="px-4 py-2 bg-green-100 hover:bg-green-200 rounded-lg font-bold text-green-700 transition-colors">← Back</button>
                    <button id="btn-next" class="px-4 py-2 bg-green-100 hover:bg-green-200 rounded-lg font-bold text-green-700 transition-colors">Next →</button>
                </div>
                <button id="btn-random" class="px-4 py-2 bg-orange-100 hover:bg-orange-200 rounded-lg font-bold text-orange-700">Random 🎲</button>
            </div>
            
            <div id="nav-dots" class="flex flex-wrap justify-center gap-2 max-h-32 overflow-y-auto p-1">
                <!-- Labels generated by JS -->
            </div>
        </div>

        <!-- Main Question Card -->
        <div class="bg-white w-full rounded-3xl shadow-xl border-4 border-white p-8 relative min-auto mb-8 question-card overflow-hidden">
            
            <div id="question-content" class="text-center">
                <div id="q-icon" class="flex justify-center mb-6" style="font-size: 100px; line-height: 1;">
                    <!-- Icon generated by JS -->
                </div>
                <h2 id="q-text" class="text-4xl font-bold mb-10 text-slate-800">Do you like rain?</h2>
                
                <div id="choices-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button onclick="handleAnswer('yes')" class="btn-choice bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-6 rounded-2xl shadow-lg shadow-green-200">
                        Yes I do
                    </button>
                    <button onclick="handleAnswer('no')" class="btn-choice bg-rose-500 hover:bg-rose-600 text-white text-2xl font-bold py-6 rounded-2xl shadow-lg shadow-rose-200">
                        No I do not
                    </button>
                </div>
            </div>

            <!-- Feedback Display (Initially Hidden) -->
            <div id="feedback-display" style="display:none;" class="feedback-overlay flex flex-col items-center justify-center space-y-6">
                <div id="feedback-image" class="w-full max-w-md mx-auto rounded-xl">
                    <!-- Feedback SVG generated by JS -->
                </div>
                <button onclick="closeFeedback()" class="bg-green-600 text-white px-10 py-4 rounded-2xl font-bold text-xl hover:bg-green-700 shadow-lg shadow-green-200 transition-colors">
                    ← Back to Question
                </button>
            </div>

        </div>

        <p class="text-sm text-green-800 opacity-50 font-medium">Topic <span id="q-count">1</span> of <span id="q-total"></span></p>
    </div>

    <script>
        const questions = [
            { id: 1,  label: "Rain",        text: "Do you like rain?",              icon: "🌧️" },
            { id: 2,  label: "Flowers",     text: "Do you like flowers?",           icon: "🌸" },
            { id: 3,  label: "Warm",        text: "Do you like warm weather?",      icon: "🌡️" },
            { id: 4,  label: "Sunny",       text: "Do you like sunny days?",        icon: "☀️" },
            { id: 5,  label: "Birds",       text: "Do you like birds?",             icon: "🐦" },
            { id: 6,  label: "Butterflies", text: "Do you like butterflies?",       icon: "🦋" },
            { id: 7,  label: "Grass",       text: "Do you like grass?",             icon: "🌿" },
            { id: 8,  label: "Trees",       text: "Do you like trees?",             icon: "🌳" },
            { id: 9,  label: "Outside",     text: "Do you like going outside?",     icon: "🏞️" },
            { id: 10, label: "Puddles",     text: "Do you like puddles?",           icon: "💧" },
            { id: 11, label: "Shorts",      text: "Do you like wearing shorts?",    icon: "🩳" },
            { id: 12, label: "Sandals",     text: "Do you like wearing sandals?",   icon: "👡" },
            { id: 13, label: "Strawberries",text: "Do you like strawberries?",      icon: "🍓" },
            { id: 14, label: "Picnics",     text: "Do you like picnics?",           icon: "🧺" },
            { id: 15, label: "Park",        text: "Do you like the park?",          icon: "🏖️" },
            { id: 16, label: "Spring",      text: "Do you like spring?",            icon: "🌱" },
            { id: 17, label: "Windy",       text: "Do you like windy days?",        icon: "💨" },
            { id: 18, label: "Clouds",      text: "Do you like clouds?",            icon: "⛅" },
            { id: 19, label: "Gardens",     text: "Do you like gardens?",           icon: "🪴" },
            { id: 20, label: "Sun",         text: "Do you like the sun?",           icon: "🌤️" },
            { id: 21, label: "Bugs",        text: "Do you like bugs?",              icon: "🐛" },
            { id: 22, label: "Frogs",       text: "Do you like frogs?",             icon: "🐸" },
            { id: 23, label: "Worms",       text: "Do you like worms?",             icon: "🪱" },
            { id: 24, label: "Bees",        text: "Do you like bees?",              icon: "🐝" },
            { id: 25, label: "Mud",         text: "Do you like mud?",               icon: "🟫" },
            { id: 26, label: "Kites",       text: "Do you like kites?",             icon: "🪁" },
            { id: 27, label: "Rainbows",    text: "Do you like rainbows?",          icon: "🌈" },
            { id: 28, label: "Ice Cream",   text: "Do you like ice cream?",         icon: "🍦" },
            { id: 29, label: "Lemonade",    text: "Do you like lemonade?",          icon: "🍋" },
            { id: 30, label: "Bike Rides",  text: "Do you like bike rides?",        icon: "🚲" },
            { id: 31, label: "Swimming",    text: "Do you like swimming?",          icon: "🏊" },
            { id: 32, label: "Watermelon",  text: "Do you like watermelon?",        icon: "🍉" },
            { id: 33, label: "Gardening",   text: "Do you like gardening?",         icon: "🌻" },
            { id: 34, label: "Sprinklers",  text: "Do you like sprinklers?",        icon: "💦" },
            { id: 35, label: "Ladybugs",    text: "Do you like ladybugs?",          icon: "🐞" },
        ];

        let currentIndex = 0;
        const visited = new Set();

        // Shared "do" cell — identical in both cards
        const doCell = `
            <div class="flex flex-col items-center gap-1">
                <span style="font-size:64px; line-height:1;">🙌</span>
                <span class="text-2xl font-bold">do</span>
            </div>`;

        // Visual Templates for Feedback
        const feedbackTemplates = {
            yes: `
                <div class="flex items-center justify-around bg-green-50 p-6 rounded-2xl border-4 border-green-200 gap-4">
                    <div class="flex flex-col items-center gap-1">
                        <span style="font-size:64px; line-height:1;">😊</span>
                        <span class="text-2xl font-bold text-green-800">Yes</span>
                    </div>
                    <span class="text-7xl font-serif font-bold text-slate-800">I</span>
                    ${doCell}
                </div>
            `,
            no: `
                <div class="flex items-center justify-around bg-rose-50 p-6 rounded-2xl border-4 border-rose-200 gap-4">
                    <div class="flex flex-col items-center gap-1">
                        <span style="font-size:64px; line-height:1;">😕</span>
                        <span class="text-2xl font-bold text-rose-800">No</span>
                    </div>
                    <span class="text-7xl font-serif font-bold text-slate-800">I</span>
                    ${doCell}
                    <div class="flex flex-col items-center gap-1">
                        <svg width="64" height="64" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="42" stroke="#e11d48" stroke-width="10" fill="none"/>
                            <line x1="25" y1="25" x2="75" y2="75" stroke="#e11d48" stroke-width="10" stroke-linecap="round"/>
                        </svg>
                        <span class="text-2xl font-bold text-rose-800">not</span>
                    </div>
                </div>
            `
        };

        function init() {
            document.getElementById('q-total').innerText = questions.length;
            renderNav();
            updateDisplay();

            document.getElementById('btn-prev').addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateDisplay();
                }
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    updateDisplay();
                }
            });

            document.getElementById('btn-random').addEventListener('click', () => {
                const oldIndex = currentIndex;
                while (currentIndex === oldIndex) {
                    currentIndex = Math.floor(Math.random() * questions.length);
                }
                updateDisplay();
            });
        }

        function renderNav() {
            const container = document.getElementById('nav-dots');
            container.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('div');
                btn.className = 'nav-item border border-green-200 hover:bg-green-50 text-green-700';
                btn.innerText = q.label;
                btn.onclick = () => {
                    currentIndex = i;
                    updateDisplay();
                };
                container.appendChild(btn);
            });
        }

        function updateNavVisited() {
            const items = document.querySelectorAll('.nav-item');
            items.forEach((item, i) => {
                if (visited.has(i) && i !== currentIndex) {
                    item.classList.add('visited');
                } else {
                    item.classList.remove('visited');
                }
            });
        }

        function updateDisplay() {
            closeFeedback();
            const q = questions[currentIndex];
            document.getElementById('q-text').innerText = q.text;
            document.getElementById('q-icon').innerHTML = q.icon;
            document.getElementById('q-count').innerText = currentIndex + 1;

            // Update Nav State
            const items = document.querySelectorAll('.nav-item');
            items.forEach((item, i) => {
                if (i === currentIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
                else item.classList.remove('active');
            });
            updateNavVisited();

            // Handle nav button availability
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
            document.getElementById('btn-prev').style.opacity = currentIndex === 0 ? "0.3" : "1";
            document.getElementById('btn-next').style.opacity = currentIndex === questions.length - 1 ? "0.3" : "1";
        }

        function handleAnswer(type) {
            const content = document.getElementById('question-content');
            const feedback = document.getElementById('feedback-display');
            const imageContainer = document.getElementById('feedback-image');

            visited.add(currentIndex);
            updateNavVisited();

            imageContainer.innerHTML = feedbackTemplates[type];
            content.style.display = 'none';
            feedback.style.display = 'flex';
        }

        function closeFeedback() {
            document.getElementById('question-content').style.display = '';
            document.getElementById('feedback-display').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
