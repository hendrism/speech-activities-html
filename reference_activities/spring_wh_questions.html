<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f0fdf4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            color: #166534;
        }

        .question-card { transition: all 0.3s ease; }

        .btn-choice {
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-choice:active { transform: scale(0.95); }

        .nav-item {
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nav-item.active {
            background-color: #16a34a;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .nav-item.visited {
            background-color: #dcfce7;
            color: #15803d;
            border-color: #86efac;
        }

        .feedback-overlay { animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .sentence-word {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .sentence-word span.label {
            font-size: 1.25rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="max-w-3xl mx-auto w-full px-4 py-8 flex-grow flex flex-col items-center">

    <!-- Header -->
    <header class="text-center mb-6">
        <h1 class="text-3xl font-bold text-green-800">Spring Choice Questions</h1>
        <p class="text-green-600">Which one do you like better?</p>
    </header>

    <!-- Navigation Grid -->
    <div class="w-full bg-white p-4 rounded-2xl shadow-sm border border-green-100 mb-8">
        <div class="flex items-center justify-between mb-4 border-b border-green-50 pb-3">
            <div class="flex gap-2">
                <button id="btn-prev" class="px-4 py-2 bg-green-100 hover:bg-green-200 rounded-lg font-bold text-green-700 transition-colors">← Back</button>
                <button id="btn-next" class="px-4 py-2 bg-green-100 hover:bg-green-200 rounded-lg font-bold text-green-700 transition-colors">Next →</button>
            </div>
            <button id="btn-random" class="px-4 py-2 bg-orange-100 hover:bg-orange-200 rounded-lg font-bold text-orange-700">Random 🎲</button>
        </div>
        <div id="nav-dots" class="flex flex-wrap justify-center gap-2 max-h-32 overflow-y-auto p-1">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Main Question Card -->
    <div class="bg-white w-full rounded-3xl shadow-xl border-4 border-white p-8 relative mb-8 question-card overflow-hidden">

        <!-- Question View -->
        <div id="question-content" class="text-center">
            <div id="q-icon" class="flex justify-center mb-4" style="font-size: 90px; line-height: 1;"></div>
            <h2 id="q-text" class="text-3xl font-bold mb-8 text-slate-800"></h2>
            <div id="choices-container" class="flex flex-col gap-4"></div>
        </div>

        <!-- Feedback View -->
        <div id="feedback-display" style="display:none;" class="feedback-overlay flex flex-col items-center justify-center space-y-6">
            <div id="feedback-sentence" class="w-full max-w-xl mx-auto"></div>
            <button onclick="closeFeedback()" class="bg-green-600 text-white px-10 py-4 rounded-2xl font-bold text-xl hover:bg-green-700 shadow-lg shadow-green-200 transition-colors">
                ← Back to Question
            </button>
        </div>

    </div>

    <p class="text-sm text-green-800 opacity-50 font-medium">
        Question <span id="q-count">1</span> of <span id="q-total"></span>
    </p>
</div>

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentIndex = 0;
const visited = new Set();

const choiceColors = [
    { bg: "bg-green-500 hover:bg-green-600 shadow-green-200", text: "text-white" },
    { bg: "bg-violet-500 hover:bg-violet-600 shadow-violet-200", text: "text-white" },
    { bg: "bg-sky-500 hover:bg-sky-600 shadow-sky-200", text: "text-white" },
];

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
    document.getElementById('q-total').innerText = questions.length;
    renderNav();
    updateDisplay();

    document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--; updateDisplay(); }
    });
    document.getElementById('btn-next').addEventListener('click', () => {
        if (currentIndex < questions.length - 1) { currentIndex++; updateDisplay(); }
    });
    document.getElementById('btn-random').addEventListener('click', () => {
        const old = currentIndex;
        while (currentIndex === old) currentIndex = Math.floor(Math.random() * questions.length);
        updateDisplay();
    });
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function renderNav() {
    const container = document.getElementById('nav-dots');
    container.innerHTML = '';
    questions.forEach((q, i) => {
        const btn = document.createElement('div');
        btn.className = 'nav-item border border-green-200 hover:bg-green-50 text-green-700';
        btn.innerText = q.label;
        btn.onclick = () => { currentIndex = i; updateDisplay(); };
        container.appendChild(btn);
    });
}

function updateNavVisited() {
    document.querySelectorAll('.nav-item').forEach((item, i) => {
        if (visited.has(i) && i !== currentIndex) item.classList.add('visited');
        else item.classList.remove('visited');
    });
}

// ─── DISPLAY ──────────────────────────────────────────────────────────────────
function updateDisplay() {
    closeFeedback();
    const q = questions[currentIndex];
    document.getElementById('q-text').innerText = q.text;
    document.getElementById('q-icon').innerHTML = q.icon;
    document.getElementById('q-count').innerText = currentIndex + 1;

    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    container.className = q.choices.length === 2
        ? 'grid grid-cols-1 sm:grid-cols-2 gap-4'
        : 'flex flex-col gap-4';

    q.choices.forEach((choice, idx) => {
        const colors = choiceColors[idx % choiceColors.length];
        const btn = document.createElement('button');
        btn.className = `btn-choice ${colors.bg} ${colors.text} text-2xl font-bold py-6 rounded-2xl shadow-lg`;
        btn.innerText = choice.label;
        btn.onclick = () => handleAnswer(idx);
        container.appendChild(btn);
    });

    document.querySelectorAll('.nav-item').forEach((item, i) => {
        if (i === currentIndex) {
            item.classList.add('active');
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
            item.classList.remove('active');
        }
    });
    updateNavVisited();

    document.getElementById('btn-prev').disabled = currentIndex === 0;
    document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
    document.getElementById('btn-prev').style.opacity = currentIndex === 0 ? "0.3" : "1";
    document.getElementById('btn-next').style.opacity = currentIndex === questions.length - 1 ? "0.3" : "1";
}

// ─── ANSWER & FEEDBACK ────────────────────────────────────────────────────────
function handleAnswer(choiceIdx) {
    visited.add(currentIndex);
    updateNavVisited();

    const q = questions[currentIndex];
    const choice = q.choices[choiceIdx];

    const wordsHTML = choice.sentence.map(w => {
        const hasEmoji = w.emoji && w.emoji.trim() !== '';
        return `
            <div class="sentence-word">
                <div class="flex flex-col items-center ${w.color} ${w.textColor} rounded-xl px-3 py-2 min-w-[60px]">
                    ${hasEmoji ? `<span style="font-size:48px; line-height:1.1;">${w.emoji}</span>` : '<div style="height:52px;"></div>'}
                    <span class="label">${w.word}</span>
                </div>
            </div>
        `;
    }).join('');

    document.getElementById('feedback-sentence').innerHTML = `
        <div class="flex items-end justify-center flex-wrap gap-3 bg-green-50 p-6 rounded-2xl border-4 border-green-200">
            ${wordsHTML}
        </div>
    `;

    document.getElementById('question-content').style.display = 'none';
    document.getElementById('feedback-display').style.display = 'flex';
}

function closeFeedback() {
    document.getElementById('question-content').style.display = '';
    document.getElementById('feedback-display').style.display = 'none';
}

window.onload = init;
</script>
